  <body>
    <!--
      M1-1 最终目标 · 单 HTML 产物骨架。
      构建期由 vite-plugin-singlefile 把入口脚本 / 样式内联进本文件，产出唯一 dist/index.html。
      骨架保留产品运行期必需的三区结构（顶部栏 / 左侧栏 / 内容区 / 右侧栏）与折叠按钮、toast，
      使单文件产物脱离测试注入脚本后仍可独立启动。
    -->
    <div id="app">
      <header id="topbar">
        <span class="tb-clock" id="tbClock">--</span>
        <nav class="tb-nav" id="tbNav"></nav>
        <div class="tb-right">
          <button class="tb-wbtn close" id="btnClose" type="button" title="关闭">×</button>
        </div>
      </header>
      <div id="body">
        <aside id="sidebarLeft"></aside>
        <main id="main">
          <div id="content"></div>
          <button class="main-toggle left" id="btnToggleLeft" type="button" title="收起左侧栏"></button>
          <button class="main-toggle both" id="btnToggleBoth" type="button" title="同时折叠左右侧栏" aria-pressed="false"></button>
          <button class="main-toggle right" id="btnToggleRight" type="button" title="收起右侧栏"></button>
        </main>
        <aside id="sidebarRight"></aside>
      </div>
    </div>
    <div id="toast"></div>
  </body>
</html>
