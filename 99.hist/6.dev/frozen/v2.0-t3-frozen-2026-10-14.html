const VDB_NAME='juju-versions';
const VDB_VERSION=1;
const VDB_CHANNEL='juju-vdb';
/* FIX-H-12 版本库不可用一次性提示（隐私模式/IndexedDB 被禁），避免每次快照/列表都刷屏 */
let _vdbUnavailableToastShown=false;
function toastVDBUnavailable(){
  if(_vdbUnavailableToastShown)return;
  _vdbUnavailableToastShown=true;
  try{toast('版本历史在当前环境不可用');}catch(e){}

const VDB={
  db:null,opening:null,writable:true,bc:null,_bcReady:false,__tabId:null,unavailable:false,
  initChannel(){
    if(this._bcReady)return;
    this._bcReady=true;
    try{this.bc=new BroadcastChannel(VDB_CHANNEL);this.bc.onmessage=(e)=>this._onBcMessage(e.data);}
    catch(e){this.bc=null;}
  },
  _tabId(){if(!this.__tabId)this.__tabId=Math.random().toString(36).slice(2,8);return this.__tabId;},
  _broadcast(msg){if(this.bc){try{this.bc.postMessage(msg);}catch(e){}}},
  _onBcMessage(msg){
    if(!msg||!msg.type)return;
    if(msg.type==='upgrade-request'){
      if(this.db){
        try{this.db.close();}catch(e){}
        this.db=null;
        this.writable=false;
        this._broadcast({type:'closed',from:this._tabId()});
        setTimeout(()=>this.ensure().catch(()=>{}),400);
      }
    }
  },
  ensure(){
    if(this.db)return Promise.resolve(this.db);
    if(this.opening)return this.opening;
    this.initChannel();
    this.opening=new Promise((resolve,reject)=>{
      let blockedTimer=null;
      let settled=false;
      let req;
      try{req=indexedDB.open(VDB_NAME,VDB_VERSION);}
      catch(e){this.opening=null;this.unavailable=true;toastVDBUnavailable();reject(e);return;} /* FIX-H-12 IndexedDB 同步抛错（隐私模式/禁用）：记录不可用并一次性 toast */
      req.onupgradeneeded=(e)=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('snapshots')){
          const os=db.createObjectStore('snapshots',{keyPath:'id',autoIncrement:true});
          os.createIndex('docId','docId',{unique:false});
          os.createIndex('ts','ts',{unique:false});
        }
        if(!db.objectStoreNames.contains('meta')){
          db.createObjectStore('meta',{keyPath:'k'});
        }
      };
      req.onsuccess=()=>{
        clearTimeout(blockedTimer);
        if(settled){req.result.close();return;}
        settled=true;
        const db=req.result;
        this.db=db;
        this.writable=true;
        db.onversionchange=()=>{
          try{db.close();}catch(e){}
          this.db=null;
          this.writable=false;
          this._broadcast({type:'closed',from:this._tabId()});
          setTimeout(()=>this.ensure().catch(()=>{}),500);
        };
        db.onclose=()=>{this.db=null;this.writable=false;};
        this.opening=null;
        resolve(db);
      };
      req.onerror=()=>{
        clearTimeout(blockedTimer);
        this.opening=null;
        this.unavailable=true; /* FIX-H-12 open 请求失败：标记不可用 */
        if(!settled){settled=true;toastVDBUnavailable();reject(req.error);}
      };
      req.onblocked=()=>{
        this.writable=false;
        this._broadcast({type:'upgrade-request',v:VDB_VERSION});
        toast('另一个标签页正在使用版本库，正在等待其释放…');
        blockedTimer=setTimeout(()=>{
          if(!settled)toast('版本库被其它标签页占用，请关闭其它JU标签页后刷新');
        },8000);
      };
    }).finally(()=>{this.opening=null;});
    return this.opening;
  },
  async tx(storeNames,mode,fn){
    const db=await this.ensure();
    /* 【H4/fixed22】readwrite 请求但 DB 不可写（被其他标签占用 ~500ms 重连窗口）：
       原静默降级为 readonly 导致 store.add 抛 ReadOnlyError 非预期。改为显式抛错，
       调用方可 catch 后 toast/reportError。readonly 请求不受影响。 */
    if(mode==='readwrite'&&!this.writable){
      const err=new Error('VDB readonly: store locked by another tab');
      err.code='VDB_READONLY';
      throw err;
    }
    const tx=db.transaction(storeNames,mode);
    const stores=Array.isArray(storeNames)?storeNames.map(n=>tx.objectStore(n)):[tx.objectStore(storeNames)];
    const result=await fn(...stores,tx);
    await new Promise((res,rej)=>{
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
      tx.onabort=()=>rej(tx.error||new Error('tx aborted'));
    });
    return result;
  },
  close(){if(this.db){try{this.db.close();}catch(e){}this.db=null;}},
  destroy(){
    this.close();
    if(this.bc){try{this.bc.close();}catch(e){}this.bc=null;}
    this._bcReady=false;
    return new Promise((res)=>{
      const req=indexedDB.deleteDatabase(VDB_NAME);
      req.onsuccess=req.onerror=req.onblocked=()=>res();
    });
  }
};
function idbReq(req){

let _versSalt=null;
let _versSaltPromise=null;
async function getVersSalt(){
  if(_versSalt)return _versSalt;
  if(_versSaltPromise)return _versSaltPromise;
  _versSaltPromise=(async()=>{
    const row=await VDB.tx('meta','readonly',(store)=>idbReq(store.get('salt')));
    if(row&&row.v){_versSalt=b64ToBuf(row.v);return _versSalt;}
    const salt=crypto.getRandomValues(new Uint8Array(16));
    await VDB.tx('meta','readwrite',(store)=>{store.put({k:'salt',v:bufToB64(salt)});});
    _versSalt=salt;
    return salt;
  })();
  return _versSaltPromise;
}
async function writeSnapshot(docId,ts,title,nodes){
  let record={docId,ts,title};
  if(ui.encrypted && ui.encKey){
    const salt=await getVersSalt();
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await deriveKey(ui.encKey,salt,ENC_ITER);
    const plain=new TextEncoder().encode(JSON.stringify(nodes));
    const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);
    record.enc=true;
    record.iv=bufToB64(iv);
    record.cipher=bufToB64(cipher);
  }else{
    record.enc=false;
    record.nodes=nodes;
  }
  if(IS_DESKTOP){
    /* 桌面版：快照写入 SQLite（加密逻辑仍在前端，Rust 只存 JSON 记录） */
    try{
      await desktopInvoke('save_snapshot',{docId,ts,title:title||'',data:JSON.stringify(record)});
    }catch(e){console.warn('[JU] snapshot save failed',e);}
    return;
  }
  await VDB.tx('snapshots','readwrite',async(store)=>{
    store.add(record);
    const idx=store.index('docId');
    const keys=await new Promise((res,rej)=>{
      const out=[];
      const req=idx.openCursor(IDBKeyRange.only(docId));
      req.onsuccess=()=>{
        const cur=req.result;
        if(!cur){res(out);return;}
        out.push(cur.primaryKey);
        cur.continue();
      };
      req.onerror=()=>rej(req.error);
    });
    const keep=30;
    const toDelete=keys.slice(0,Math.max(0,keys.length-keep));
    for(const k of toDelete)store.delete(k);
  });
}

  }catch(e){}
}

      const n=clone(state.nodes[id]);
      if(n){delete n._deleted;nodes[id]=n;}
    });
    await writeSnapshot(docId,Date.now(),stripHtml(doc.text||'未命名'),nodes);
  }catch(e){
    console.warn('snapshot failed',e); /* FIX-H-12 console.warn 保留 */
    /* FIX-L-05 VDB_READONLY（DB 被其它标签占用）不再静默吞错，一次性 toast */
    try{if(e&&e.code==='VDB_READONLY')toast('版本库暂时被其它标签占用，将在空闲后补存快照');}catch(_){}
    /* FIX-H-12 其它写失败且版本库整体不可用时，复用一次性降级提示 */
    try{if(VDB.unavailable)toastVDBUnavailable();}catch(_){}
  }finally{
    _versionRunning=false;
    /* FIX-L-05 补执行被并发跳过的快照 */
    if(_versionRetryQueued){_versionRetryQueued=false;takeVersionSnapshot();}
  }
}

const JU_VER='fixed23';
const STATE_VER=18;
const AUTO_BACKUP_KEY='juju.autobackup.v18';
function migrateStateObject(st){

  try{
    if(!st||typeof st!=='object')return null;
    if(!st.nodes||typeof st.nodes!=='object')return null;
    if(!st.rootId||!st.nodes[st.rootId]){
      let rootId=null;
      for(const id in st.nodes){
        const n=st.nodes[id];
        if(n&&(n._isRoot||n.text==='我的文档')){rootId=id;break;}
      }
      if(!rootId){
        for(const id in st.nodes){
          const n=st.nodes[id];
          if(n&&(!n.parent||n.parent===id)){rootId=id;break;}
        }
      }
      if(!rootId)return null;
      st.rootId=rootId;
    }
    const root=st.nodes[st.rootId];
    if(!root||typeof root!=='object')return null;
    if(typeof root.children==='undefined')root.children=[];
    stripDangerKeys(st.nodes); /* FIX-H-04b 迁移路径同样清洗危险键（boot 直连 localStorage 旧数据时的纵深防御） */
    for(const id in st.nodes){
      const n=st.nodes[id];
      if(!n||typeof n!=='object'){delete st.nodes[id];continue;}
      if(n.parent===id)delete n.parent;
      if(!Array.isArray(n.children))n.children=[];
      n.children=n.children.filter(c=>c&&c!==id&&c!==st.rootId&&st.nodes[c]);
    }
    const v=validateImportedTree(st);
    if(!v.ok){
      /* FIX-H-02 回收站节点集合（state.trashed[].rootId/ids）：不可达修复时不得把它们重新挂回主树，保持其在 nodes 中但 _deleted/不在活树 children 的原状 */
      const trashedIds=new Set();
      if(Array.isArray(st.trashed))st.trashed.forEach(t=>{
        if(!t)return;
        if(t.rootId)trashedIds.add(t.rootId);
        if(Array.isArray(t.ids))t.ids.forEach(i=>{if(i)trashedIds.add(i);});
      });
      const reach=new Set();const queue=[st.rootId];const seen=new Set();
      while(queue.length){
        const id=queue.shift();
        if(seen.has(id))continue;seen.add(id);
        const n=st.nodes[id];if(!n)continue;
        reach.add(id);
        (n.children||[]).forEach(c=>{if(st.nodes[c]&&!seen.has(c))queue.push(c);});
      }
      for(const id in st.nodes){
        if(reach.has(id))continue;
        if(trashedIds.has(id))continue; /* FIX-H-02 回收站节点跳过挂回，保持 _deleted 与脱离活树的状态 */
        const n=st.nodes[id];
        /* 【修复 F-19】不可达节点不再静默删除：统一挂回根节点下保留数据（原逻辑仅系统容器挂回、其余 delete） */
        if(n&&typeof n==='object'){
          n.parent=st.rootId;
          if(!st.nodes[st.rootId].children.includes(id))st.nodes[st.rootId].children.push(id);
          continue;
        }
        delete st.nodes[id];
      }
      const v2=validateImportedTree(st);
      if(!v2.ok)return null;
    }
    if(typeof st.tagColors==='undefined')st.tagColors={};
    if(typeof st.dbFields==='undefined')st.dbFields=['标题','优先级','状态','时间'];
    if(typeof st.activity==='undefined')st.activity={};
    /* 【F8/fixed19】activity 每个日期桶的 add/mod/del 强转为数组：旧备份若为对象，
       logActivity.push 会抛 TypeError 被 commit try/catch 静默吞掉，导致日志失效。 */
    for(const ds in st.activity){
      if(!st.activity[ds]||typeof st.activity[ds]!=='object'){st.activity[ds]={add:[],mod:[],del:[]};continue;}
      for(const k of ['add','mod','del']){
        if(!Array.isArray(st.activity[ds][k]))st.activity[ds][k]=[];
      }
    }
    if(typeof st._rev!=='number')st._rev=parseInt(st._rev,10)||0;
    if(typeof st.updatedAt!=='number')st.updatedAt=Date.now();
    /* FIX-ORIGIN-1: 旧备份/导入数据归一化 _localCreated（去重 + 只保留存在的节点；无硬上限——
       批量导入保护优先于集合体积），避免脏数据污染删除传播保护集合 */
    try{
      const lc=Array.isArray(st._localCreated)?st._localCreated.filter((id,i,a)=>typeof id==='string'&&st.nodes[id]&&a.indexOf(id)===i):[];
      st._localCreated=lc;
    }catch(e){try{st._localCreated=[];}catch(e2){}}
    /* FIX-TOMB-1: 归一化持久化墓碑——只保留 30s 内未过期条目，空对象直接删除 */
    try{
      if(st._tombstones&&typeof st._tombstones==='object'){
        const _now=Date.now();
        for(const k in st._tombstones){const _ts=+st._tombstones[k];if(!_ts||_now-_ts>30000)delete st._tombstones[k];}
        if(!Object.keys(st._tombstones).length)delete st._tombstones;
      }
    }catch(e){}
    if(typeof st._ver==='undefined')st._ver=STATE_VER;
    else st._ver=STATE_VER;
    return st;
  }catch(e){
    console.error('[JU] migrateStateObject failed',e);
    return null;
  }
}

function repairSnapshotNodes(nodes){  if(!nodes||typeof nodes!=='object')return {};  const out={};

let _lastAutoBackupTs=0; /* 【修复 F-16】自动备份限频句柄 */
function saveAutoBackup(force){
  try{
    if(ui.locked)return;
    const now=Date.now();
    /* FIX-ENC-BACKUP-2: 节流提前到加密分支之前——明文/加密统一 10s 限频。
       原实现加密分支在节流检查前 return，连续 commit 时每次写盘都触发一次 IndexedDB IO。
       关闭时 force=true 跳过节流但仍更新 _lastAutoBackupTs，避免与周期备份重复写。 */
    if(!force&&now-_lastAutoBackupTs<10000)return;
    /* 【H5/fixed22】加密模式不写明文自动备份（避免明文残留）；改为写「加密版本快照」到 IndexedDB
       （versions 表已有 AES-GCM 加密机制），主存储配额满/丢失时仍有一份加密兜底（FIX-ENC-BACKUP-1） */
    if(ui.encrypted){
      try{saveEncryptedAutoBackup();}catch(e){}
      _lastAutoBackupTs=now;
      return;
    }
    /* 【F14/fixed19】限频 60s→10s：缩短明文崩溃恢复窗口，崩溃后最多丢 10s 而非 60s。
       【fixed23】force=true（关闭时触发）跳过节流但仍更新 _lastAutoBackupTs，避免与周期备份重复写。 */
    const cur=getState();
    if(!cur||!cur.nodes||!cur.rootId)return;
    /* 【修复 F-16】主库接近配额阈值时跳过自动备份并提示，避免双份叠加 QuotaExceeded 且静默吞错 */
    const mainLen=((localStorage.getItem(STORE_KEY)||'').length)||0;
    if(mainLen>3500000){
      try{toast('存储空间接近上限，已暂停自动备份，请尽快导出备份');}catch(e){}
      return;
    }
    const payload={state:clone(cur),ui:uiSnapshot(),graphpos:clone(_graphPositions||{}),ts:now};
    localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify(payload));
    _lastAutoBackupTs=now;
  }catch(e){
    console.warn('[JU] saveAutoBackup failed',e);
    try{reportError('autobackup',{msg:'自动备份失败：'+String((e&&e.message)||e)});}catch(_){}
  }
}
/* FIX-ENC-BACKUP-1: 加密模式自动备份——整份 state（含 nodes/dbFields/trashed/tagColors 等）加密后写入
   IndexedDB versions 表（docId='__autobackup__'），与 writeSnapshot 同一 AES-GCM + 派生盐机制。
   明文模式主存储配额满时 writeEncryptedStore 会失败，此时唯一兜底即本备份（可经完整备份导出携带，
   未来主存储恢复后亦可手动救援）。限 5 条滚动。 */
async function saveEncryptedAutoBackup(){
  try{
    if(!(ui&&ui.encrypted&&ui.encKey))return;
    const cur=getState();
    if(!cur||!cur.nodes||!cur.rootId)return;
    const salt=await getVersSalt();
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await deriveKey(ui.encKey,salt,ENC_ITER);
    const plain=new TextEncoder().encode(JSON.stringify(cur));
    const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);
    const record={docId:'__autobackup__',ts:Date.now(),title:'自动备份（加密）',enc:true,iv:bufToB64(iv),cipher:bufToB64(cipher)};
    if(IS_DESKTOP){
      try{await desktopInvoke('save_snapshot',{docId:'__autobackup__',ts:record.ts,title:record.title,data:JSON.stringify(record)});}catch(e){}
      return;
    }
    await VDB.tx('snapshots','readwrite',async(store)=>{
      store.add(record);
      const idx=store.index('docId');
      const keys=await new Promise((res,rej)=>{
        const out=[];
        const req=idx.openCursor(IDBKeyRange.only('__autobackup__'));
        req.onsuccess=()=>{
          const cur2=req.result;
          if(!cur2){res(out);return;}
          out.push(cur2.primaryKey);
          cur2.continue();
        };
        req.onerror=()=>rej(req.error);
      });
      const keep=5;
      const toDelete=keys.slice(0,Math.max(0,keys.length-keep));
      for(const k of toDelete)store.delete(k);
    });
  }catch(e){
    try{reportError('encbackup',{msg:'加密自动备份失败：'+String((e&&e.message)||e)});}catch(_){}
  }
}

  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error('读取失败'));
    r.readAsArrayBuffer(file);
  });
}

  _modalStack.push(modal);

  const close=()=>{document.removeEventListener('keydown',onFbKey);modal.remove();const i=_modalStack.indexOf(modal);if(i>=0)_modalStack.splice(i,1);};

<script>
/* ===== FIX-a11y-4（v2）: 键盘可达性补强 =====
   v2 变更：
   - roving tabindex（#2）：日历网格(.cal-grid)与侧栏树(.sb-subtree 展开态)改为组内单 tab stop——
     当前项 tabindex=0、其余 -1，方向键移动，Enter/Space 触发，避免 Tab 遍历 28-42 个日期格/几十行树节点。
   - 去抖（#5）：MutationObserver 收集 addedNodes，requestAnimationFrame 批量处理，避免大列表频繁渲染占用主线程。
   - .cal-sel 保持原 tabindex=0 与方向键/Enter/Esc 内置处理，不重复绑定；
     不在任何 .sb-subtree 内的独立 .sb-row 兜底给 tabindex=0 + Enter/Space 触发 click。 */
(function(){
  function getItems(container,itemSel,cfg){
    return [].filter.call(container.querySelectorAll(itemSel),()=>{
      if(cfg.expandedOnly&&!container.classList.contains('open'))return false;
      return true;
    });
  }
  function refreshRoving(container,itemSel,cfg){
    const items=getItems(container,itemSel,cfg);
    if(!items.length)return;
    let cur=items[0];
    if(cfg.cols){
      cur=container.querySelector('.cal-cell.selected')||container.querySelector('.cal-cell.today')||items[0];
    }
    items.forEach(x=>x.tabIndex=-1);
    cur.tabIndex=0;
  }
  function setupRoving(container,itemSel,cfg){
    if(!container._rovingNav){
      container._rovingNav=true;
      container.addEventListener('keydown',e=>{
        const items=getItems(container,itemSel,cfg);
        if(!items.length)return;
        const cur=document.activeElement;
        const idx=items.indexOf(cur);
        if(idx<0)return;
        let nxt=-1;
        if(cfg.cols){
          if(e.key==='ArrowRight')nxt=(idx+1)%items.length;
          else if(e.key==='ArrowLeft')nxt=(idx-1+items.length)%items.length;
          else if(e.key==='ArrowDown')nxt=Math.min(items.length-1,idx+cfg.step);
          else if(e.key==='ArrowUp')nxt=Math.max(0,idx-cfg.step);
        }else{
          if(e.key==='ArrowDown')nxt=Math.min(items.length-1,idx+1);
          else if(e.key==='ArrowUp')nxt=Math.max(0,idx-1);

          e.preventDefault();
          items.forEach((x,i)=>x.tabIndex=i===nxt?0:-1);
          items[nxt].focus();
          return;
        }
        if(e.key==='Enter'||e.key===' '){e.preventDefault();if(typeof cur.click==='function')cur.click();}
      });
    }
    refreshRoving(container,itemSel,cfg);
  }
  const GRID_CFG={cols:7,step:7};
  const TREE_CFG={vertical:true,expandedOnly:true};
  function decorate(el){
    if(!el||el.nodeType!==1)return;
    if(el.querySelectorAll){
      [].forEach.call(el.querySelectorAll('.sb-arrow:not(.leaf)'),x=>{if(!x.getAttribute('aria-label'))x.setAttribute('aria-label','展开或折叠子项');});
      [].forEach.call(el.querySelectorAll('.drag-handle'),x=>{if(!x.getAttribute('aria-label'))x.setAttribute('aria-label','拖动排序或移动');});
      [].forEach.call(el.querySelectorAll('.cal-sel-arrow'),x=>{if(x.getAttribute('aria-hidden')!=='true')x.setAttribute('aria-hidden','true');});
      [].forEach.call(el.querySelectorAll('.cal-sel'),x=>{if(!x.hasAttribute('tabindex'))x.tabIndex=0;});
      [].forEach.call(el.querySelectorAll('.cal-grid'),x=>setupRoving(x,'.cal-cell',GRID_CFG));
      [].forEach.call(el.querySelectorAll('.sb-subtree'),x=>setupRoving(x,'.sb-row:not(.sb-empty)',TREE_CFG));
      [].forEach.call(el.querySelectorAll('.sb-row:not(.sb-empty)'),x=>{
        if(x.closest&&x.closest('.sb-subtree'))return;
        if(!x.hasAttribute('tabindex'))x.tabIndex=0;
        if(!x._kbEnter){
          x._kbEnter=true;
          x.addEventListener('keydown',e=>{
            if(e.key==='Enter'||e.key===' '){e.preventDefault();if(typeof x.click==='function')x.click();}
          });
        }
      });
    }
    if(el.classList&&(el.classList.contains('cal-grid')))setupRoving(el,'.cal-cell',GRID_CFG);
    if(el.classList&&(el.classList.contains('sb-subtree')))setupRoving(el,'.sb-row:not(.sb-empty)',TREE_CFG);
    if(el.classList&&el.classList.contains('cal-sel')&&!el.hasAttribute('tabindex'))el.tabIndex=0;
    const sub=el.closest&&el.closest('.sb-subtree');
    if(sub)refreshRoving(sub,'.sb-row:not(.sb-empty)',TREE_CFG);
  }
  /* 去抖：rAF 批量处理新增节点 */
  const queue=[];let rafId=0;
  function flush(){
    rafId=0;
    while(queue.length)decorate(queue.shift());
  }
  function schedule(n){queue.push(n);if(!rafId)rafId=requestAnimationFrame(flush);}
  decorate(document);
  const mo=new MutationObserver(muts=>{
    for(const m of muts){
      if(m.type==='attributes'&&m.attributeName==='class'){
        const t=m.target;
        if(t&&t.nodeType===1&&t.classList){
          if(t.classList.contains('sb-subtree')||t.classList.contains('cal-grid'))schedule(t);
          else if(t.closest){const sub=t.closest('.sb-subtree');if(sub)schedule(sub);}
        }
        continue;
      }
      for(const n of m.addedNodes){
        if(n&&n.nodeType===1)schedule(n);
      }
    }
  });
  mo.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
})();
</script>
</body>
