/* 法定节假日（休）数据：来源为国务院办公厅各年度《部分节假日安排的通知》，
   每项为 [起年,起月,起日,止年,止月,止日]，按年份升序；仅收录通知中的放假日期（含周末连休），
   调休上班日不收录（如2026年9月20日、10月10日）。2027年安排待国务院发布后补充。 */
const HOLIDAY_REST=[
  /* 2024（国办发明电〔2023〕7号） */
  [2024,1,1,2024,1,1],[2024,2,10,2024,2,17],[2024,4,4,2024,4,6],[2024,5,1,2024,5,5],[2024,6,10,2024,6,10],[2024,9,15,2024,9,17],[2024,10,1,2024,10,7],
  /* 2025（国办发明电〔2024〕6号） */
  [2025,1,1,2025,1,1],[2025,1,28,2025,2,4],[2025,4,4,2025,4,6],[2025,5,1,2025,5,5],[2025,5,31,2025,6,2],[2025,10,1,2025,10,8],
  /* 2026（国办发明电〔2025〕7号） */
  [2026,1,1,2026,1,3],[2026,2,15,2026,2,23],[2026,4,4,2026,4,6],[2026,5,1,2026,5,5],[2026,6,19,2026,6,21],[2026,9,25,2026,9,27],[2026,10,1,2026,10,7]
  /* FIX-i18n-2: 2027 及以后数据待国务院办公厅发布《部分节假日安排的通知》后补充；
     节假日排班属外部权威数据，禁止编造。超出本表范围的日期 isRestDay 返回 false（见下），
     即不标注法定休假日（周末/其他标注逻辑不变），属合理降级而非顺延/回退。 */
];
function isRestDay(y,m,d){
  const t=y*10000+m*100+d;
  for(let i=0;i<HOLIDAY_REST.length;i++){
    const a=HOLIDAY_REST[i];
    const s=a[0]*10000+a[1]*100+a[2],e=a[3]*10000+a[4]*100+a[5];
    if(t>=s&&t<=e)return true;
    if(a[0]>y)return false;
  }
  /* FIX-i18n-2: 表尾未覆盖（含 2027+）时落到这里——无顺延/回退，返回 false 视为非法定休假日 */
  return false;
}
function dayLabel(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const key=pad(m)+'-'+pad(d);
  const rest=isRestDay(y,m,d);
  if(SOLAR_FEST[key])return{text:SOLAR_FEST[key],fest:true,rest};
  const lu=solarToLunar(y,m,d);
  if(lu){
    const lk=lu.month+'-'+lu.day;
    if(!lu.isLeap&&LUNAR_FEST[lk])return{text:LUNAR_FEST[lk],fest:true,rest};
    if(lu.day===1)return{text:(lu.isLeap?'闰':'')+lunarMonthStr(lu.month),fest:false,rest};
    return{text:lunarDayStr(lu.day),fest:false,rest};
  }
  return{text:'',fest:false,rest};
}

function parseNaturalDate(str){
  str=str.trim().toLowerCase();
  const now=new Date();
  const result={date:null,time:null,recur:null};
  const recurMap={
    '每周一':{freq:'weekly',interval:1,weekday:1},
    '每周二':{freq:'weekly',interval:1,weekday:2},
    '每周三':{freq:'weekly',interval:1,weekday:3},
    '每周四':{freq:'weekly',interval:1,weekday:4},
    '每周五':{freq:'weekly',interval:1,weekday:5},
    '每周六':{freq:'weekly',interval:1,weekday:6},
    '每周日':{freq:'weekly',interval:1,weekday:0},
    '每周天':{freq:'weekly',interval:1,weekday:0},
    '每天':{freq:'daily',interval:1},'每日':{freq:'daily',interval:1},
    '每周':{freq:'weekly',interval:1},
    '每月':{freq:'monthly',interval:1},'每年':{freq:'yearly',interval:1},
    '每法定工作日':{freq:'workday',interval:1},'法定工作日':{freq:'workday',interval:1},'工作日':{freq:'workday',interval:1},
    '农历年重复':{freq:'lunar',interval:1},'农历年':{freq:'lunar',interval:1},'农历':{freq:'lunar',interval:1}
  };
  const _recurKeys=Object.keys(recurMap).sort((a,b)=>b.length-a.length);
  for(const key of _recurKeys){
    if(str.includes(key)){result.recur=recurMap[key];break;}
  }
  if(str.includes('明天'))result.date=ymd(new Date(now.getTime()+86400000));
  else if(str.includes('后天'))result.date=ymd(new Date(now.getTime()+2*86400000));
  else if(str.includes('今天')||str.includes('今日'))result.date=ymd(now);
  else if(str.includes('下周')){
    const dayMap={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
    let found=false;
    for(const d in dayMap){
      if(str.includes('下周'+d)){
        const target=dayMap[d];
        const cur=now.getDay();
        const daysToNextMonday=cur===0?1:(8-cur);
        const nextMonday=new Date(now.getFullYear(),now.getMonth(),now.getDate()+daysToNextMonday);
        const offset=(target===0?6:target-1);
        const targetDate=new Date(nextMonday.getFullYear(),nextMonday.getMonth(),nextMonday.getDate()+offset);
        result.date=ymd(targetDate);found=true;break;
      }
    }
    if(!found)result.date=ymd(new Date(now.getTime()+7*86400000));
  }else{
    const m2=str.match(/(\d{1,2})月(\d{1,2})[号日]?/);
    if(m2){
      const mo=parseInt(m2[1])-1;
      const da=parseInt(m2[2]);
      const yr=now.getFullYear();
      let dt=new Date(yr,mo,da);
      if(dt<now)dt=new Date(yr+1,mo,da);
      result.date=ymd(dt);
    }
  }
  let _period=null;
  if(/下午|晚上|傍晚/.test(str))_period='pm';
  else if(/上午|早上|凌晨/.test(str))_period='am';
  const tm=str.match(/(\d{1,2})[:点：](\d{1,2})?/);
  if(tm){
    let h=parseInt(tm[1],10);
    let mi=tm[2]?parseInt(tm[2],10):0;
    if(!isNaN(h)&&h>=0&&h<=23){
      if(isNaN(mi)||mi<0||mi>59)mi=0;
      if(_period==='pm'&&h<12)h+=12;
      if(_period==='am'&&h===12)h=0;
      result.time=pad(h)+':'+pad(mi);
    }
  }else if(str.includes('早上')||str.includes('上午')){result.time='09:00';}
  else if(str.includes('下午')){result.time='14:00';}
  else if(str.includes('晚上')){result.time='19:00';}
  if(result.recur&&result.recur.weekday!=null&&!result.date){
    const _now=new Date();
    const _cur=_now.getDay();
    let _diff=result.recur.weekday-_cur;
    if(_diff<0)_diff+=7;
    result.date=ymd(new Date(_now.getFullYear(),_now.getMonth(),_now.getDate()+_diff));
  }
  return (result.date||result.time||result.recur)?result:null;
}

/* FIX-P3-21: 记事本多根去重统一函数——ensureNoteDoc 原 setTimeout(400) 依赖对端合并时序、竞态脆弱，
   改为同步可重入：本地新建 + mergeRemoteState 尾部各调用一次（合并带来的第二根在合并路径内被立即收敛）；
   只保留 createdAt 最早的根，其余根的 children 挂入保留根并从旧父摘除。 */
function dedupNoteRoots(){
  try{
    const all=Object.values(state.nodes).filter(n=>n&&n._isNoteRoot&&!n._deleted);
    if(all.length<=1)return;
    all.sort((a,b)=>((a.createdAt||0)-(b.createdAt||0))||(a.id<b.id?-1:a.id>b.id?1:0));
    const keep=all[0];
    all.slice(1).forEach(d=>{
      commit(s=>{
        const k=s.nodes[keep.id],dd=s.nodes[d.id];
        if(!k||!dd)return;
        (dd.children||[]).forEach(c=>{
          if(s.nodes[c]){
            s.nodes[c].parent=keep.id;
            if(!k.children.includes(c))k.children.push(c);
          }
        });
        const p=s.nodes[dd.parent];
        if(p&&Array.isArray(p.children)){const i=p.children.indexOf(d.id);if(i>=0)p.children.splice(i,1);}
        delete s.nodes[d.id];
      },{snapshot:true,noHistory:true}); /* FIX-P2-5: noHistory 阻止入撤销栈——原 snapshot:true 会让 Ctrl+Z「撤销去重」复活已合并的重复根，再次触发合并 */
    });

     合并带来的对端记事本由 mergeRemoteState 尾部同函数兜底收敛，不再依赖对端合并时序） */
  dedupNoteRoots();
  return nid;
}

function startCalTgTimer(wrap){
  clearCalTgTimer();

  if(!scroll||!line)return;
  let lastDate=cnYmd(cnNow()),lastUserScroll=0;
  const onUserScroll=()=>{lastUserScroll=Date.now();};
  scroll.addEventListener('wheel',onUserScroll,{passive:true});
  scroll.addEventListener('touchstart',onUserScroll,{passive:true});
  scroll.addEventListener('pointerdown',onUserScroll);

    if(!line.isConnected){clearCalTgTimer();return;} /* 视图已卸载：立即清理定时器 */
    const now=cnNow(),ds=cnYmd(now);
    const y=(now.getHours()+now.getMinutes()/60)*tgHourH();
    const t=pad(now.getHours())+':'+pad(now.getMinutes());
    line.style.transform='translateY('+y+'px)'; /* transform 更新，避免布局抖动 */

      _calTgAutoKey=''; /* 新渲染强制自动滚动到当前时间（顶部） */
      forceRender();
      return;
    }

    if(Date.now()-lastUserScroll>45000){
      const r=scroll.getBoundingClientRect(),ly=line.getBoundingClientRect().top;
      if(ly<r.top+10||ly>r.bottom-10){
        scroll.scrollTo({top:Math.max(0,scroll.scrollTop+(y-r.height*0.33)),behavior:'smooth'});
      }

/* 严格解析时间格式：时间点「8:00」或时间段「8:00-9:00」。

function dbFormulaEval(row,field){

    const cache=new Map();

      if(cache.has(name))return cache.get(name);
      cache.set(name,null);
      let v;
      try{
        const def=(state.dbFields||[]).find(f=>dbFieldName(f)===name)||{name,type:'text'};
        if(dbFieldType(def)==='formula'){
          v=dbFormulaEval(row,def);
        }else if(name===dbPrimaryField()){ /* FIX-DB-11: 原硬编码 name==='标题'；主列判定改用 dbPrimaryField，重命名后公式引用主列仍读 n.text */
          v=stripHtml(row.text||'');
        }else{

      }catch(e){v=null;}

    };

function dbFormulaDisplay(v){

function dbFilterRuleActive(f){

function dbRowMatches(n,f){
  const t=dbFieldType(f.field);
  const raw=dbRawValue(n,f.field);
  const s=dbTextValue(n,f.field);
  const empty=(raw==null||raw===''||s===''||(Array.isArray(raw)&&!raw.length));
  const op=f.op;
  if(op==='empty')return empty;
  if(op==='not_empty')return !empty;
  if(empty)return false;
  if(t==='number'||t==='formula'){
    const nv=dbNumValue(n,f.field);
    const fv=Number(f.value);
    if(op==='contains'||op==='not_contains'){
      const hit=s.includes(String(f.value));
      return op==='contains'?hit:!hit;
    }
    if(nv==null||isNaN(fv))return false;
    switch(op){
      case 'is': return nv===fv;
      case 'is_not': return nv!==fv;
      case 'gt': return nv>fv;
      case 'gte': return nv>=fv;
      case 'lt': return nv<fv;
      case 'lte': return nv<=fv;
    }

    const d1=s.split(' ')[0],d2=String(f.value).split(' ')[0];
    switch(op){
      case 'is': return d1===d2;
      case 'is_not': return d1!==d2;
      case 'before': return d1<d2;
      case 'after': return d1>d2;
    }
  }else if(t==='multi_select'){
    const arr=Array.isArray(raw)?raw:[];
    switch(op){
      case 'is': return arr.includes(String(f.value));
      case 'is_not': return !arr.includes(String(f.value));
      case 'contains': return arr.some(v=>String(v).includes(String(f.value)));
      case 'not_contains': return !arr.some(v=>String(v).includes(String(f.value)));
    }
  }else{
    switch(op){
      case 'is': return s===String(f.value);
      case 'is_not': return s!==String(f.value);
      case 'contains': return s.includes(String(f.value));
      case 'not_contains': return !s.includes(String(f.value));
    }
  }

function dbCompareRows(a,b,field){
  const t=dbFieldType(field);

    va=dbNumValue(a,field);vb=dbNumValue(b,field);
    const ea=va==null,eb=vb==null;

    if(ea&&eb)return 0;

function dbRowsApply(docId,rows){
  /* FIX-H-08 显式 docId 参数化：tableId 改由调用方传入，不再内部 getCurrentDoc()，与渲染目标 doc 保持一致 */
  const tableId=docId||null;
  const filters=(tableId&&ui.dbFiltersMap&&ui.dbFiltersMap[tableId])||[];
  const sorts=(tableId&&ui.dbSortsMap&&ui.dbSortsMap[tableId])||[];
  let out=rows;

function dbTableList(){
  const root=N(state.rootId);
  if(!root)return[];
  const dbRoot=root.children.map(id=>N(id)).find(n=>n&&n._isDbRoot);
  if(!dbRoot)return[];
  return dbRoot.children.map(id=>N(id)).filter(n=>n&&!n._deleted&&n.dbRoot);
}
function dbFieldSummable(f){
  const t=dbFieldType(f);
  return t==='number'||t==='formula';
}
function dbSummaryMode(){
  return (ui.dbSummary&&ui.dbSummary.mode)||'sum';
}
function dbSummaryOf(rows,field){
  const mode=dbSummaryMode();
  const vals=[];
  rows.forEach(n=>{
    const v=dbNumValue(n,field);
    if(v!=null&&!isNaN(v))vals.push(v);
  });
  if(mode==='count')return vals.length;
  if(!vals.length)return null;
  const sum=vals.reduce((s,x)=>s+x,0);
  return mode==='avg'?sum/vals.length:sum;
}
function dbFmtSummary(v){
  if(v==null)return '—';
  if(typeof v!=='number')return String(v);
  if(Number.isInteger(v))return String(v);
  return String(Math.round(v*100)/100);
}

const OPT_COLORS=['#E15554','#3BB273','#E1BC29','#4D9DE0','#7768AE','#E8871E','#20B2AA','#D9534F'];
function ntAutoClose(pop){
  setTimeout(()=>{
    /* FIX-CLEANUP-1: 挂载前检查仍连接，防 detached 元素泄漏 document 监听 */
    if(!pop.isConnected)return;
    const onDoc=(e)=>{
      if(e.target.closest('.nt-pop,.db-sf-panel,.date-picker,.region-picker,.link-picker'))return;
      closePicker(pop);
    };
    document.addEventListener('mousedown',onDoc);
    if(!pop._cleanups)pop._cleanups=[];
    pop._cleanups.push(()=>document.removeEventListener('mousedown',onDoc));
  },0);
}

/* FIX-P3-25: 清理函数改为集合跟踪（多表并排未来兼容）——原模块级单变量 _lastPanCleanup 在多 wrap 并排渲染时
   会被后者覆盖，先绑 wrap 的 document 监听连带被清；Set 各自跟踪：新绑前只清扫已脱离 DOM 的旧 wrap（拖动中重建/
   mouseup 丢失场景下其 document 监听不再需要），未脱离的并排 wrap 保留各自清理互不影响。当前单表渲染行为不变。 */
const _panCleanups=new Set();
function attachPanScroll(wrap){
  /* FIX-M-13 幂等：同 wrap 重复绑定时先拆旧监听，避免叠加 */
  if(wrap._panCleanup){try{wrap._panCleanup();}catch(err){}wrap._panCleanup=null;}
  /* FIX-P3-25: 清扫已脱离 DOM 的旧 wrap 的残留 document 监听 */
  _panCleanups.forEach(c=>{try{const w=c._wrap;if(w&&!w.isConnected)c();}catch(e){}});
  let dragging=false,sx=0,sy=0,sl=0,st=0;
  const onMove=(e)=>{
    if(!dragging)return;
    wrap.scrollLeft=sl-(e.clientX-sx);
    wrap.scrollTop=st-(e.clientY-sy);
  };
  const onUp=()=>{
    if(!dragging)return;
    dragging=false;
    wrap.style.cursor='';
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
  };
  const onDown=e=>{
    if(e.shiftKey)return;
    if(e.target.closest('input,select,button,textarea,[contenteditable],.db-col-resize,.db-row-resize,.db-cell-date'))return;
    dragging=true;sx=e.clientX;sy=e.clientY;sl=wrap.scrollLeft;st=wrap.scrollTop;
    wrap.style.cursor='grabbing';
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    e.preventDefault();
  };
  wrap.addEventListener('mousedown',onDown);
  /* FIX-M-13 集中清理：解绑 wrap 的 mousedown，并兜底移除可能仍挂在 document 上的 mousemove/mouseup（拖动中重建/mouseup 丢失场景），同时复位 grabbing 光标。
     FIX-P3-25: 清理函数登记入 _panCleanups 集合（带 _wrap 引用供脱离 DOM 清扫），不再覆盖模块级单变量 */
  wrap._panCleanup=()=>{
    wrap.removeEventListener('mousedown',onDown);
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    if(wrap.style.cursor==='grabbing')wrap.style.cursor='';
    _panCleanups.delete(wrap._panCleanup);
    wrap._panCleanup=null;
  };
  wrap._panCleanup._wrap=wrap;
  _panCleanups.add(wrap._panCleanup);
}
function formatTimeValue(v){
  if(!v && v!==0)return '选择…';
  if(typeof v==='number'){
    const ms=v>1e12?v:(v>1e9?v*1000:0);
    if(ms){
      const d=new Date(ms);
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }
    return String(v);
  }
  if(typeof v==='string')return v;
  if(v.type==='date')return v.start||'选择…';
  if(v.type==='datetime')return (v.start||'选择…').trim();
  if(v.type==='range')return (v.start||'')+' - '+(v.end||'');
  if(v.type==='datetimerange')return (v.start||'')+' - '+(v.end||'');
  return String(v);
}
function closePicker(el){
  if(!el)return;
  /* FIX-CLEANUP-1: 支持 cleanup 数组——dbSfAutoClose/ntAutoClose/bindPickerAutoClose 可能叠加挂 document 监听，
     原单槽 _cleanup 互相覆盖导致其中一个监听永不移除；数组逐个回收。 */
  if(el._cleanups&&el._cleanups.length){
    el._cleanups.forEach(fn=>{try{fn();}catch(e){}});
    el._cleanups.length=0;
  }
  /* FIX-CLEANUP-3（B-4）: _cleanups 与旧 _cleanup 可能并存（罕见）——数组清完后再兜底清单槽，
     不留监听残余；移除 else 分支避免「空数组存在但 _cleanup 也有值」时只清一个 */
  if(el._cleanup){try{el._cleanup();}catch(e){}el._cleanup=null;}
  if(el.parentNode)el.remove();
  window._popAnchor=null; /* FIX-P1-1: 统一清残留锚点——closePicker 覆盖 tag-palette/date-picker 等全部浮窗关闭路径 */
}
function bindPickerAutoClose(el){
  const _shouldClose=e=>{if(!e.target.closest('.date-picker, .region-picker'))closePicker(el);};
  const onDocDown=e=>_shouldClose(e);
  const onDocTouch=e=>_shouldClose(e);
  if(!el._cleanups)el._cleanups=[];
  el._cleanups.push(()=>{
    document.removeEventListener('mousedown',onDocDown);
    document.removeEventListener('touchstart',onDocTouch);
  });
  setTimeout(()=>{
    /* FIX-CLEANUP-1: 同一任务内已被关闭（isConnected=false）则不再挂监听，防 detached 元素泄漏 document 监听 */
    if(!el.isConnected)return;
    document.addEventListener('mousedown',onDocDown);
    /* FIX-S-8: 触屏场景同样自动关闭——原仅 mousedown，移动端 touchstart 不触发 mousedown，浮窗不自动关闭 */
    document.addEventListener('touchstart',onDocTouch,{passive:true});
  },0);
}

/* FIX-DB-14: 星级图案渲染 + 星级字段判定，供看板/画廊/时间线共用（避免同一字段各视图格式不一致） */
function mkStarsHtml(level){
  let html='';
  for(let i=1;i<=5;i++){
    const on=i<=level;
    html+='<span style="color:'+(on?'var(--icon)':'transparent')+';-webkit-text-stroke:1px var(--star-edge);font-size:.95em">★</span>';
  }
  return html;
}
function isStarField(name,def){
  return def.type==='number'&&/星|star/i.test(name);
}
function dbBoardCardHtml(n){
  /* FIX-DB-10: 看板卡片按显隐面板可见列渲染——标题单独渲染节点文本（n.text），
     其余可见的 text/select/number/date 字段按 dbTextValue 展示；formula/link/multi_select 复杂字段不进入卡片 */
  const parts=[];
  const titleName=dbPrimaryField(); /* FIX-DB-12: 卡片标题槽严格绑定主列 n.text，与显隐面板一一对应；主列隐藏时不显示标题槽 */
  if(dbFieldVisible(titleName)){
    parts.push(`<div>${esc(stripHtml(n.text)||'(空)')}</div>`);
  }
  (state.dbFields||[]).forEach(f=>{
    const def=dbFieldDef(f);
    const name=def.name;
    if(name===titleName)return;
    if(!dbFieldVisible(name))return;
    if(def.type==='formula'||def.type==='link'||def.type==='multi_select')return;
    /* FIX-DB-14: 星级字段用星形渲染（与画廊一致），不再输出数字 "4" */
    if(isStarField(name,def)){
      const st=Math.max(0,Math.min(5,parseInt((n.db&&n.db[name])||0)||0));
      parts.push(`<div class="meta"><span style="display:inline-flex;gap:1px">${mkStarsHtml(st)}</span></div>`);
      return;
    }
    const v=dbTextValue(n,f);
    if(v)parts.push(`<div class="meta">${esc(v)}</div>`);
  });
  return parts.join('')||'<div>(无显示内容)</div>';
}
/* FIX-DB-10: 推断 select 风格分组字段——对象字段（含 type）直接命中；字符串字段（种子数据重命名后类型推断失效）
   按行数据值集合推断（去重 2~12 个非空字符串值视为候选），排除传入的字段名集合 */
function dbInferSelectField(rows,excludeSet){
  const rowArr=rows||[];
  return (state.dbFields||[]).find(f=>{
    const def=dbFieldDef(f);
    const nm=def.name;
    if(excludeSet&&excludeSet.has(nm))return false;
    if(!dbFieldVisible(nm))return false;
    if(def.type==='select'||def.type==='multi_select')return true;
    if(def.type!=='text')return false;
    const vals=new Set();
    rowArr.forEach(n=>{const v=n.db&&n.db[nm];if(v!=null&&v!=='')vals.add(String(v));});
    return vals.size>=2&&vals.size<=12;
  });
}
/* FIX-DB-10: 看板分组字段解析——优先「状态」（内置列名向后兼容）；
   名称未命中时回退 dbInferSelectField，排除标题列与「优先级」（优先级是卡片 meta 字段，不作分组），
   重命名「状态」→「Stage」等场景仍能正确选中重命名后的分组列 */
function dbBoardGroupDef(rows){
  const byName=dbResolveField('状态',null);
  if(byName&&dbFieldVisible(dbFieldName(byName)))return byName;
  const t=dbPrimaryField(); /* FIX-DB-12: 排除主列（n.text 字段），避免把主列值集合当分组候选 */
  return dbInferSelectField(rows,new Set([t,'优先级']))||null;
}
function renderDbBoard(rows){
  const wrap=document.createElement('div');
  wrap.className='db-board';
  /* FIX-DB-10: 分组字段动态解析（dbBoardGroupDef(rows)，值推断支持重命名后的字符串字段）——重命名/重排列后分组列与显隐面板仍对应 */
  const groupDef=dbBoardGroupDef(rows);
  const groupName=groupDef?dbFieldName(groupDef):null;
  const groupVisible=groupName?dbFieldVisible(groupName):false;
  /* 分组字段被隐藏或不存在 → 退化为单列「全部」，不启用拖拽改状态；卡片字段按显隐渲染 */
  if(!groupVisible){
    const c=document.createElement('div');
    c.className='db-board-col';
    c.dataset.status='';
    c.innerHTML='<h4>● 全部</h4>';
    rows.forEach(n=>{
      const card=document.createElement('div');
      card.className='db-board-card';
      card.dataset.id=n.id;
      card.innerHTML=dbBoardCardHtml(n);
      card.onclick=()=>openNode(n.id);
      c.appendChild(card);
    });
    wrap.appendChild(c);
    return wrap;
  }
  const statuses=new Set(['进行','待办','完成','放弃']);
  rows.forEach(n=>{const s=n.db&&n.db[groupName];if(s)statuses.add(s);});
  const cols=[...statuses];
  const hasUnset=rows.some(n=>!(n.db&&n.db[groupName]));
  if(hasUnset)cols.unshift('未设置');
  cols.forEach(col=>{
    const c=document.createElement('div');
    c.className='db-board-col';
    c.dataset.status=col;
    c.dataset.field=groupName; /* FIX-DB-10: 记录实际分组字段，拖拽回写不再硬编码 */
    c.innerHTML=`<h4>● ${esc(col)}</h4>`;
    c.ondragover=e=>{e.preventDefault();c.style.background='var(--accent-soft)';};
    c.ondragleave=()=>{c.style.background='';};
    c.ondrop=e=>{
      e.preventDefault();c.style.background='';
      const id=e.dataTransfer.getData('text/plain');
      if(id){
        actions.setDbCell(id,groupName,col==='未设置'?'':col);
        forceRender();
      }
    };
    rows.filter(n=>{
      const s=n.db&&n.db[groupName];
      if(col==='未设置')return !s;
      return s===col;
    }).forEach(n=>{
      const card=document.createElement('div');
      card.className='db-board-card';
      card.draggable=true;
      card.dataset.id=n.id;
      card.ondragstart=e=>{e.dataTransfer.setData('text/plain',n.id);};
      card.ondragend=()=>{
        card._suppressClick=true;
        setTimeout(()=>{card._suppressClick=false;},50);
      };
      card.innerHTML=dbBoardCardHtml(n);
      card.onclick=()=>{
        if(card._suppressClick)return;
        openNode(n.id);
      };
      /* 触屏拖拽逻辑保留原样 */
      (function(){
        let touchTimer=null,touchDragging=false,activePointerId=null,touchStartX=0,touchStartY=0;
        card.addEventListener('pointerdown',e=>{
          if(e.pointerType==='mouse')return;
          card._suppressClick=false;
          activePointerId=e.pointerId;
          touchStartX=e.clientX;touchStartY=e.clientY;
          try{card.setPointerCapture(activePointerId);}catch(err){}
          touchTimer=setTimeout(()=>{
            touchDragging=true;
            card.style.opacity='.5';
          },250);
        });
        card.addEventListener('pointermove',e=>{
          if(!touchDragging){
            if(touchTimer&&Math.hypot(e.clientX-touchStartX,e.clientY-touchStartY)>8){
              clearTimeout(touchTimer);touchTimer=null;
              touchDragging=true;
              card.style.opacity='.5';
            }
            if(!touchDragging)return;
          }
          e.preventDefault();
          document.querySelectorAll('.db-board-col').forEach(cc=>cc.style.background='');
          const el=document.elementFromPoint(e.clientX,e.clientY);
          const colEl=el&&el.closest('.db-board-col');
          if(colEl)colEl.style.background='var(--accent-soft)';
        });
        const end=e=>{
          clearTimeout(touchTimer);
          try{card.releasePointerCapture(activePointerId);}catch(err){}
          activePointerId=null;
          if(!touchDragging)return;
          touchDragging=false;
          card._suppressClick=true;
          card.style.opacity='';
          const el=document.elementFromPoint(e.clientX,e.clientY);
          const colEl=el&&el.closest('.db-board-col');
          document.querySelectorAll('.db-board-col').forEach(cc=>cc.style.background='');
          if(colEl){
            const ns=colEl.dataset.status==='未设置'?'':colEl.dataset.status;
            actions.setDbCell(n.id,groupName,ns);
            forceRender();
          }
        };
        card.addEventListener('pointerup',end);
        card.addEventListener('pointercancel',end);
      })();
      c.appendChild(card);
    });
    wrap.appendChild(c);
  });
  return wrap;
}

function dbUserSortActive(){
  const doc=getCurrentDoc();
  return !!(doc&&ui.dbSortsMap&&ui.dbSortsMap[doc.id]&&ui.dbSortsMap[doc.id].length);
}
function renderDbTimeline(rows){
  /* FIX-DB-10: 「动态」合并进「时间线」——日期字段动态解析（优先「时间」，失败按类型回退第一个 date 字段），
     重命名/重排列后与显隐面板完全对应；有时间字段的按时间升序，无时间字段的按 updatedAt 降序排在其后 */
  const dateDef=dbResolveField('时间',['date']);
  const dateName=dateDef?dbFieldName(dateDef):null;
  const dateVisible=dateName?dbFieldVisible(dateName):false;
  const sorted=dbUserSortActive()
    ?rows
    :rows.slice().sort((a,b)=>{
      const ta=(dateVisible&&a.db&&a.db[dateName])?String(formatTimeValue(a.db[dateName])):'';
      const tb=(dateVisible&&b.db&&b.db[dateName])?String(formatTimeValue(b.db[dateName])):'';
      if(ta&&tb)return ta.localeCompare(tb);
      if(ta)return -1;
      if(tb)return 1;
      return (b.updatedAt||0)-(a.updatedAt||0);
    });
  return renderDbTimelineList(sorted,n=>{
    const hasTime=dateVisible&&!!(n.db&&n.db[dateName]);
    const dateLabel=hasTime
      ?String(formatTimeValue(n.db[dateName])).split(' ')[0]||''
      :'';
    const parts=[];
    const titleName=dbPrimaryField(); /* FIX-DB-12: 时间线条目标题严格绑定主列 n.text；主列隐藏时无列顶替 */
    if(dbFieldVisible(titleName)){
      parts.push(`<div class="t">${esc(stripHtml(n.text)||'(空)')}</div>`);
    }
    const subParts=[];
    if(hasTime){
      /* FIX-DB-14: 副信息 = 所有可见非主列/日期字段（含 number/date/text），星级用星形；
         原只支持 text/select（number 被排除导致星级显隐无效果） */
      (state.dbFields||[]).forEach(f=>{
        const def=dbFieldDef(f);
        const name=def.name;
        if(name===titleName||name===dateName)return;
        if(!dbFieldVisible(name))return;
        if(def.type==='formula'||def.type==='link'||def.type==='multi_select')return;
        if(isStarField(name,def)){
          const st=Math.max(0,Math.min(5,parseInt((n.db&&n.db[name])||0)||0));
          subParts.push('<span style="display:inline-flex;gap:1px">'+mkStarsHtml(st)+'</span>');
          return;
        }
        const v=dbTextValue(n,f);
        if(v)subParts.push(esc(v));
      });
    }else{
      subParts.push('动态更新');
    }
    const subHtml=subParts.length?`<div class="d">${subParts.join(' ')}</div>`:'';
    return `<div class="db-tl-date">${dateLabel}</div><div class="db-tl-content">${parts.join('')}${subHtml}</div>`;
  },'暂无时间线/动态数据');
}
function renderDbChart(rows){
  const wrap=document.createElement('div');
  wrap.className='db-chart';
  /* FIX-DB-14: 图表的「显隐对应」策略——为每个可见的 select/multi_select 字段各画一张柱状图；
     显隐面板勾选/取消即影响图表输出。若无 select 类字段，则回退 dbInferSelectField 值推断找一个；
     全无则给出提示。主列（n.text）值域太散，不作分组 */
  const groupFields=(state.dbFields||[]).filter(f=>{
    const name=dbFieldName(f);
    if(!dbFieldVisible(name))return false;
    if(name===dbPrimaryField())return false;
    const def=dbFieldDef(f);
    return def.type==='select'||def.type==='multi_select';
  });
  if(!groupFields.length){
    const inferred=dbInferSelectField(rows,new Set([dbPrimaryField()]));
    if(inferred)groupFields.push(inferred);
  }
  if(!groupFields.length){
    wrap.innerHTML='<div class="db-empty">请先在「显隐」中至少显示一个「单选/多选」字段作为图表分组依据</div>';
    return wrap;
  }
  /* FIX-L-21 柱高基准改为绘图容器高度常量 CHART_AREA_H（柱高=(c/max)*CHART_AREA_H，最大柱=容器满高），集中一处便于随容器调整 */
  const CHART_AREA_H=180;
  groupFields.forEach(groupDef=>{
    const groupName=dbFieldName(groupDef);
    const block=document.createElement('div');
    block.style.marginBottom='24px';
    const title=document.createElement('div');
    title.style.cssText='font-size:.88em;font-weight:700;color:var(--title);margin-bottom:8px';
    title.textContent='分组：'+groupName;
    block.appendChild(title);
    const counts={};
    rows.forEach(n=>{const s=(n.db&&n.db[groupName])||'未设置';counts[s]=(counts[s]||0)+1;});
    const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const MAX_BARS=6;
    let display=entries;
    if(entries.length>MAX_BARS){
      const top=entries.slice(0,MAX_BARS-1);
      const rest=entries.slice(MAX_BARS-1).reduce((s,[,c])=>s+c,0);
      display=[...top,['其他',rest]];
    }
    const max=Math.max(1,...display.map(e=>e[1]));
    const bars=document.createElement('div');
    bars.className='db-chart-bars';
    bars.style.height=CHART_AREA_H+'px';
    display.forEach(([k,c])=>{
      const bar=document.createElement('div');
      bar.className='db-chart-bar';
      bar.style.height=Math.max((8/CHART_AREA_H)*100,(c/max)*100)+'%';
      bar.innerHTML=`<span class="val">${esc(String(c))}</span><span class="lbl">${esc(k)}</span>`;
      bars.appendChild(bar);
    });
    block.appendChild(bars);
    const total=document.createElement('div');
    total.style.cssText='text-align:center;margin-top:28px;color:var(--fg-dim);font-size:.8em';
    total.textContent='共 '+rows.length+' 条数据 · 分组：'+groupName;
    block.appendChild(total);
    wrap.appendChild(block);
  });
  return wrap;
}

/* FIX-R9-3: 导图布局常量随字号缩放（currentBaseFontPx/14），字号放大后节点框/间距/连线等比放大，与 .mm-node 的 em 文字匹配；屏幕渲染与 SVG 导出共用 */

function sortDocs(ids,sorter){
  return[...ids].sort((aid,bid)=>{
    const a=N(aid),b=N(bid);
    const aF=isFolder(aid),bF=isFolder(bid);
    if(sorter==='type'&&aF!==bF)return aF?-1:1;
    if(sorter==='created')return(b.createdAt||0)-(a.createdAt||0);
    if(sorter==='updated')return(b.updatedAt||0)-(a.updatedAt||0);
    if(sorter==='star')return(b.starred||0)-(a.starred||0);
    if(aF!==bF)return aF?-1:1;
    return _getZhCollator().compare(stripHtml(a.text||''),stripHtml(b.text||''));
  });

/* 【UI修复12】标签重命名：全库替换 #旧→#新（仅匹配完整标签词） */
/* FIX-H-10：富文本中标签常被内联包裹为 <b>#设计</b>，原在原始 HTML 上做正则替换时前瞻 (?=\s|$) 遇 '<' 失败，
   节点被命中但可见文本原样保留。改为 DOMParser 解析后遍历文本节点替换，保留富文本结构；newT 传 null 表示删除标签。 */
function replaceTagInHtmlTag(html,oldT,newT){
  if(!html)return html||'';
  const re=new RegExp('#'+oldT.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=\\s|$)','g');
  const doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
  const texts=[];let tn;
  while((tn=walker.nextNode()))texts.push(tn);
  texts.forEach(node=>{
    const v=node.nodeValue;
    if(v.indexOf('#'+oldT)<0)return;
    node.nodeValue=v.replace(re,newT==null?'':'#'+newT);
  });
  return doc.body.innerHTML;
}
function renameTag(oldT,newT){
  commit(s=>{
    for(const id in s.nodes){
      const n=s.nodes[id];if(!n||n._deleted||n._isFolder)continue;
      const raw=stripHtml(n.text||'');
      if(raw.indexOf('#'+oldT)<0&&!(Array.isArray(n.tags)&&n.tags.includes(oldT)))continue;
      n.text=replaceTagInHtmlTag(n.text||'',oldT,newT);
      if(Array.isArray(n.tags)&&n.tags.includes(oldT))n.tags=n.tags.map(x=>x===oldT?newT:x);
      /* FIX-L-44：手动标签记录 _manualTags 同步重命名，避免重命名后手动标签失效 */
      if(Array.isArray(n._manualTags)&&n._manualTags.includes(oldT))n._manualTags=n._manualTags.map(x=>x===oldT?newT:x);
      n.updatedAt=_nowSeq();
    }
  },{snapshot:true});
  _tagIndexCache=null;renderSidebar();forceRender();toast('已重命名为 #'+newT);
}
/* 【UI修复12】标签删除：从所有节点文本移除 #旧 */
function removeTag(t){
  commit(s=>{
    for(const id in s.nodes){
      const n=s.nodes[id];if(!n||n._deleted||n._isFolder)continue;
      const raw=stripHtml(n.text||'');
      if(raw.indexOf('#'+t)<0&&!(Array.isArray(n.tags)&&n.tags.includes(t)))continue;
      n.text=replaceTagInHtmlTag(n.text||'',t,null);
      if(Array.isArray(n.tags)&&n.tags.includes(t))n.tags=n.tags.filter(x=>x!==t);
      /* FIX-L-44：手动标签记录 _manualTags 同步剔除 */
      if(Array.isArray(n._manualTags)&&n._manualTags.includes(t))n._manualTags=n._manualTags.filter(x=>x!==t);
      n.updatedAt=_nowSeq();
    }
  },{snapshot:true});
  _tagIndexCache=null;renderSidebar();forceRender();toast('已删除标签 #'+t);
}

    };

function doSearch(q){
  const content=$('#content');if(!content)return;
  if(!q){forceRender();return;}
  const terms=q.split(/\s+/).filter(Boolean).map(t=>t.toLowerCase());
  content.innerHTML='';
  const wrap=document.createElement('div');wrap.className='files-wrap';
  wrap.innerHTML=`<div style="font-size:1.05em;font-weight:700;margin-bottom:14px">搜索结果：${esc(q)}</div>`;
  const list=document.createElement('div');list.style.cssText='display:flex;flex-direction:column;gap:4px';
  let found=0;
  const LIMIT=200;
  for(const id in state.nodes){
    if(found>=LIMIT)break;
    const n=state.nodes[id];
    if(n._deleted||id===state.rootId)continue;
    if(n._isDbRoot)continue;
    /* FIX-L-37：跳过日历根/记事本根/文件夹等系统容器，避免其作为搜索结果出现 */
    if(n._isCalRoot||n._isNoteRoot||n._isFolder)continue;
    const hay=nodeSearchHay(n);
    if(terms.every(t=>hay.includes(t))){
      found++;
      const row=document.createElement('div');row.className='cal-row';
      row.innerHTML=`<span class="bullet"></span><span class="text">${highlight(stripHtml(n.text),terms)}</span>`;
      row.onclick=()=>openNode(n.id);
      list.appendChild(row);
    }
  }
  wrap.appendChild(list);
  if(!found){const e2=document.createElement('div');e2.className='empty-state';e2.textContent='未找到结果';wrap.appendChild(e2);}
  else if(found>=LIMIT){const m=document.createElement('div');m.style.cssText='text-align:center;color:var(--fg-dim);font-size:.78em;padding:6px';m.textContent='仅显示前 '+LIMIT+' 条';wrap.appendChild(m);}
  content.appendChild(wrap);
}
function highlight(text,terms){
  if(!text)return '';
  if(!terms||!terms.length)return esc(text);
  const lower=text.toLowerCase();
  const ranges=[];
  terms.forEach(t=>{
    if(!t)return;
    const lt=t.toLowerCase();
    if(!lt)return;
    let i=0;
    while((i=lower.indexOf(lt,i))>=0){
      ranges.push([i,i+lt.length]);
      i+=lt.length;
    }
  });
  if(!ranges.length)return esc(text);
  ranges.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const merged=[ranges[0]];
  for(let i=1;i<ranges.length;i++){
    const last=merged[merged.length-1];
    if(ranges[i][0]<=last[1])last[1]=Math.max(last[1],ranges[i][1]);
    else merged.push(ranges[i]);
  }
  let out='',cur=0;
  merged.forEach(([s,e])=>{
    if(s>cur)out+=esc(text.slice(cur,s));
    out+='<mark style="background:var(--accent-soft);color:var(--accent-fg)">'+esc(text.slice(s,e))+'</mark>';
    cur=e;
  });
  if(cur<text.length)out+=esc(text.slice(cur));
  return out;
}

/* ============================================================
   Wiki 链接跳转 + 反链 / 出链 面板
   ============================================================ */
const WIKI_RE=/\[\[([^\[\]\n]{1,80}?)\]\]/g;
function normTitle(t){return String(t||'').replace(/\s+/g,' ').trim();}
function findNodeByTitle(title){
  const t=normTitle(title);if(!t)return null;
  let fallback=null;
  for(const id in state.nodes){
    const n=state.nodes[id];
    if(!n||n._deleted||n.id===state.rootId)continue;
    if(normTitle(stripHtml(n.text||''))!==t)continue;
    if(isFolder(id)){if(!fallback)fallback=id;continue;}
    if(n._isCalRoot)continue;
    return id;
  }
  return fallback;
}
function navigateToWikiLink(title,fromEl){
  const t=normTitle(title);if(!t){toast('无效链接');return;}
  const id=findNodeByTitle(t);
  if(id){openNode(id);return;}
  appConfirm('节点「'+t.slice(0,30)+'」不存在，创建为新文档并跳转？',()=>{
    const newId=actions.addNode(state.rootId,null,{text:t});
    if(newId)openNode(newId);
    else toast('创建失败');
  },()=>{});
}
function caretTextInfo(x,y){
  let info=null;
  try{
    if(document.caretPositionFromPoint){
      const p=document.caretPositionFromPoint(x,y);
      if(p&&p.offsetNode)info={node:p.offsetNode,offset:p.offset};
    }
    if(!info&&document.caretRangeFromPoint){
      const r=document.caretRangeFromPoint(x,y);
      if(r&&r.startContainer)info={node:r.startContainer,offset:r.startOffset};
    }
  }catch(e){}
  return info;
}
function linkTitleAtPoint(el,e){
  const info=caretTextInfo(e.clientX,e.clientY);
  if(!info||!info.node)return null;
  let node=info.node;
  if(node.nodeType===1){
    let found=null;let acc=0;
    Array.from(node.childNodes).forEach(ch=>{
      if(found)return;
      if(ch.nodeType===3){
        const len=(ch.textContent||'').length;
        if(info.offset>=acc&&info.offset<=acc+len)found=ch;
        acc+=len;
      }
    });
    node=found;
  }
  if(!node||node.nodeType!==3)return null;
  const text=node.textContent||'';
  const off=Math.max(0,Math.min(text.length,info.offset));
  WIKI_RE.lastIndex=0;
  let m;
  while((m=WIKI_RE.exec(text))!==null){
    const s=m.index,en=m.index+m[0].length;
    if(off>=s&&off<=en)return m[1].trim();
  }
  return null;
}
function outgoingLinksOf(docId){
  const set=new Map();
  docSubtree(docId).forEach(id=>{
    const n=state.nodes[id];
    if(!n||n._deleted)return;
    const txt=stripHtml(n.text||'');if(!txt)return;
    WIKI_RE.lastIndex=0;let m;
    while((m=WIKI_RE.exec(txt))!==null){
      const t=m[1].trim();if(t&&!set.has(t))set.set(t,id);
    }
  });
  return set;
}
function backlinksOf(docId){
  const doc=N(docId);if(!doc)return [];
  const docTitles=new Set();
  docSubtree(docId).forEach(id=>{
    const n=state.nodes[id];
    if(!n||isBlankNode(n))return;
    const t=normTitle(stripHtml(n.text||''));
    if(t)docTitles.add(t);
  });
  const groups=new Map();
  for(const id in state.nodes){
    const n=state.nodes[id];
    if(!n||n._deleted||id===state.rootId)continue;
    if(findOwningTopDocId(id,state)===docId)continue;
    const txt=stripHtml(n.text||'');if(!txt)continue;
    WIKI_RE.lastIndex=0;let m;let hit=false;
    while((m=WIKI_RE.exec(txt))!==null){
      if(docTitles.has(normTitle(m[1]))){hit=true;break;}
    }
    if(!hit)continue;
    const topId=findOwningTopDocId(id,state)||id;
    const g=groups.get(topId)||{topId,count:0};
    g.count++;
    groups.set(topId,g);
  }
  return Array.from(groups.values()).sort((a,b)=>b.count-a.count);
}

function requestReminderPermission(){
  if(!remindersSupported()){toast('当前浏览器不支持系统通知');return false;}

  if(Notification.permission==='denied'){toast('通知权限已被浏览器拒绝，请在浏览器设置中开启');return false;}

function sendSystemNotification(title,opts){

let _reminderTimer=null; /* 【修复 F-13】提醒轮询 interval 句柄：随开关启停，杜绝"开启后到点不提醒" */
function checkDueReminders(){
  if(!ui||!ui.reminderEnabled)return;
  const today=todayStr();
  const sent=loadRemindSent();
  for(const k in sent){if(String(sent[k])<today)delete sent[k];}
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const todos=calendarTodosOnDate(today).filter(n=>!n.done&&n.time);
  const due=[];
  todos.forEach(n=>{
    const parts=String(n.time).split(':');
    const hh=parseInt(parts[0],10),mm=parseInt(parts[1],10);
    if(isNaN(hh)||isNaN(mm))return;
    if(nowMin<hh*60+mm)return;
    if(sent[n.id]===today)return;
    due.push(n);
  });
  if(!due.length){saveRemindSent(sent);return;}
  if(!_remindBooted){
    _remindBooted=true;
    due.forEach(n=>{sent[n.id]=today;});
    saveRemindSent(sent);
    const names=due.slice(0,3).map(n=>stripHtml(n.text||'').slice(0,20)).join('、');
    const more=due.length>3?' 等 '+due.length+' 条':'';
    sendSystemNotification('JU · 已到点待办',{body:names+more+' 已到点未完成',tag:'juju-summary'});
    toast('⏰ 今日已有 '+due.length+' 条待办到点未完成');
    return;
  }
  /* FIX-L-40：轮询路径不再每条到点任务各发一条系统通知，改为与 boot 一致合并为一条摘要通知 */
  due.forEach(n=>{sent[n.id]=today;});
  saveRemindSent(sent);
  const names=due.slice(0,3).map(n=>stripHtml(n.text||'').slice(0,20)).join('、');
  const more=due.length>3?' 等 '+due.length+' 条':'';
  sendSystemNotification('JU · 已到点待办',{body:names+more+' 已到点未完成',tag:'juju-summary'});
  toast('⏰ 今日已有 '+due.length+' 条待办到点未完成');
}

async function exportFullBackup(){
  try{
    const backup={
      app:'juju',ver:'fixed18',type:'full-backup',
      exportedAt:new Date().toISOString(),
      state:safeClone(state),
      ui:uiSnapshot(),
      graphpos:clone(_graphPositions||{}),
      versions:null
    };
    try{
      await VDB.ensure();
      /* FIX-L-45：snapshots 库改为按主键游标分批读取（每批 200 条），每批独立事务、批次间让出主线程，
         替代一次性 getAll() 全量取出导致的大备份主线程冻结；分批结果用 async 聚合，导出内容保持完整。 */
      const SNAP_BATCH=200;
      const snapRows=[];let snapLastKey=null;
      for(;;){
        const batch=await VDB.tx('snapshots','readonly',async(store)=>{
          const range=snapLastKey===null?null:IDBKeyRange.lowerBound(snapLastKey,true);
          const req=store.openCursor(range);
          const arr=[];
          await new Promise((res,rej)=>{
            req.onsuccess=e=>{
              const cur=e.target.result;
              if(cur&&arr.length<SNAP_BATCH){arr.push(cur.value);snapLastKey=cur.key;cur.continue();}
              else res();
            };
            req.onerror=()=>rej(req.error);
          });
          return arr;
        });
        snapRows.push.apply(snapRows,batch);
        if(!batch.length||batch.length<SNAP_BATCH)break;
      }
      backup.versions=snapRows;
    }catch(e){backup.versions=null;}
    download('JU-备份-'+todayStr()+'.json',JSON.stringify(backup,null,2),'application/json');
    toast('已下载完整备份（含数据 / 界面设置 / 图谱位置 / 历史版本）');
  }catch(e){
    toast('备份失败：'+(e.message||'未知错误'));
  }
}

function clearBgFromSelection(){

function cleanupBg(root){
  const unwrap=[];const dead=[];
  (function walk(n){
    Array.from(n.children||[]).forEach(ch=>{
      walk(ch);
      if(ch.style){
        const v=(ch.style.backgroundColor||'').toLowerCase();
        if(v==='transparent'||v==='rgba(0, 0, 0, 0)'||v==='rgba(0,0,0,0)')ch.style.removeProperty('background-color');
      }
      if(!ch.getAttribute('style')&&(ch.tagName==='SPAN'||ch.tagName==='FONT'))unwrap.push(ch);
      if(EMPTY_INLINE_TAGS.has(ch.tagName)&&ch.children.length===0&&!ch.textContent)dead.push(ch);
    });
  })(root);
  unwrap.forEach(el=>{const p=el.parentNode;if(p){while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);}});
  dead.forEach(n=>{try{n.remove();}catch(e){}});
}

/* 字号档位：不再用固定 px（旧 10/13/16/18/24/32/48 与全局字号缩放脱节，导致
   “正文 3”≠正文字号、调了看不出变化）。改为跟随全局字号缩放（设置面板滑块 70%~200%，
   --font-size 变量）的比例档位：“正文 3”=1.0×当前正文字号，保证大小与字体相符。 */
const FONT_SIZE_RATIOS={'1':0.7,'2':0.85,'3':1.0,'4':1.2,'5':1.5,'6':2.0,'7':2.8};
function currentBaseFontPx(){
  const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-size'));
  return (v&&v>0)?v:14;
}
function fontSizePxFor(level){
  const ratio=FONT_SIZE_RATIOS[level];
  if(!ratio)return null;
  return Number((currentBaseFontPx()*ratio).toFixed(1));
}
/* 清理操作残留的空内联元素（如 extractContents 拆分边界留下的 <span style=...></span>） */
const EMPTY_INLINE_TAGS=new Set(['SPAN','FONT','B','I','U','S','EM','STRONG','MARK','DEL','INS','SMALL','SUB','SUP']);
function cleanupEmptyInline(root){
  if(!root)return;
  const dead=[];
  (function walk(n){
    Array.from(n.children||[]).forEach(ch=>{
      if(EMPTY_INLINE_TAGS.has(ch.tagName)&&ch.children.length===0&&!ch.textContent)dead.push(ch);
      else walk(ch);
    });
  })(root);
  dead.forEach(n=>{try{n.remove();}catch(e){}});
}
/* 从 contenteditable 根向下遍历，收集所有与选区相交的元素（含选区祖先 span）；
   解决“字号加在选区祖先层级、commonAncestorContainer 子树遍历不到”的问题 */
function collectRangeIntersectElements(host,range){
  const out=[];
  (function walk(n){
    if(n.nodeType!==1)return;
    if(range.intersectsNode(n))out.push(n);
    Array.from(n.children||[]).forEach(walk);
  })(host);
  return out;
}
/* 展开“样式属性为空”的 span（含带子节点的）；与 cleanupEmptyInline（只清理完全空的内联元素）互补 */
function unwrapStylelessSpans(host){
  const spans=[];
  (function walk(n){
    Array.from(n.children||[]).forEach(ch=>{
      if(ch.tagName==='SPAN'&&!(ch.getAttribute('style')||'').trim())spans.push(ch);
      walk(ch);
    });
  })(host);
  spans.forEach(el=>{
    const p=el.parentNode;if(!p)return;
    while(el.firstChild)p.insertBefore(el.firstChild,el);
    p.removeChild(el);
  });
}
function applyFontSize(level){
  const px=fontSizePxFor(level);if(!px)return;
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed){toast('请先在正文中选中要调整字号的文本');return;}
  const range=sel.getRangeAt(0);
  const sc=range.commonAncestorContainer;
  const startEl=(sc.nodeType===1)?sc:sc.parentNode;
  const host=startEl&&startEl.closest?startEl.closest('[contenteditable="true"]'):null;
  if(!host){toast('请先在正文中选中文字');return;}
  /* 修复：调字号前先清除选区内已有的 font-size（含祖先 span），
     避免连续调整产生嵌套 font-size 导致行高被深层大字号撑高、清除字号只能清最内层的问题 */
  collectRangeIntersectElements(host,range).forEach(el=>{
    if(el.style&&el.style.fontSize)el.style.removeProperty('font-size');
  });
  const span=document.createElement('span');
  span.style.fontSize=px+'px';
  try{
    range.surroundContents(span);
  }catch(e){
    /* 选区跨元素边界时 surroundContents 失败：抽出内容再插回 span */
    try{span.appendChild(range.extractContents());range.insertNode(span);}
    catch(e2){toast('无法调整该选区字号');return;}
  }
  unwrapStylelessSpans(host);

let _fmtPainter={active:false,fmt:null,srcKey:null,btn:null};

function selectionKey(){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0)return '';
  const r=sel.getRangeAt(0);
  const path=n=>{
    let el=n.nodeType===1?n:(n.parentElement||null);
    const p=[];
    while(el&&el!==document.body){
      const parent=el.parentElement;
      p.unshift(parent?Array.from(parent.children).indexOf(el):-1);
      el=parent;
    }
    return p.join('.');
  };
  return path(r.startContainer)+'|'+r.startOffset+'|'+path(r.endContainer)+'|'+r.endOffset+'|'+sel.toString();
}
function captureFormat(){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed)return null;
  const range=sel.getRangeAt(0);
  let node=range.startContainer;
  if(node.nodeType===3)node=node.parentElement;
  if(!node||node.nodeType!==1||!node.closest||!node.closest('[contenteditable="true"]'))return null;
  const root=node.closest('[contenteditable="true"]');
  const fmt={fontSize:null,color:null,bg:null,bold:false,italic:false,underline:false,strike:false};
  let el=node;
  while(el&&el!==root){
    const st=el.style||{};
    if(!fmt.fontSize&&st.fontSize)fmt.fontSize=st.fontSize;
    if(!fmt.color&&st.color)fmt.color=st.color;
    if(!fmt.bg&&st.backgroundColor)fmt.bg=st.backgroundColor;
    const cs=getComputedStyle(el);
    if(cs.fontWeight==='bold'||parseInt(cs.fontWeight)>=600)fmt.bold=true;
    if(cs.fontStyle==='italic')fmt.italic=true;
    const dec=cs.textDecorationLine||'';
    if(dec.includes('underline'))fmt.underline=true;
    if(dec.includes('line-through'))fmt.strike=true;
    el=el.parentElement;
  }
  if(!fmt.fontSize&&!fmt.color&&!fmt.bg&&!fmt.bold&&!fmt.italic&&!fmt.underline&&!fmt.strike)return null;
  return fmt;
}
function applyCapturedFormat(fmt){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0||sel.isCollapsed)return false;
  const range=sel.getRangeAt(0);
  const sc=range.commonAncestorContainer;
  const host=(sc.nodeType===1)?sc:sc.parentNode;
  if(!host||!host.closest||!host.closest('[contenteditable="true"]'))return false;
  const span=document.createElement('span');
  if(fmt.fontSize)span.style.fontSize=fmt.fontSize;
  if(fmt.color)span.style.color=fmt.color;
  if(fmt.bg){
    const b=String(fmt.bg).toLowerCase();
    if(b!=='transparent'&&b!=='rgba(0, 0, 0, 0)'&&b!=='rgba(0,0,0,0)')span.style.backgroundColor=fmt.bg;
  }
  if(fmt.bold)span.style.fontWeight='bold';
  if(fmt.italic)span.style.fontStyle='italic';
  const dec=[];
  if(fmt.underline)dec.push('underline');
  if(fmt.strike)dec.push('line-through');
  if(dec.length)span.style.textDecoration=dec.join(' ');
  if(!span.getAttribute('style'))return false;
  try{range.surroundContents(span);}
  catch(e){
    try{span.appendChild(range.extractContents());range.insertNode(span);}
    catch(e2){return false;}
  }
  cleanupEmptyInline(host);
  return true;
}

function buildStatsBlock(){

  const newBtn=document.createElement('button');newBtn.className='btn primary';newBtn.style.cssText='font-size:.82em;padding:4px 10px';newBtn.textContent='创建';
  newRow.appendChild(newInput);newRow.appendChild(newBtn);
  const doCreate=()=>{

  newInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();doCreate();}});

/* L7-W4：tagIndex 的「可让出」构建步骤（同步 deadline=Infinity / 异步真实 deadline + 块间让出共用）。
   逐字保留原 buildTagIndex 的逐节点口径：正文 TAG_RE 扫描 ∪ 手动标签（_manualTags 放行）。 */
function _tagScanStep(ids,i,deadline,map){
  while(i<ids.length){
    const id=ids[i];i++;
    const n=state.nodes[id];
    if(n&&!n._deleted&&!n._isFolder){
      const raw=stripHtml(n.text||'');
      const seen=new Set();
      let m;TAG_RE.lastIndex=0;
      while((m=TAG_RE.exec(raw))!==null){
        const t=m[1].slice(1);
        if(!t)continue;
        seen.add(t);
        if(!map.has(t))map.set(t,new Set());
        map.get(t).add(id);
      }
      /* 【QA-标签修复】并集节点 tags 数组：新建标签（promptNewTag）与行内 picker 均写入 n.tags，
         不再要求正文含 # 文字，标签树/标签过滤视图立即可见、可点击使用 */
      if(Array.isArray(n.tags)&&n.tags.length){
        for(const t of n.tags){
          if(!t||seen.has(t))continue;
          /* FIX-GHOST-TAG：正文含 #t 已由上方文本扫描计入；此分支只放行手动指派标签（_manualTags），
             否则 n.tags 残留（正文删 #t 后未剔除）会成为幽灵标签污染侧栏/标签视图计数，与 nodeHasTag 口径一致 */
          if(!(Array.isArray(n._manualTags)&&n._manualTags.includes(t)))continue;
          seen.add(t);
          if(!map.has(t))map.set(t,new Set());
          map.get(t).add(id);
        }
      }
    }
    if(_l7Now()>=deadline)break;
  }
  return i;
}
function buildTagIndex(){
  if(_tagIndexCache)return _tagIndexCache;
  const map=new Map();
  const ids=Object.keys(state.nodes);
  let i=0;
  while(i<ids.length)i=_tagScanStep(ids,i,Infinity,map);
  _tagIndexCache=map;
  return map;
}
function calendarTagIndex(){
  const map=new Map();
  const calRootId=getCalendarRootId();
  const stack=[calRootId];const visited=new Set();
  while(stack.length){
    const pid=stack.pop();
    if(visited.has(pid))continue;
    visited.add(pid);
    const parent=N(pid);if(!parent)continue;
    (parent.children||[]).forEach(cid=>{
      const n=N(cid);
      if(!n||n._deleted)return;
      const seen=new Set();
      const raw=stripHtml(n.text||'');
      let m;TAG_RE.lastIndex=0;
      while((m=TAG_RE.exec(raw))!==null){const tt=m[1].slice(1);if(tt&&!seen.has(tt)){seen.add(tt);map.set(tt,(map.get(tt)||0)+1);}}
      (n.tags||[]).forEach(t=>{if(t&&!seen.has(t)){seen.add(t);map.set(t,(map.get(t)||0)+1);}});
      stack.push(cid);
    });
  }
  return map;
}
function nodeHasTag(n,tag){
  if(!n||!tag)return false;
  /* FIX-L-44：n.tags 只增不减（updateText 仅并集），原实现只要 n.tags 含标签即生效，
     导致用户从正文删除 #tag 后标签仍命中。改为：n.tags 含该标签 且（正文仍含 #tag 或 _manualTags 手动指派含该标签）。
     不破坏标签选择器手动指派（openTagPicker 写 _manualTags）。 */
  if((n.tags||[]).indexOf(tag)<0)return false;
  /* 【修复 2026-09-27】与 extractTags 共用同一 TAG_RE，避免提取/判定口径不一致
     （如 foo#标签 提取不到但判定命中） */
  if(extractTags(stripHtml(n.text||'')).indexOf(tag)>=0)return true;
  return (n._manualTags||[]).indexOf(tag)>=0;
}
function nodeSearchHay(n){
  /* 【P1-12 M4】LRU 缓存：命中时重排到末尾，溢出时淘汰最旧 1 条——统一走 makeLRU（FIX-P2-2） */
  const cached=_searchHayCache.get(n.id);
  if(cached&&cached.updatedAt===n.updatedAt)return cached.hay;
  const hay=[
    stripHtml(n.text),
    n.note||'',
    (n.tags||[]).join(' '),
    Object.values(n.db||{}).map(v=>typeof v==='object'?formatTimeValue(v):String(v)).join(' ')
  ].join(' ').toLowerCase();
  _searchHayCache.set(n.id,{updatedAt:n.updatedAt,hay});
  return hay;
}
function renderTagsView(){

function renderHistoryView(){
  const wrap=document.createElement('div');wrap.className='files-wrap';
  wrap.appendChild(renderViewTitle('版本历史'));
  const doc=getCurrentDoc();
  const isRoot=!doc||doc.id===state.rootId;
  if(isRoot){
    const e=document.createElement('div');e.className='empty-state';
    e.textContent='请先选择一个文档（根目录不支持版本历史）';
    wrap.appendChild(e);return wrap;
  }
  const loading=document.createElement('div');loading.className='empty-state';
  loading.textContent='加载中…';
  wrap.appendChild(loading);
  loadVersionList(doc.id).then(list=>{
    if(!wrap.isConnected)return;
    loading.remove();
    if(!list.length){
      const e=document.createElement('div');e.className='empty-state';
      e.textContent='暂无版本快照';
      wrap.appendChild(e);return;
    }
    [...list].reverse().forEach(v=>{
      const item=document.createElement('div');item.className='history-item';
      const d=new Date(v.ts);
      const ts=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const metaText=v._locked
        ? '🔒 需解锁查看'
        : (v._corrupt ? '⚠ 快照损坏' : Object.keys(v.nodes||{}).length+' 个节点');
      item.innerHTML=`<div class="h-time">${esc(v.title||'未命名')} · ${ts}</div><div class="h-actions">${metaText}</div>`;
      item.onclick=()=>{
        if(v._locked){toast('请先解锁加密库');return;}
        if(v._corrupt){toast('该快照已损坏，无法恢复');return;}
        appConfirm(`恢复到 ${ts} 的版本？当前修改将被覆盖。`,()=>{
          commit(s=>{
            const before=s.nodes[doc.id];
            const keep={
              _isWord:before?before._isWord:undefined,
              starred:before?before.starred:0,
              private:before?before.private:false,
              createdAt:before?before.createdAt:Date.now()
            };
            const sub=docSubtree(doc.id);
            sub.forEach(id=>{
              if(id!==doc.id){
                delete s.nodes[id];
                purgeNodeMeta(s,id);
              }
            });
            const snapNodes=v.nodes||{};
            for(const sid in snapNodes){
              const cloned=clone(snapNodes[sid]);
              if(cloned._deleted)delete cloned._deleted;
              s.nodes[sid]=cloned;
            }
            /* FIX-L-29：恢复只 purgeNodeMeta（不含 collapsedDocs），清理折叠标记中已不存在的节点 id，防残留累积 */
            const liveIds=new Set(Object.keys(s.nodes));
            for(const cid in ui.collapsedDocs){if(!liveIds.has(cid))delete ui.collapsedDocs[cid];}
            /* FIX-L-30：恢复整体替换子树（快照节点带快照旧 updatedAt），清空搜索 hay 缓存防陈旧命中 */
            try{_searchHayCache.clear();}catch(e){}
            const nd=s.nodes[doc.id];
            if(nd){
              if(keep._isWord!==undefined)nd._isWord=keep._isWord;
              nd.starred=keep.starred;
              nd.private=keep.private;
              nd.createdAt=keep.createdAt;
            }
          },{snapshot:true});
          forceRender();renderSidebar();
          toast('已恢复');
        });
      };
      wrap.appendChild(item);
    });
  }).catch(err=>{
    if(!wrap.isConnected)return;
    loading.textContent='加载失败：'+(err.message||'未知错误');
  });
  return wrap;
}

<script>
"use strict";
/* FIX-i18n-1 统一日期 locale：跟随浏览器语言，缺省回退 zh-CN */
const APP_LOCALE=(typeof navigator!=='undefined'&&navigator.language)||'zh-CN';

/* 【P0-6 + 任务③】环形缓冲日志 + 1分钟去重 + 可配置上报端点 + 离线队列 */

       FIX-P3-9: 队首判定不可靠——Map 迭代序为插入序，同 key 重复 set 不重排，队首可能非最旧，
       「队首过期→全量扫描」可能长期不触发；改为每 _ERR_SWEEP_INTERVAL 次访问强制一次全量扫描，
       队首过期仍作为 O(1) 快路径。 */
    if(++_errSweepCount>=_ERR_SWEEP_INTERVAL){
      _errSweepCount=0;
      for(const[k,t]of _errSeen){if(now-t>600000)_errSeen.delete(k);else break;}
    }else{
      const _oldestKey=_errSeen.keys().next().value;
      if(_oldestKey!==undefined){
        const _oldestT=_errSeen.get(_oldestKey);
        if(_oldestT!==undefined&&now-_oldestT>600000){
          for(const[k,t]of _errSeen){if(now-t>600000)_errSeen.delete(k);else break;}
        }
      }
    }
    const last=_errSeen.get(key);
    if(last&&(now-last)<60000)return; /* 1分钟去重 */
    _errSeen.set(key,now);
    /* FIX-ERR-RATE: 全局限流——60s 窗口最多放行 _ERR_RATE_MAX 条；不同消息的错误风暴不再刷满 200 环形缓冲 */
    const _win=Math.floor(now/60000);
    if(_win!==_errRateWin){_errRateWin=_win;_errRateCount=0;}
    if(_errRateCount>=_ERR_RATE_MAX)return;
    _errRateCount++;
    /* 【F11/fixed19】加密模式下 ctx 脱敏：不带 docId/nodeCount/view，仅标记 enc:true，避免节点数泄漏 */
    const entry={kind,ts:now,reported:false,ctx:encNow?{
      view:null,docId:null,nodeCount:0,enc:true,
      ver:(typeof JU_VER!=='undefined'?JU_VER:'fixed23')
    }:{
      view:(typeof ui!=='undefined'&&ui)?ui.view:null,
      docId:(typeof ui!=='undefined'&&ui)?ui.currentDocId:null,
      nodeCount:(typeof state!=='undefined'&&state&&state.nodes)?Object.keys(state.nodes).length:0,
      enc:false,
      ver:(typeof JU_VER!=='undefined'?JU_VER:'fixed23')
    },..._p};
    /* 【修复 2026-09-27】stack 截断到 4KB，避免 keepalive 请求体超限（Chrome 64KB 上限） */
    if(entry.stack&&typeof entry.stack==='string'&&entry.stack.length>4096)entry.stack=entry.stack.slice(0,4096);
    window.__juLog.push(entry);
    if(window.__juLog.length>200)window.__juLog.shift();
    /* 桌面版：同步追加写一份错误日志到应用数据目录（本地，供「反馈」导出） */
    if(typeof IS_DESKTOP!=='undefined'&&IS_DESKTOP&&typeof desktopInvoke==='function'){
      try{desktopInvoke('report_error',{entry:JSON.stringify(entry)}).catch(e=>console.warn('[JU] report_error 桌面落盘失败',e));}catch(e){}
    }
    /* 上报开关：ui.errorReporting===false 时仅本地记录 */
    if(typeof ui!=='undefined'&&ui&&ui.errorReporting===false)return;
    if(!ERROR_ENDPOINT)return; /* 纯本地版：仅保留本地环形日志 */
    try{
      if(navigator.sendBeacon&&location.protocol!=='file:'){
        const ok=navigator.sendBeacon(ERROR_ENDPOINT,new Blob([JSON.stringify(entry)],{type:'application/json'}));
        if(ok)entry.reported=true;
      }
      /* 【fixed17 D-01】file:// 环境 sendBeacon 不可靠，改用 fetch keepalive；成功才标记 reported */
      if(!entry.reported&&typeof fetch==='function'){
        fetch(ERROR_ENDPOINT,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)})
          .then(r=>{if(r.ok)entry.reported=true;}).catch(()=>{});
      }
    }catch(e){}
  }catch(e){}
  finally{_inReportError=false;}
}
/* 【任务③】批量补投未上报错误 */
window.__juFlushErrors=()=>{
  try{
    if(!ERROR_ENDPOINT)return;
    const pending=window.__juLog.filter(e=>!e.reported);
    if(!pending.length)return;
    fetch(ERROR_ENDPOINT,{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)})
      .then(r=>{if(r.ok)pending.forEach(e=>{e.reported=true;});})
      .catch(()=>{});
  }catch(e){}
};
window.__juLogDownload=()=>{
  try{
    const blob=new Blob([JSON.stringify(window.__juLog,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='ju-error-log.json';
    document.body.appendChild(a); /* FIX-ERR-LEAK: 挂载后点击再移除，并 revokeObjectURL 释放 blob URL（原实现未 append/revoke，URL 泄漏至页面关闭） */

/* ============================================================
   音乐
   ============================================================ */
const MUSIC_TRACKS=[
  {id:'bach-goldberg',title:'哥德堡变奏曲',composer:'巴赫',name:'Goldberg Variations, Aria',seq:[{n:'G3',d:1},{n:'F#3',d:.5},{n:'G3',d:.5},{n:'A3',d:1},{n:'B3',d:1},{n:'A3',d:.5},{n:'G3',d:.5},{n:'F#3',d:1},{n:'E3',d:1},{n:'D3',d:1.5},{n:'E3',d:.5},{n:'F#3',d:1},{n:'G3',d:2}]}
];
const NOTE_FREQ={'C3':130.81,'C#3':138.59,'D3':146.83,'Eb3':155.56,'E3':164.81,'F3':174.61,'F#3':185.00,'G3':196.00,'A3':220.00,'Bb3':233.08,'B3':246.94,'C4':261.63,'C#4':277.18,'D4':293.66,'Eb4':311.13,'E4':329.63,'F4':349.23,'F#4':369.99,'G4':392.00,'A4':440.00,'Bb4':466.16,'B4':493.88,'C5':523.25,'D5':587.33,'E5':659.25};
let audioCtx=null,musicStopFlag=false,currentTrackId=null,currentNodes=[],musicLoopTimer=null;
let musicVol=(()=>{
  try{
    const v=parseFloat(localStorage.getItem('juju.musicvol'));
    return Number.isFinite(v)?Math.max(0,Math.min(1,v)):0.4;
  }catch(e){return 0.4;}
})();
function playTrack(id){
  stopMusic();
  const track=MUSIC_TRACKS.find(t=>t.id===id);if(!track)return;
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    musicStopFlag=false;currentTrackId=id;ui.musicPlaying=id;
    renderMusicList();
    toast('正在播放：'+track.title);
    const trackDuration=track.seq.reduce((s,n)=>s+n.d*0.5,0);
    const GAP=1.5;
    const LOOKAHEAD=1.5;
    let nextCycleStart=audioCtx.currentTime+0.05;
    const scheduleCycle=startAt=>{
      let t=startAt;
      track.seq.forEach(note=>{
        const freq=NOTE_FREQ[note.n];
        if(!freq){t+=note.d*0.5;return;}
        const o=audioCtx.createOscillator();const g=audioCtx.createGain();
        o.type='sine';o.frequency.value=freq;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(musicVol*0.15,t+0.08);
        g.gain.exponentialRampToValueAtTime(musicVol*0.04,t+note.d*0.3);
        g.gain.exponentialRampToValueAtTime(0.0001,t+note.d*0.8);
        o.connect(g);g.connect(audioCtx.destination);
        o.start(t);o.stop(t+note.d*0.85);
        o.onended=()=>{
          const i=currentNodes.indexOf(o);
          if(i>=0)currentNodes.splice(i,1);
          try{g.disconnect();}catch(e){}
        };
        currentNodes.push(o);t+=note.d*0.5;
      });
    };
    const schedule=()=>{
      if(musicStopFlag||currentTrackId!==id)return;
      while(nextCycleStart<audioCtx.currentTime+LOOKAHEAD){
        scheduleCycle(nextCycleStart);
        nextCycleStart+=trackDuration+GAP;
      }
      musicLoopTimer=setTimeout(schedule,300);
    };
    schedule();
  }catch(e){console.error(e);toast('浏览器不支持音频');}
}
function stopMusic(){
  musicStopFlag=true;currentTrackId=null;ui.musicPlaying=null;
  clearTimeout(musicLoopTimer);musicLoopTimer=null;
  currentNodes.forEach(n=>{try{n.stop();}catch(e){}});
  currentNodes=[];renderMusicList();
  /* FIX-L-42 停止播放后挂起 AudioContext，避免其长期处于 running 状态占用音频资源（无 suspend 环境静默跳过） */
  try{if(audioCtx&&typeof audioCtx.suspend==='function')audioCtx.suspend();}catch(e){}
}

function download(filename,content,mime){
  const blob=new Blob([content],{type:(mime||'text/plain')+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  /* FIX-L-38 延迟由 100ms 延长到 3000ms，避免大 Blob 在浏览器尚未完成抓取时即 revoke 导致 0 字节下载。
     FIX-DL-1（P2-3）：3s 对慢磁盘/超大 Blob（如几百 MB 完整备份 JSON）仍可能不够——放宽到 30s
     （a.click() 后无可靠 onload 信号，30s 兜底覆盖绝大多数场景且迟 revoke 无副作用）。 */
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},30000);
}
const MAX_IMPORT_BYTES=67108864; /* FIX-file-2 单文件导入大小上限：64MB（67108864 字节） */
function readFile(file){
  /* FIX-file-2 无大小检查：readAsArrayBuffer + TextDecoder 一次性把整文件读入内存并解码，>64MB 会冻结主线程；
     超过阈值直接 reject，由 handleImportFiles 捕获后 toast 提示（errors.push(f.name+'：'+err.message)） */
  if(file&&typeof file.size==='number'&&file.size>MAX_IMPORT_BYTES){
    return Promise.reject(new Error('文件超过 64MB 上限（'+Math.round(file.size/1048576)+'MB），已拒绝导入以避免卡死'));
  }
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const buf=r.result;
      let text;
      try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf);}
      catch(e){
        try{text=new TextDecoder('gbk').decode(buf);}
        catch(e2){text=new TextDecoder('utf-8').decode(buf);}
      }
      res(text);
    };
    r.onerror=()=>rej(new Error('读取失败'));
    r.readAsArrayBuffer(file);
  });
}
function walkTree(doc,visit){
  function step(id,depth){const n=N(id);if(!n)return;visit(n,id,depth);(n.children||[]).forEach(c=>step(c,depth+1));}
  step(doc.id,-1);
}

function toOpml(doc){
  const escAttr=s=>String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/[\r\n]+/g,' ').replace(/\t/g,' ');
  const INDENT='    ';
  let body='';
  function walk(id,depth){
    const n=N(id);
    if(n.id===doc.id){n.children.forEach(c=>walk(c,depth));return;}
    const pad=INDENT.repeat(depth);
    const attrs=[`text="${escAttr(stripHtml(n.text)||'(空)')}"`,`_complete="${n.done?'true':'false'}"`];
    if(n.date)attrs.push(`_note="${escAttr(n.date)}"`);
    body+=pad+`<outline ${attrs.join(' ')}`;
    if(n.children.length){
      body+='>\n';
      n.children.forEach(c=>walk(c,depth+1));
      body+=pad+'</outline>\n';
    }else body+='/>\n';
  }
  walk(doc.id,1);
  return`<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0"><head><title>${escAttr(stripHtml(doc.text)||'JU')}</title>\n<dateCreated>${new Date().toUTCString()}</dateCreated></head>\n<body>\n${body}  </body></opml>`;
}
function toHtml(doc){

    const n=N(id);

    if(!kids.length)return'';
    let html='<ul>';
    kids.forEach(c=>{
      const cls=c.done?' class="done"':'';
      html+=`<li${cls}>${sanitizeHtml(c.text||'')}`;
      if(c.date)html+=` <span class="meta">📅 ${c.date}</span>`;
      html+=renderChildren(c.id);
      html+='</li>';
    });
    html+='</ul>';

  }
  let body=renderChildren(doc.id);
  if(doc._isWord && doc.content){
    body=`<div class="word-content">${sanitizeHtml(doc.content)}</div>`+body;
  }

}

function foldIcs(line){
  const out=[];
  let buf='';
  let bufBytes=0;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    const c=line.charCodeAt(i);
    const bytes=c<128?1:(c<2048?2:3);
    if(bufBytes+bytes>75){
      out.push(buf);
      buf=' '+ch;
      bufBytes=1+bytes;
    }else{
      buf+=ch;
      bufBytes+=bytes;
    }
  }
  out.push(buf);
  return out.join('\r\n');
}
function outlineToIcs(doc){
  const escIcs=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r\n|\r|\n/g,'\\n');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//JuJu//CN','CALSCALE:GREGORIAN'];
  lines.push('BEGIN:VTIMEZONE');
  lines.push('TZID:Asia/Shanghai');
  lines.push('BEGIN:STANDARD');
  lines.push('DTSTART:19700101T000000');
  lines.push('TZOFFSETFROM:+0800');
  lines.push('TZOFFSETTO:+0800');
  lines.push('END:STANDARD');
  lines.push('END:VTIMEZONE');
  walkTree(doc,(n,id)=>{
    if(id===doc.id||!n.date)return;
    const day=n.date.replace(/-/g,'');
    let dtstart,dtend,dateOnly=false;
    if(n.time){
      const [h,mi]=n.time.split(':').map(Number);
      dtstart=day+'T'+pad(h)+pad(mi)+'00';
      if(h>=23){
        const nextDay=new Date(parseYmd(n.date));
        nextDay.setDate(nextDay.getDate()+1);
        dtend=ymd(nextDay).replace(/-/g,'')+'T000000';
      }else{
        dtend=day+'T'+pad(h+1)+pad(mi)+'00';
      }
    }else{
      dateOnly=true;
      const dt=parseYmd(n.date);
      if(isNaN(dt.getTime()))return;
      dt.setDate(dt.getDate()+1);
      dtstart=day;
      dtend=ymd(dt).replace(/-/g,'');
    }
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+id+'@juju');
    lines.push('DTSTAMP:'+stamp);
    if(dateOnly){
      lines.push('DTSTART;VALUE=DATE:'+dtstart);
      lines.push('DTEND;VALUE=DATE:'+dtend);
    }else{
      lines.push('DTSTART;TZID=Asia/Shanghai:'+dtstart);
      lines.push('DTEND;TZID=Asia/Shanghai:'+dtend);
    }
    if(n.recur){
      const map={daily:'DAILY',weekly:'WEEKLY',monthly:'MONTHLY',yearly:'YEARLY'};
      const freq=map[n.recur.freq];
      if(freq){
        let rrule='RRULE:FREQ='+freq;
        const interval=n.recur.interval||1;
        if(interval>1)rrule+=';INTERVAL='+interval;
        if(n.recur.freq==='weekly'){
          if(n.recur.weekday!=null){
            const wd=['SU','MO','TU','WE','TH','FR','SA'][n.recur.weekday];
            if(wd)rrule+=';BYDAY='+wd;
          }
          rrule+=';WKST=MO';
        }
        if(n.recurEnd){
          rrule+=';UNTIL='+String(n.recurEnd).replace(/-/g,'')+'T235959Z';
        }else{
          rrule+=';COUNT=100';
        }
        lines.push(rrule);
      }
    }
    lines.push('SUMMARY:'+escIcs(stripHtml(n.text)||'untitled'));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(foldIcs).join('\r\n');
}

    const h=nd.h||NH;
    /* FIX-DB-07: 导出同样不截断文本——按 16 字/行拆成多行，节点矩形高度随行数自适应 */
    const charsPerLine=16;
    const lines=[];
    let cur='';
    for(const ch of txt){cur+=ch;if(cur.length>=charsPerLine){lines.push(cur);cur='';}}
    if(cur)lines.push(cur);
    if(!lines.length)lines.push('');
    svg+=`<rect x="${nd.x}" y="${nd.y-h/2}" width="${NW}" height="${h}" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    const lineH=Math.round(18*Math.max(0.8,currentBaseFontPx()/14));
    const startY=nd.y-(lines.length-1)*lineH/2+4;
    lines.forEach((ln,i)=>{
      svg+=`<text x="${nd.x+11}" y="${startY+i*lineH}" fill="${isRoot?'#fff':fg}">${esc(ln)}</text>`;
    });
  });
  svg+='</svg>';
  return svg;
}
function doDownload(type){

      const svgStr=downloadMindmapSvg(doc);
      const svgBlob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
      const svgUrl=URL.createObjectURL(svgBlob);
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const w=Math.max(img.width||800,800),h=Math.max(img.height||600,600);
        canvas.width=w*2;canvas.height=h*2;
        const ctx=canvas.getContext('2d');
        const isNight=document.documentElement.dataset.theme==='night';
        ctx.fillStyle=isNight?'#0F2440':'#DFECD5';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        URL.revokeObjectURL(svgUrl);
        canvas.toBlob(pngBlob=>{
          if(!pngBlob){download(`${name}-${todayStr()}.svg`,svgStr,'image/svg+xml');return;}
          const url=URL.createObjectURL(pngBlob);
          const a=document.createElement('a');a.href=url;a.download=`${name}-${todayStr()}.png`;
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(()=>URL.revokeObjectURL(url),500);
          toast('已下载 PNG');
        },'image/png');
      };
      img.onerror=()=>{URL.revokeObjectURL(svgUrl);download(`${name}-${todayStr()}.svg`,svgStr,'image/svg+xml');};
      img.src=svgUrl;
      break;
    }
  }
}

function importOutline(text){
  const lines=text.split(/\r?\n/);
  const entries=[];
  let inCode=false;
  const allIndents=lines.map(l=>{
    const m=l.match(/^([ \t]*)\S/);
    if(!m)return Infinity;
    const n=m[1].replace(/\t/g,'  ').length;
    return n>0?n:Infinity;
  }).filter(Number.isFinite);
  const unit=allIndents.length?allIndents.reduce((a,b)=>a<b?a:b):2;
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(/^```/.test(line.trim())){inCode=!inCode;continue;}
    if(inCode||!line.trim())continue;
    const m=line.match(/^([ \t]*)(.*)$/);if(!m)continue;
    const rawIndent=m[1].replace(/\t/g,'  ').length;
    let content=m[2];let level=-1;
    const hMatch=content.match(/^(#{1,6})\s+(.*)$/);
    if(hMatch){level=hMatch[1].length-1;content=hMatch[2];}
    content=content.replace(/^[-*+]\s+/,'').replace(/^\d+\.\s+/,'');
    let done=false;
    if(/^\[x\]\s*/i.test(content)){done=true;content=content.replace(/^\[x\]\s*/i,'');}
    else if(/^\[\s\]\s*/i.test(content))content=content.replace(/^\[\s\]\s*/i,'');
    let date=null;
    const dm=content.match(/📅\s*(\d{4}-\d{2}-\d{2})/);
    if(dm){date=dm[1];content=content.replace(/📅\s*\d{4}-\d{2}-\d{2}/g,'');}
    content=content.trim();
    if(!content)continue;
    const effIndent=level>=0?level:Math.round(rawIndent/unit);
    entries.push({indent:effIndent,text:content,done,date});
  }
  if(!entries.length)return 0;
  let count=0,firstId=null;
  commit(s=>{
    const stack=[{indent:-1,id:s.rootId}];
    for(const e of entries){
      while(stack.length>1&&stack[stack.length-1].indent>=e.indent)stack.pop();
      const parentId=stack[stack.length-1].id;
      const n=addNodeTo(s,parentId,null,{text:e.text,done:e.done,date:e.date});
      if(!n)continue;
      count++;
      if(!firstId)firstId=n.id;
      stack.push({indent:e.indent,id:n.id});
    }
  },{snapshot:true});
  const uniqueIndents=new Set(allIndents);
  const hint=uniqueIndents.size>4
    ?'（缩进不规整，层级可能不准）'
    :unit>2
      ?'（缩进单位 '+unit+' 空格）'
      :'';
  if(count>0&&firstId)actions.logActivity('add',firstId);
  toast(`已导入 ${count} 个节点${hint}`);
  return count;
}
function importOpml(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  if(doc.querySelector('parsererror'))throw new Error('OPML 解析失败');
  const body=doc.querySelector('body');if(!body)return 0;
  let count=0,firstId=null;
  commit(s=>{
    function walk(el,parentId){
      const raw=(el.getAttribute('text')||el.getAttribute('title')||'').trim();
      const childOutlines=Array.from(el.children).filter(c=>c.tagName&&c.tagName.toLowerCase()==='outline');
      if(!raw&&!childOutlines.length)return;
      let content=raw||'(空)',done=false,date=null;
      if(el.getAttribute('_complete')==='true')done=true;
      const note=el.getAttribute('_note');
      if(note&&/^\d{4}-\d{2}-\d{2}$/.test(note))date=note;
      const n=addNodeTo(s,parentId,null,{text:content,done,date});
      if(!n)return;
      count++;
      if(!firstId)firstId=n.id;
      childOutlines.forEach(c=>walk(c,n.id));
    }
    Array.from(body.children).forEach(c=>{if(c.tagName&&c.tagName.toLowerCase()==='outline')walk(c,s.rootId);});
  },{snapshot:true});
  if(count>0&&firstId)actions.logActivity('add',firstId);
  return count;
}
function importHtml(text){
  const doc=new DOMParser().parseFromString(text,'text/html');
  doc.querySelectorAll('script,style,head,nav,footer,header,title').forEach(el=>el.remove());
  const body=doc.body;if(!body)return 0;
  const entries=[];
  function walk(el,depth){
    for(const child of el.children){
      const tag=child.tagName.toLowerCase();
      if(/^h([1-6])$/.test(tag)){const t=child.textContent.trim();if(t)entries.push({depth:Math.max(0,parseInt(tag[1],10)-1),text:t});}
      else if(tag==='ul'||tag==='ol')walk(child,depth+1);
      else if(tag==='li'){
        const own=Array.from(child.childNodes).filter(n=>n.nodeType===3||(n.nodeType===1&&!/^(ul|ol)$/i.test(n.tagName))).map(n=>n.textContent).join('').trim();
        if(own)entries.push({depth,text:own});
        for(const sub of child.children){if(/^(ul|ol)$/i.test(sub.tagName))walk(sub,depth+1);}
      }else if(tag==='p'||tag==='div'){
        const hasBlocks=Array.from(child.children).some(c=>/^(div|p|ul|ol|li|h[1-6])$/i.test(c.tagName));
        if(hasBlocks)walk(child,depth);
        else{
          const t=child.textContent.trim();
          if(t){
            if(t.length<900)entries.push({depth,text:t});
            else{
              const parts=t.split(/(?<=[。！？；.!?;])/).map(s=>s.trim()).filter(Boolean);
              parts.forEach(p=>entries.push({depth,text:p}));
            }
          }
        }
      }
    }
  }
  walk(body,0);
  if(!entries.length)return 0;
  let count=0,firstId=null;
  commit(s=>{
    const stack=[{depth:-1,id:s.rootId}];
    for(const e of entries){
      let content=e.text.replace(/\s+/g,' ').trim();
      if(!content)continue;
      while(stack.length>1&&stack[stack.length-1].depth>=e.depth)stack.pop();
      const parentId=stack[stack.length-1].id;
      const n=addNodeTo(s,parentId,null,{text:content});
      if(!n)continue;
      count++;
      if(!firstId)firstId=n.id;
      stack.push({depth:e.depth,id:n.id});
    }
  },{snapshot:true});
  if(count>0&&firstId)actions.logActivity('add',firstId);
  return count;
}
/* 【修复 M3】导入 JSON 前做环路/引用完整性校验 */
/* FIX-H-04b 递归剔除 JSON.parse 可能产生的危险自有键 __proto__/constructor/prototype，从源头阻断原型污染进入状态树；仅删这三个键，不影响正常节点数据（兼容 null/数组） */
function stripDangerKeys(v){
  if(!v||typeof v!=='object')return v;
  if(Array.isArray(v)){for(const item of v)stripDangerKeys(item);return v;}
  for(const k of ['__proto__','constructor','prototype']){
    if(Object.prototype.hasOwnProperty.call(v,k))delete v[k];
  }
  for(const k in v){
    if(Object.prototype.hasOwnProperty.call(v,k))stripDangerKeys(v[k]);
  }
  return v;
}
function validateImportedTree(p){
  if(!p||typeof p!=='object')return{ok:false,err:'不是有效对象'};
  stripDangerKeys(p); /* FIX-H-04b 校验前先清洗整棵导入对象的危险键 */
  if(!p.nodes||typeof p.nodes!=='object')return{ok:false,err:'缺少 nodes 字段'};
  if(!p.rootId||!p.nodes[p.rootId])return{ok:false,err:'缺少根节点'};
  /* 【修复 2026-09-27】DFS 区分「访问过」与「当前路径上」：
     visited 去重（多父共享子树的合法 DAG 不再误报），onStack 判定真环 */
  const visited=new Set();
  const onStack=new Set();
  const stack=[p.rootId];
  while(stack.length){
    const id=stack[stack.length-1];
    const n=p.nodes[id];
    if(!n)return{ok:false,err:'引用了不存在的节点：'+id};
    onStack.add(id);
    if(!Array.isArray(n.children)){onStack.delete(id);stack.pop();continue;}
    let advanced=false;
    for(const cid of n.children){
      if(typeof cid!=='string')return{ok:false,err:'子节点 ID 非字符串'};
      if(!p.nodes[cid])return{ok:false,err:'子节点引用不存在：'+cid};
      if(onStack.has(cid))return{ok:false,err:'检测到节点引用环路（节点 '+cid+'）'};
      if(visited.has(cid))continue;
      visited.add(cid);
      stack.push(cid);
      advanced=true;
      break;
    }
    if(!advanced){onStack.delete(id);stack.pop();}
  }
  /* 【P1-11 M2】检测不可达子树中的环（漂浮节点） */
  for(const id in p.nodes){
    if(visited.has(id))continue;
    const seen=new Set();
    let cur=id;
    const chain=[];
    while(cur&&!seen.has(cur)){
      if(!p.nodes[cur])break;
      seen.add(cur);chain.push(cur);
      cur=p.nodes[cur].parent;
    }
    if(cur&&seen.has(cur))return{ok:false,err:'检测到漂浮子树环路（节点 '+cur+'）'};
  }
  return{ok:true};
}
async function handleImportFiles(files){
  let total=0;const errors=[];
  for(const f of files){
    try{
      const text=await readFile(f);
      const ext=(f.name.split('.').pop()||'').toLowerCase();
      if(ext==='ics'){importICS(text);total++;continue;}
      if(ext==='opml'){total+=importOpml(text);continue;}
      if(ext==='db'||ext==='sqlite'||ext==='sqlite3'){
        if(!IS_DESKTOP){errors.push(f.name+'：.db 仅桌面版支持，浏览器版请导入 JSON 备份');continue;}
        try{
          const buf=await readFileArrayBuffer(f);
          /* FIX-file-1 直接传 Uint8Array（Tauri invoke structured clone 支持 typed array），避免 Array.from 逐字节转普通数字数组造成 8-10 倍内存放大 */

          const ok=await desktopReloadIntoApp();
          if(ok)toast('已从 SQLite 文件恢复（导入前已自动备份当前库）');
          else errors.push(f.name+'：导入的数据库为空或不可读');
        }catch(err){errors.push(f.name+'：'+(err.message||'导入失败'));}
        continue;
      }
      if(ext==='docx'){errors.push(f.name+'：.docx 为二进制格式，请另存为 .html 或 .md 后导入');continue;}
      if(ext==='html'||ext==='htm'||ext==='doc'){total+=importHtml(text);continue;}
      if(ext==='json'){
        let p;
        try{p=JSON.parse(text);}catch(perr){errors.push(f.name+'：JSON 解析失败');continue;}
        const isFull=!!(p&&p.app==='juju'&&p.type==='full-backup'&&p.state&&p.state.nodes&&p.state.rootId);
        const restoreState=isFull?p.state:p;
        if(!restoreState||typeof restoreState!=='object'||!restoreState.nodes||typeof restoreState.nodes!=='object'||!restoreState.rootId){
          errors.push(f.name+'：不是有效的JU备份（缺少 nodes 或 rootId）');
          continue;
        }
        /* 【修复 M3】环路 / 引用完整性校验 */
        const v=validateImportedTree(restoreState);
        if(!v.ok){errors.push(f.name+'：'+v.err);continue;}
        /* 旧版本备份归一化（补 tagColors/dbFields/activity/_ver 等，修复孤儿节点） */
        const normRestore=migrateStateObject(restoreState);
        if(!normRestore){errors.push(f.name+'：备份结构无法修复');continue;}
        try{
          localStorage.setItem('juju.backup.preimport',JSON.stringify({ts:Date.now(),state}));
        }catch(e){
          toast('备份当前数据失败，已取消导入');
          continue;
        }
        let brokenRefs=0;
        for(const id in restoreState.nodes){
          const n=restoreState.nodes[id];
          if(!n||!Array.isArray(n.children))continue;
          n.children.forEach(cid=>{if(!restoreState.nodes[cid])brokenRefs++;});
        }
        const ok=await new Promise(res=>{
          appConfirm(
            brokenRefs>0
              ? `备份中存在 ${brokenRefs} 个断裂的子节点引用，导入后这些节点将不可见。仍要继续？`
              : (isFull?'完整备份将覆盖当前数据（含界面设置 / 图谱位置 / 历史版本，已自动备份当前数据）':'导入 JSON 备份会覆盖当前数据（已自动备份），确定继续？'),
            ()=>res(true),
            ()=>res(false));
        });
        if(!ok)continue;
        initStore(normRestore);
        ensureCalendarRoot();
        if(isFull){
          if(p.ui&&typeof p.ui==='object')applyUIFields(p.ui);
          if(p.graphpos&&typeof p.graphpos==='object'){_graphPositions=p.graphpos;saveGraphPositions();}
          if(Array.isArray(p.versions))await restoreVersions(p.versions);
          toast('已恢复完整备份');
        }else{
          toast('已恢复备份');
        }
        saveUI();
        renderSidebar();
        forceRender();
        flushPersistNow();
        schedulePersist();
        return;
      }
      total+=importOutline(text);
    }catch(err){errors.push(f.name+'：'+(err.message||'未知错误'));}
  }
  renderSidebar();forceRender();
  if(errors.length)toast('部分失败：'+errors.join('；'));
  else if(total>0)toast(`已导入 ${files.length} 个文件，共 ${total} 个节点`);
  else toast('未识别到可导入的内容');

function importICS(text){
  text=String(text||'').replace(/\r\n[ \t]|\n[ \t]|\r[ \t]/g,'');
  const unescIcs=s=>String(s||'')
    .replace(/\\n/gi,'\n')
    .replace(/\\,/g,',')
    .replace(/\\;/g,';')
    .replace(/\\\\/g,'\\');
  const events=text.split('BEGIN:VEVENT');
  const calRootId=getCalendarRootId();
  const items=[];
  events.slice(1).forEach(ev=>{
    const summary=unescIcs((ev.match(/SUMMARY[^:]*:([^\r\n]+)/)||[])[1]||'imported');
    const dtstart=(ev.match(/DTSTART[^:]*:([^\r\n]+)/)||[])[1]||'';
    if(dtstart&&dtstart.length>=8){
      const y=dtstart.slice(0,4),m=dtstart.slice(4,6),d=dtstart.slice(6,8);
      const dateStr=y+'-'+m+'-'+d;
      let timeStr=null;
      const tMatch=dtstart.match(/T(\d{2})(\d{2})(\d{2})?(Z)?/);
      if(tMatch){
        let hh=parseInt(tMatch[1],10),mm=parseInt(tMatch[2],10);
        if(tMatch[4]==='Z'){
          const utc=new Date(Date.UTC(parseInt(y,10),parseInt(m,10)-1,parseInt(d,10),hh,mm));
          hh=utc.getHours();mm=utc.getMinutes();
        }
        timeStr=pad(hh)+':'+pad(mm);
      }
      const opts={text:summary.trim(),date:dateStr,showInCal:true};
      if(timeStr)opts.time=timeStr;
      items.push(opts);
    }
  });
  if(items.length){
    commit(s=>{
      items.forEach(opts=>addNodeTo(s,calRootId,null,opts));
    },{snapshot:true});
  }
  forceRender();
  toast('已导入 '+items.length+' 个事件');
}
