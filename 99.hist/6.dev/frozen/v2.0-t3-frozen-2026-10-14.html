<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JU</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E59A7'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E桔%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#DFECD5;--bg-soft:#CAD3C3;--bg-mid:#D6E3CB;--bg-panel:#EAF3E1;--bg-panel2:#E2EDD7;--bg-menu:#D3DEC9;
  --fg:#24332B;--fg-dim:#54685C;--line:#2E4B3A;--line-soft:#BDCCAE;
  --title:#33654C;--accent:#33654C;--accent-soft:#C9DCC4;--accent-fg:#33654C;--accent-deep:#24493A;
  --danger:#C42617;--warn:#AB372F;--shadow:rgba(36,51,43,.12);--focus:#33654C;
  --icon:#4A7A5E;--star-edge:#4A7A5E;--now-line:#7C1823;
  --font-size:14px;--lh:1.7;--tg-hour-h:40px; /* FIX-P3-3: --tg-hour-h 显式预置（原仅有零散 fallback），首帧不再跳变；运行期由 applyScale/renderCalendarPage 实测覆盖 */
  --sidebar-left-w:calc(230px * var(--ui-scale,1));--sidebar-right-w:calc(250px * var(--ui-scale,1));--topbar-min-h:48px;--content-pad-t:24px;--doc-header-h:28px; /* FIX-R8-4: doc-header 首帧初始高度（默认字号下标题≈28px）；FIX-R8-5: 侧栏宽随 --ui-scale 缩放（拖拽/恢复写绝对 px 覆盖） */
  /* ===== design token（版式/圆角/层级/节奏） ===== */
  --content-max:1100px;--content-max-doc:920px;
  --radius-sm:6px;--radius:8px;--radius-lg:12px;--radius-xl:16px; /* FIX-P3-4: 原 6/7/10/14 中 --radius-sm 与 --radius 层级不可辨——改为 6/8/12/16 四级递增 */
  --z-float:800;--z-panel:900;--z-pop:1200;--z-modal:1500;--z-modal-pop:1600;--z-toast:2000;--z-menu:10050;--z-palette:9998;--z-lock:9999; /* FIX-P2-19: --z-menu 2100→10050——语境菜单需盖过 .tag-palette(9998)，原 2100 被压（右键标签节点时 ctxMenu 在调色板之下） */
  --t-fast:.12s;--t-base:.2s;--t-slow:.3s;
  --topbar-h:48px;
}
html[data-theme="night"]{
  --bg:#3170A7;--bg-soft:#1772B4;--bg-mid:rgba(8,22,44,.55);--bg-panel:rgba(10,25,47,.60);--bg-panel2:rgba(16,40,70,.55);--bg-menu:#0F2440;
  --fg:#E6F0FA;--fg-dim:rgba(230,240,250,.92);--line:rgba(100,200,255,.35);--line-soft:rgba(255,255,255,.12);
  --title:#8FC9F5;--accent:#4DB8FF;--accent-soft:rgba(20,45,80,.85);--accent-fg:#E6F0FA;--accent-deep:#BDE4FF;
  --danger:#FF8A7A;--warn:#FFC98A;--shadow:rgba(0,0,0,.50);--focus:#4DB8FF;
  --icon:#A8CCF0;--star-edge:#FFD36E;--now-line:#7C1823;
}
/* 午夜深度：顶栏/侧栏直接用主题 token --bg-soft(#1772B4) 纯色 + 阴影造层次（移除硬编码渐变叠加，与子元素背景一致）；
   主内容区以 #3170A7 收底的深藏青渐变 */
html[data-theme="night"] body{background:linear-gradient(180deg,#0A1929 0%,#0E2240 100%)}
html[data-theme="night"] #app{background:transparent}
html[data-theme="night"] #topbar{box-shadow:0 2px 8px rgba(0,0,0,.35)}
html[data-theme="night"] #sidebarLeft{box-shadow:inset 0 0 40px rgba(0,0,0,.25),2px 0 10px rgba(0,0,0,.30)}
html[data-theme="night"] #sidebarRight{box-shadow:inset 0 0 40px rgba(0,0,0,.25),-2px 0 10px rgba(0,0,0,.30)}
html[data-theme="night"] #main{background:linear-gradient(180deg,#0A1929 0%,color-mix(in srgb,var(--bg) 55%,#0A1929) 100%)}
html[data-theme="night"] #toast{background:#0F2440;color:#E6F0FA}
html[data-theme="night"] .tb-wbtn.close:hover{background:color-mix(in srgb,var(--danger) 30%,transparent)}
/* 夜间 --danger 改为浅色文本红后，深色底徽标/休假角标需深色字保证对比 */
html[data-theme="night"] .cal-rest{color:#3A0C06}
html[data-theme="night"] .remind-badge{color:#3A0C06}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--font-size);line-height:var(--lh);color:var(--fg);background:var(--bg);overflow:hidden;transition:background var(--t-base),color var(--t-base)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--radius-sm)}
/* FIX-a11y-3: Firefox 滚动条样式（全局） */
html{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sb-square svg,.sb-icon-row .sort-btn svg,.sb-tool svg,.tb-wbtn svg,.sb-icon svg,.sr-lock svg,.sr-edit-btn svg,.sr-btn .ic svg{display:block;stroke:var(--icon);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#app{display:flex;flex-direction:column;height:100%;width:100%;background:var(--bg);transition:filter var(--t-base)}
#topbar{min-height:var(--topbar-min-h,48px);height:auto;flex:none;display:flex;align-items:center;padding:0 10px;background:var(--bg-soft);border-bottom:1px solid var(--line-soft);position:relative;z-index:30} /* FIX-R6-1: min-height 用独立 --topbar-min-h 固定 48px；--topbar-h 仅作实测偏移（抽屉 top），不再自引用锁死 */
.tb-nav-btn.disabled{opacity:.4;cursor:not-allowed}
.tb-clock{font-size:1.02em;color:var(--fg);font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;font-weight:700;padding:0 12px;letter-spacing:.03em;flex:none}
.tb-nav{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:1px}
.tb-nav-btn{padding:7px 15px;border-radius:var(--radius);font-size:.88em;color:var(--fg-dim);transition:var(--t-fast);font-weight:500;white-space:nowrap}
.tb-nav-btn:hover{background:var(--bg-panel);color:var(--fg)}
.tb-nav-btn.active{background:var(--accent);color:#fff;font-weight:600}
.tb-right{display:flex;gap:2px;margin-left:auto}
.tb-wbtn{width:30px;height:26px;border-radius:var(--radius-sm);color:var(--icon);display:flex;align-items:center;justify-content:center;transition:var(--t-fast);padding:0;position:relative} /* position:relative：供 .remind-badge 定位（合并原重复规则） */
.tb-wbtn svg{width:16px;height:16px}
.tb-wbtn:hover{background:var(--bg-panel)}
.tb-wbtn.close:hover{background:#E8B0AA}
.tb-wbtn.close:hover svg{stroke:#fff}
#btnMin svg,#btnClose svg{stroke-width:2.6}
#body{flex:1;display:flex;min-height:0;overflow:hidden;position:relative}
.main-toggle{position:static;width:32px;height:22px;border-radius:var(--radius-sm);background:transparent;border:1px solid transparent;color:var(--icon);font-size:.72em;display:flex;align-items:center;justify-content:center;transition:var(--t-fast);padding:0}
.main-toggle:hover{background:var(--bg-panel);border-color:var(--line);color:var(--accent-fg)}
/* 【用户要求 R10】恢复折叠按钮到主内容区左右顶角：absolute 相对顶栏（position:relative）悬浮于内容区左上/右上角，
   left/right 按侧栏宽定位 = 内容区左右内缘；折叠后侧栏隐藏、内容区贴视口边缘，按钮跟随（body.sb-*-collapsed） */
#topbar .main-toggle{position:absolute;top:calc(100% + 3px);left:calc(var(--sidebar-left-w) + 4px);width:32px;height:22px;margin:0;border-radius:var(--radius-sm);z-index:var(--z-float);background:transparent;border:1px solid transparent} /* FIX-R11: 常态去浅色背景与外框线（用户要求），仅保留图标；hover 反馈由下方规则提供；FIX-R12: 距内容区左缘 8px→4px；FIX-R13: 上移 6px→3px */
#topbar .main-toggle.right{left:auto;right:calc(var(--sidebar-right-w) + 4px)} /* FIX-R12: 距内容区右缘减半 */
body.sb-left-collapsed #topbar .main-toggle.left{left:4px} /* 折叠后内容区左缘=视口左端，按钮贴内容区左上角（FIX-R12: 距离减半） */
body.sb-right-collapsed #topbar .main-toggle.right{right:4px} /* 折叠后内容区右缘=视口右端，按钮贴内容区右上角（FIX-R12: 距离减半） */
/* FIX-DB-09: 图谱折叠按钮与其他视图保持一致（不再下移 45px 避让 sticky 标题；按钮 z-index 高于标题栏，
   悬浮于标题栏左侧空白区，与大纲/导图行为一致）——折叠按钮在所有视图统一 top:calc(100% + 3px) */
/* 【侧栏整理】折叠按钮：黄金矩形外轮廓 + 内部黄金分割竖线；竖线位置参照侧边栏与主内容区关系
   左钮(左侧栏=小份0.382)竖线在左；右钮(右侧栏=小份)竖线在右0.618；折叠时竖线贴侧边栏方向边缘
   默认态按钮透明仅保留图标一层轮廓；hover 时显形按钮底反馈可点击 */
.main-toggle .tg-icon{width:20px;height:12.5px;display:block}
.main-toggle .tg-frame{stroke:currentColor;stroke-width:1.1}
.main-toggle .tg-solid{fill:currentColor;transition:transform var(--t-fast) ease}
.main-toggle.left .tg-solid{transform:translateX(0)}
.main-toggle.left.collapsed .tg-solid{transform:translateX(-4.6px)}
.main-toggle.right .tg-solid{transform:translateX(0)}
.main-toggle.right.collapsed .tg-solid{transform:translateX(4.6px)}
#sidebarLeft{width:var(--sidebar-left-w);flex:none;background:var(--bg-soft);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;overflow:hidden;transition:margin-left var(--t-base);position:relative}
#sidebarLeft.collapsed{margin-left:calc(var(--sidebar-left-w) * -1)}
#sidebarResize{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:50;display:flex;align-items:center;justify-content:center}
#sidebarResize::after{content:'';width:2px;height:100%;background:transparent;transition:background var(--t-fast)}
#sidebarResize:hover::after,#sidebarResize.dragging::after{background:var(--accent,#4a9eff)}
#sidebarResize.at-limit::after{background:var(--warn);box-shadow:0 0 6px color-mix(in srgb,var(--warn) 60%,transparent)} /* FIX-R9-5: 合并重复规则（原 dragging 三连写删冗余） */
#sidebarLeft.collapsed #sidebarResize{display:none}
body.sb-resizing{cursor:col-resize!important;user-select:none!important}
.sb-nav-block{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow-y:auto;border-bottom:1px solid var(--line-soft)} /* FIX-1: 导航块可滚动，四组全展开时底部工具条不被裁 */
.sb-nav-body{padding:10px 8px 8px}
.sb-icon-row{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap;justify-content:space-around} /* FIX-10: 窄侧栏自动换行成两行，对齐策略与 .sb-tools 一致 */
.sb-square,.sb-icon-row .sort-btn{flex:1 1 0;min-width:22px;max-width:30px;aspect-ratio:1/1;border-radius:var(--radius);background:var(--bg-panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--icon);transition:var(--t-fast);position:relative;box-shadow:0 1px 2px var(--shadow);padding:0}
.sb-square svg,.sb-icon-row .sort-btn svg{width:62%;height:62%}
.sb-square:hover,.sb-icon-row .sort-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.sb-square:hover svg,.sb-icon-row .sort-btn:hover svg{stroke:var(--accent-fg)}
.sb-search{position:relative;margin-bottom:6px}
.sb-search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-panel);font-size:.84em;outline:none;color:var(--fg)}
.sb-search input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sb-divider{height:1px;background:var(--line-soft);margin:8px 0}
.sb-nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:var(--radius-sm);font-size:.86em;color:var(--fg-dim);transition:var(--t-fast);text-align:left;margin-bottom:1px}
.sb-nav-item:hover{background:var(--bg-panel);color:var(--fg)}
.sb-nav-item.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent-deep)}
html[data-theme="night"] .sb-nav-item.active{color:#0A1929}
.sb-nav-item .ic{width:15px;height:15px;display:flex;align-items:center;justify-content:center;flex:none}
.sb-nav-item .ic svg{width:100%;height:100%;stroke:var(--icon);fill:none;stroke-width:1.8}
.sb-nav-item.active .ic svg{stroke:var(--accent-fg)}
.sb-nav-item .count{margin-left:auto;font-size:.75em;opacity:.75}
.sb-nav-item .chev{width:12px;flex:none;text-align:center;font-size:.72em;color:var(--icon);opacity:.65;transition:var(--t-fast);order:0}
.sb-nav-item .chev.none{visibility:hidden}
.sb-nav-item.open .chev{transform:rotate(90deg)}
.sb-subtree{padding-left:0;overflow:hidden;max-height:0;transition:max-height var(--t-base) ease}
.sb-subtree.open{max-height:none;overflow:visible;transition:none} /* FIX-P2-7: 原 max-height:10000px 的 0→10000 过渡先大跳再稳定、视觉「闪一下」——open 态解除高度约束与过渡（外层 .sb-nav-block 单一滚动承接），动画代价换取无跳变展开 */
#subDb,#subStarred,#subTags{padding-left:0}
/* 【fixed21】docs 子树整体右移一级：直接子项（文件夹/文档）相对"我的文档"头部缩进 14px，嵌套子项由 .sb-children 再 +14px */
#subDocs{padding-left:14px}
/* 【侧栏整理】层级缩进统一由 .sb-children 的 14px 提供，行本身不再单独加深首层，保证各子树首层图标列对齐 */
.sb-node{margin-bottom:1px}
.sb-row{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--t-fast);user-select:none;font-size:.83em}
.sb-add{color:var(--accent-fg);cursor:pointer} /* FIX-P3-8: 「新建标签/新建数据库」专属样式——原仅靠内联色生效，无独立规则 */
.sb-add:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sb-row:hover{background:var(--bg-panel)}
.sb-row.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent-deep)} /* FIX-12: 选中态用 accent 实色+白字+左侧色条，强于 hover */
html[data-theme="night"] .sb-row.active{color:#0A1929}
/* 【fixed16 A】侧栏拖拽视觉 */
.sb-row.dragging{opacity:.4}
.sb-row.drop-before{box-shadow:0 -2px 0 var(--accent)}
.sb-row.drop-after{box-shadow:0 2px 0 var(--accent)}
.sb-row.drop-child{background:var(--accent-soft)!important;outline:2px solid var(--accent)}
.sb-arrow{position:relative;width:22px;font-size:.8em;color:var(--icon);opacity:.85;flex:none;text-align:center;transition:var(--t-fast);cursor:pointer;order:0} /* FIX-R3-5: 加宽可视区，44px 伪元素热区溢出减少，不再抢图标左侧点击 */
/* FIX-a11y-1: 折叠箭头视觉 12px，用隐形伪元素把触摸热区扩到 44×44（居中覆盖，不影响布局）；hover 时热区显现圆形底 */
.sb-arrow::before{content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.sb-arrow:hover{opacity:1;color:var(--accent-fg)}
.sb-arrow:hover::before{background:var(--bg-panel);border-radius:50%;box-shadow:0 0 0 1px var(--line-soft)}
.sb-arrow.leaf{opacity:0;cursor:default;width:12px}
.sb-arrow.leaf::before{display:none}
.sb-icon{font-size:.95em;flex:none;width:15px;height:15px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1} /* FIX-P2-13: 抬升图标命中层级——.sb-arrow::before 的 44×44 热区向右扩出 33px，越 5px gap 覆盖到图标；position+同层 z-index 让图标优先命中，点图标不再误触发折叠 */
.sb-icon svg{width:100%;height:100%}
.sb-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1} /* FIX-P2-13: 同理——箭头热区也越界压住 label 左缘，抬升后行点击正常 */
.sb-row .count{margin-left:auto;font-size:.75em;opacity:.75;flex:none;padding-left:6px}
.sb-children{padding-left:14px;overflow:hidden}
.sb-children.collapsed{display:none}
.sb-empty{opacity:.5;font-style:italic;cursor:default}
.sb-intro{margin-top:auto;flex:none;padding:8px;border-top:1px solid var(--line-soft);background:var(--bg-soft)} /* FIX-14: 左右内边距与 .sb-nav-body 统一为 8px */
.sb-intro-row{display:flex;justify-content:space-between;gap:6px;font-size:.74em;padding:2px 2px;color:var(--fg-dim)}
.sb-intro-row .v{color:var(--fg);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100% - 3.5em);font-variant-numeric:tabular-nums} /* FIX-R6-20: 随容器宽度计算，侧栏拖到 140px 下限不再溢出 */
.sb-tools{flex:none;padding:8px 8px 10px;display:flex;gap:5px;justify-content:space-around}
.sb-tool{flex:1 1 0;min-width:0;max-width:30px;aspect-ratio:1/1;border-radius:var(--radius);background:var(--bg-panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--icon);transition:var(--t-fast);position:relative;padding:0}
.sb-tool svg{width:58%;height:58%}
.sb-tool:hover{border-color:var(--accent);background:var(--accent-soft)}
.sb-tool:hover svg{stroke:var(--accent-fg)}
.sb-tool.on{background:var(--accent);border-color:var(--accent)}
.sb-tool.on svg{stroke:#fff}
#main{flex:1;min-width:0;background:var(--bg);overflow:hidden;position:relative;display:flex}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--content-pad-t,24px) 22px 30px} /* FIX-R6-29: padding-top 走变量，图谱 sticky 标题可精确抵消 */
#sidebarRight{width:var(--sidebar-right-w);flex:none;background:var(--bg-soft);border-left:1px solid var(--line-soft);padding:12px 0;overflow-y:auto;transition:margin-right var(--t-base);position:relative} /* FIX-R4-2: position:relative 供右侧宽度拖拽 handle 定位 */
#sidebarRight.collapsed{margin-right:calc(var(--sidebar-right-w) * -1)}
/* FIX-R4-2: 右侧栏宽度拖拽 handle（与左侧 #sidebarResize 对称） */
#sidebarRightResize{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:50;display:flex;align-items:center;justify-content:center}
#sidebarRightResize::after{content:'';width:2px;height:100%;background:transparent;transition:background var(--t-fast)}
#sidebarRightResize.dragging::after{background:var(--accent)}
#sidebarRightResize.at-limit::after{background:var(--warn);box-shadow:0 0 6px color-mix(in srgb,var(--warn) 60%,transparent)}
#sidebarRightResize:hover::after{background:var(--accent)}
#sidebarRight.collapsed #sidebarRightResize{display:none}
.sr-section{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.sr-section:last-child{border-bottom:none}
.sr-title{font-size:.72em;font-weight:700;color:var(--fg-dim);margin-bottom:8px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.sr-title .chev{font-size:.85em;opacity:.65;transition:var(--t-fast);color:var(--icon)}
.sr-section.collapsed .sr-title .chev{transform:rotate(-90deg)}
.sr-section.collapsed .sr-body{display:none}
.sr-star-row{display:flex;align-items:center;justify-content:flex-start;gap:10px;position:relative;padding:4px 0;min-height:28px}
.sr-lock{width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--t-fast);line-height:1;flex:none}
.sr-lock svg{width:20px;height:20px}
.sr-lock:hover{transform:scale(1.15)}
.sr-lock.on svg{stroke:var(--accent-fg)}
.sr-stars{display:flex;gap:2px}
.sr-stars .star{font-size:1.4em;color:transparent;cursor:pointer;transition:var(--t-fast);line-height:1;-webkit-text-stroke:1px var(--icon)}
.sr-stars .star:hover{transform:scale(1.15)}
.sr-stars .star.on{color:var(--icon)}
.sr-btn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;border-radius:var(--radius);font-size:.83em;color:var(--fg-dim);text-align:left;transition:var(--t-fast)}
.sr-btn:hover{background:var(--bg-panel);color:var(--accent-fg)}
.sr-btn .ic{width:15px;height:15px;display:flex;align-items:center;justify-content:center;flex:none}
.sr-btn .ic svg{width:100%;height:100%}
.sr-btn:hover .ic svg{stroke:var(--accent-fg)}
.sr-edit-row{display:flex;gap:3px;margin-bottom:5px;flex-wrap:wrap}
.sr-edit-btn{min-width:28px;height:28px;padding:0;border-radius:var(--radius-sm);background:var(--bg-panel);border:1px solid var(--line-soft);color:var(--icon);font-size:.84em;display:flex;align-items:center;justify-content:center;transition:var(--t-fast);flex:1}
.sr-edit-btn svg{width:15px;height:15px}
.sr-edit-btn:hover{border-color:var(--accent);color:var(--accent-fg)}
.sr-edit-btn:hover svg{stroke:var(--accent-fg)}
.sr-edit-btn.on{border-color:var(--accent);color:var(--accent-fg);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.sr-edit-btn.on svg{stroke:var(--accent-fg)}
.sr-print-panel{display:none;padding:6px 0}
.sr-print-panel.on{display:block}
.sr-print-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);font-size:.83em;color:var(--fg-dim);cursor:pointer;margin-bottom:5px;background:var(--bg-panel);transition:var(--t-fast)}
.sr-print-opt:hover{border-color:var(--accent);color:var(--accent-fg)}
.btn{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--line-soft);background:var(--bg-panel);font-size:.82em;color:var(--fg-dim);transition:var(--t-fast);white-space:nowrap}
.btn:hover{color:var(--accent-fg);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.print-primary{background:var(--icon);color:#fff;border-color:var(--icon)}
.outline{max-width:var(--content-max-doc);margin:0 auto}
.outline .doc-header{position:sticky;top:0;z-index:21;background:var(--bg)} /* FIX-R6-14: 大纲标题固定在顶部，滚动时不被多选条（z20）遮住 */
.outline .doc-header{justify-content:center} /* FIX-DB-05: 大纲标题行水平居中 */
.outline .doc-header-title{flex:1 1 auto;text-align:center} /* FIX-DB-05: 标题占满剩余宽度并居中文本（sticky 容器即为星标绝对定位上下文，不再另设 relative 以免覆盖 sticky） */
.outline .doc-header-stars{position:absolute;right:0;top:50%;transform:translateY(-50%);margin-left:0} /* FIX-DB-05: 星标固定在右侧，不参与居中计算 */
.node{position:relative}
/* 【fixed14 虚拟滚动】content-visibility: auto 让浏览器跳过屏外行渲染，自动保持滚动位置 */
/* FIX-compat-1: content-visibility 仅 Chrome85+/Edge85+，Safari≤17 不支持；用 @supports 包裹使不支持浏览器整组规则不生效，回退为普通全量渲染（JS 的 .virtual class 无副作用） */
@supports (content-visibility: auto){
.outline.virtual .node{content-visibility:auto;contain-intrinsic-size:auto 36px}
.outline.virtual .node .children{content-visibility:auto;contain-intrinsic-size:auto 36px}
.outline.virtual .node.has-children{contain-intrinsic-size:auto 120px} /* FIX-R6-7: 含子树的节点用更大估算；FIX-R8-7: 改 class 标记，兼容旧 Firefox */
}
.row{display:flex;align-items:flex-start;gap:2px;border-radius:var(--radius-sm);padding:1px 0;transition:background var(--t-fast)}
.row:hover{background:var(--bg-panel);/* FIX-M-30: color-mix 不支持的旧浏览器回退为纯色 hover 底，现代浏览器由下条 color-mix 覆盖 */background:color-mix(in srgb,var(--fg) 5%,transparent)}
html[data-theme="night"] .row:hover{background:color-mix(in srgb,var(--fg) 10%,transparent)} /* FIX-P2-14: 夜间 --fg 为浅色，5% 叠在深底上几乎不可见——夜间阈值提高到 10% */
.row.sel{background:var(--accent-soft);background:color-mix(in srgb,var(--accent) 14%,transparent)} /* FIX-R2-2: 选中态纯色回退 + color-mix 渐进增强 */
.arrow,.bullet{flex:none;height:calc(var(--font-size) * var(--lh));display:flex;align-items:center;justify-content:center;line-height:1;margin-top:2px}
.arrow{width:20px;color:var(--icon);font-size:.72em;opacity:.65;transition:var(--t-fast);border-radius:var(--radius-sm);user-select:none;cursor:pointer;order:0}
.arrow:hover{opacity:1;background:var(--line)}
.arrow.leaf{cursor:default;font-size:0}
.arrow.leaf:hover{background:none}
.arrow.leaf::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--icon);opacity:.85;display:block}
.bullet{width:6px;height:6px;border-radius:50%;background:var(--icon);opacity:.85;align-self:flex-start;margin-top:calc((var(--font-size) * var(--lh) - 6px) / 2 + 2px)}
.text{flex:1;min-width:0;outline:none;padding:2px 6px;border-radius:var(--radius-sm);white-space:pre-wrap;word-break:break-word;min-height:calc(var(--font-size) * var(--lh));line-height:var(--lh);caret-color:var(--accent);color:var(--fg)}
.text:focus{background:var(--accent-soft);/* FIX-M-30: 聚焦高亮纯色回退 */background:color-mix(in srgb,var(--accent) 8%,transparent);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent) inset} /* FIX-P2-16: 加内描边环——在 .row.sel/.cal-item 等 accent 底色行内聚焦时底色融合、光标难辨，描边环保证编辑区边界可见 */
/* 输入行背景只保留 1 层极淡 #2E59A7：聚焦时行背景让位，避免与 hover/选中叠加 */
.row:has(.text:focus),.row.sel:has(.text:focus){background:transparent}
.text.done{color:var(--fg-dim);text-decoration:line-through}
.text[data-empty="1"]::before{content:attr(data-ph);color:var(--fg-dim);opacity:.55;pointer-events:none}
.row-actions{display:flex;gap:4px;align-items:center;flex:none;padding-top:.32em;padding-right:4px}
.mtime-tag{font-size:max(12px,.78em);color:var(--fg-dim);opacity:.85;padding:2px 6px;border-radius:var(--radius-sm);background:var(--bg-soft);white-space:nowrap;font-variant-numeric:tabular-nums;visibility:hidden} /* FIX-R6-8: visibility 占位（不改变行宽），hover 时淡入，文本不再换行跳动 */
.row:hover .row-actions .mtime-tag,.row:focus-within .row-actions .mtime-tag{visibility:visible}
.tag-more{display:inline-block;padding:2px 6px;border-radius:var(--radius-lg);background:var(--bg-soft);color:var(--fg-dim);font-size:.72em;font-weight:600;margin-left:4px;line-height:1.6;white-space:nowrap}
.children{padding-left:22px;border-left:1px solid transparent;overflow:hidden}
.children:hover{border-left-color:var(--line-soft)}
.collapsed-hint{font-size:.76em;color:var(--icon);padding:0 0 0 30px;opacity:.65;cursor:pointer}
.collapsed-hint:hover{opacity:1;color:var(--accent-fg)}
.empty-state{text-align:center;color:var(--fg-dim);opacity:.7;padding:60px 20px;font-size:.9em;line-height:2}
.kbd{display:inline-block;padding:1px 6px;margin:0 2px;border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--radius-sm);font-size:.82em;font-family:ui-monospace,monospace;background:var(--bg-panel)} /* FIX-13: 保留类定义（供未来快捷键提示复用）；当前无引用，不影响布局 */
.add-node{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-top:8px;border:1px dashed var(--line-soft);border-radius:var(--radius);color:var(--fg-dim);font-size:.83em;cursor:pointer;transition:var(--t-fast)}
.add-node:hover{border-color:var(--accent);color:var(--accent-fg);border-style:solid}
.doc-header{display:flex;align-items:center;justify-content:flex-start;gap:10px;max-width:var(--content-max-doc);margin:0 auto 18px;padding:0 0 12px;border-bottom:1px solid var(--line-soft);flex-wrap:nowrap;position:relative}
.doc-header-title{flex:0 1 auto;min-width:0;font-size:calc(var(--font-size) + 4px);line-height:1.3;font-weight:700;color:var(--title);outline:none;border-radius:var(--radius-sm);padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;caret-color:var(--accent);transition:background var(--t-fast);text-align:left}
.doc-header-title:hover{background:var(--accent-soft);/* FIX-M-30: 标题 hover 纯色回退 */background:color-mix(in srgb,var(--accent) 6%,transparent)}
.doc-header-title:focus{background:var(--accent-soft);/* FIX-M-30: 标题聚焦纯色回退 */background:color-mix(in srgb,var(--accent) 14%,transparent)}
.doc-header-title[data-empty="1"]::before{content:attr(data-ph);color:var(--fg-dim);opacity:.5;pointer-events:none}
.doc-header-stars{font-size:calc(var(--font-size) + 2px);color:var(--icon);flex:none;line-height:1;margin-left:auto}
.doc-header-meta{font-size:calc(var(--font-size) - 3px);color:var(--fg-dim);opacity:.75;flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.cal-page{display:flex;flex-direction:column;gap:14px;min-height:100%;min-width:0;width:100%;max-width:min(1400px,100%);margin:0 auto} /* FIX-R6-28: 4K 屏上限 1400px，普通屏保持 100% 自适应 */
.cal-top{background:var(--bg-panel);border-radius:var(--radius-lg);padding:14px 16px;border:1px solid var(--line-soft);min-width:0;max-width:100%;margin:0 auto;width:100%} /* FIX-R4-3: 日历模块自适应内容区宽度，不再受 1100px 上限约束 */
.cal-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-date-title{flex:1 1 auto;min-width:0;text-align:left;font-size:1.18em;font-weight:700;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-actions{display:flex;gap:5px;align-items:center;margin-left:auto;flex:none;flex-wrap:wrap}
.cal-view-switch{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin-right:6px}
.cal-view-btn{border:none;border-radius:0;margin:0;padding:5px 12px;font-size:.82em;background:var(--bg-panel2);color:var(--fg-dim);cursor:pointer;transition:var(--t-fast)}
.cal-view-btn:hover{color:var(--accent-fg)}
.cal-view-btn.active{background:var(--accent);color:#fff;font-weight:600}
.cal-tool{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--line-soft);background:var(--bg-panel2);color:var(--icon);font-size:.8em;transition:var(--t-fast)}
.cal-tool:hover{border-color:var(--accent);color:var(--accent-fg)}
.cal-tool.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:max(12px,.78em);color:var(--fg-dim);padding:5px 0;font-weight:600}
.cal-dow.wk{color:var(--danger);opacity:.9;background:var(--accent-soft);background:color-mix(in srgb,var(--danger) 8%,transparent);border-radius:var(--radius-sm)} /* FIX-P3-2: 日间主题「红字绿底」对比突兀——color-mix 降到 danger 8%（原 10%），底色更贴近透明、红字醒目；保留纯色回退（不支持 color-mix 的浏览器仍有底色） */
.cal-cell{min-height:calc(var(--font-size,14px)*4.4);border-radius:var(--radius);border:1px solid var(--line-soft);background:var(--bg-panel);padding:4px 5px;cursor:pointer;transition:var(--t-fast);overflow:hidden;position:relative} /* FIX-R6-2: 格高随字号缩放，200% 下文字不再被裁 */
.cal-cell:hover{border-color:var(--accent);box-shadow:0 3px 10px var(--shadow)}
.cal-cell.out{opacity:.4}
.cal-cell.today{background:var(--accent-soft);border-color:var(--accent-soft)}
.cal-cell.selected{box-shadow:0 0 0 2px var(--accent)}
.cal-daynum{font-size:.85em;font-weight:700;line-height:1.25;display:flex;align-items:baseline;gap:4px}
.cal-lunar{font-size:max(12px,.72em);color:var(--fg-dim);font-weight:400}
.cal-fest{color:var(--danger);font-weight:600}
.cal-rest{font-size:max(12px,.8em);color:#fff;background:var(--danger);border-radius:var(--radius-sm);padding:0 3px;font-weight:600;line-height:1.5;flex:none;align-self:center}
.cal-items{margin-top:2px;display:flex;flex-direction:column;gap:2px}
.cal-item{font-size:.86em;padding:1px 5px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;cursor:pointer} /* FIX-15: 无标签条目文字用 accent-deep，提高在 accent-soft 底上的对比 */
.cal-item::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block;margin-right:5px;vertical-align:1.5px;opacity:.9}
.cal-item.has-tag::before{content:none} /* FIX-R2-6: 有标签条目隐藏行首圆点（底色即标签色，圆点无区分意义） */
.cal-item:hover{filter:brightness(.95)}
.cal-item.done{opacity:.5;text-decoration:line-through}
.cal-more{font-size:.78em;color:var(--fg-dim);opacity:.7;text-align:center;letter-spacing:.2em}
/* ===== 日历周/日视图（24 小时纵向时间网格 + 今日列高亮 + 红色当前时间线）===== */
.cal-tg{display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:var(--radius-lg);background:var(--bg-panel);overflow:hidden;min-width:0;width:100%;max-width:100%;margin:0 auto} /* FIX-R4-3: 时间网格跟随内容区宽度自适应 */
.cal-tg-scroll{overflow:auto;position:relative;max-height:min(calc(var(--tg-hour-h,40px)*8),60vh);min-height:min(calc(var(--tg-hour-h,40px)*8),60vh);overscroll-behavior:contain;scrollbar-width:thin;min-width:0} /* FIX-R6-22: 小视口下不占满屏幕，大视口保持 8 小时可见 */
.cal-tg-head{position:sticky;top:0;z-index:8;display:grid;grid-template-columns:56px 1fr;background:var(--bg-panel2);border-bottom:1px solid var(--line-soft);min-width:0}
html[data-theme="night"] .cal-tg-head{background:color-mix(in srgb,var(--bg-panel2) 85%,#000)} /* FIX-R6-17: 夜间表头实底改由 --bg-panel2 派生（不再硬编码 hex，随主题体系联动） */
.cal-tg-head .cal-tg-cols{display:grid;min-width:0;background:none} /* 表头列不继承网格背景：删除表头行中间的横线 */
.cal-tg-corner{border-right:1px solid var(--line-soft)}
.cal-tg-colhead{padding:6px 4px 4px;text-align:center;border-left:1px solid var(--line-soft);font-size:.8em;color:var(--fg-dim);user-select:none;position:relative;min-width:0}
.cal-tg-colhead .dow{display:block;font-weight:700;font-size:.86em}
.cal-tg-colhead .drow{display:block;margin-top:1px;line-height:1.3}
.cal-tg-colhead .dnum{display:inline;font-variant-numeric:tabular-nums;font-size:.92em;font-weight:600}
.cal-tg-colhead .dlunar{display:inline;font-size:max(12px,.78em);opacity:.8;margin-left:4px} /* 阳历与农历同一行 */
.cal-tg-colhead.today{background:var(--accent-soft);color:var(--accent-fg);border-radius:var(--radius-sm);box-shadow:0 0 0 1px var(--accent) inset;margin:0;padding:3px 2px 2px;border-left:none} /* FIX-R6-12: 改用 inset 高亮，不改变盒模型尺寸，列头与内容列对齐 */
.cal-tg-adj{display:block;font-size:max(12px,.8em);padding:1px 5px;border-radius:var(--radius-sm);background:var(--accent-soft);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;margin-top:2px;line-height:1.5}
.cal-tg-adj:hover{filter:brightness(.97)}
.cal-tg-adj.done{opacity:.55;text-decoration:line-through}
.cal-tg-more{display:block;font-size:max(12px,.66em);color:var(--fg-dim);opacity:.75;text-align:center;cursor:pointer;margin-top:2px}
.cal-tg-body{position:relative;display:grid;grid-template-columns:56px 1fr;height:calc(var(--tg-hour-h,40px)*24 + 18px);min-width:0} /* 24 小时网格 + 底部 18px 留给 24:00 时标，随 --tg-hour-h 缩放 */
.cal-tg-gutter{position:relative;border-right:1px solid var(--line-soft);height:calc(var(--tg-hour-h,40px)*24 + 18px);font-variant-numeric:tabular-nums}
.cal-tg-hour{position:absolute;right:6px;top:0;font-size:max(12px,.75em);color:var(--fg-dim);transform:translateY(0);white-space:nowrap} /* 时标顶部对齐时间线：00:00 完整显示，24:00 完整落在底部预留区 */
.cal-tg-cols{position:relative;display:grid;background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--tg-hour-h,40px) - 1px),var(--line-soft) calc(var(--tg-hour-h,40px) - 1px) var(--tg-hour-h,40px))} /* FIX-R3-1: 格线间距随 --tg-hour-h 缩放，不再硬编码 40px */
.cal-tg-col{position:relative;border-left:1px solid var(--line-soft);min-height:calc(var(--tg-hour-h,40px)*24 + 18px);cursor:pointer}
.cal-tg-col.today{background:var(--accent-soft);background:color-mix(in srgb,var(--accent) 10%,transparent)} /* FIX-R2-2: 保留纯色回退（Safari16/Firefox<113 不支持 color-mix 时仍有底色） */
.cal-tg-ev{position:absolute;left:3px;right:3px;border-radius:var(--radius-sm);background:rgba(255,255,255,.30);backdrop-filter:blur(10px) saturate(1.35);color:var(--accent-deep);border:1px solid rgba(127,127,127,.25);padding:2px 5px;font-size:max(12px,.8em);overflow:hidden;cursor:grab;box-shadow:0 1px 2px var(--shadow);z-index:3;line-height:1.45;user-select:none;touch-action:none;min-height:calc(var(--tg-hour-h,40px)*.5)} /* FIX-9: 事件块下限 = 半小时高，避免短事件在字号放大后裁字 */
.cal-tg-ev.tagged{background:color-mix(in srgb,var(--evtag) 22%,transparent);border-color:color-mix(in srgb,var(--evtag) 45%,transparent)}
.cal-tg-ev.tagged .evtx{color:color-mix(in srgb,var(--evtag) 45%,var(--fg))}
html[data-theme="night"] .cal-tg-ev.tagged .evtx{color:var(--fg)} /* FIX-P2-17: 夜间浅色标签（黄/白）45% 浅+55% 浅 fg 在深底上刺眼——夜间回落纯 --fg，保可读性 */
html[data-theme="night"] .cal-tg-ev:not(.tagged){background:rgba(32,36,52,.42);border-color:rgba(255,255,255,.14)}
.cal-tg-ev:hover{filter:brightness(.97);border-color:var(--accent)}
.cal-tg-ev .evtx{display:block;overflow:hidden;text-overflow:ellipsis;word-break:break-word;cursor:pointer}
.cal-tg-ev .evtx:focus:not(:focus-visible){outline:none;cursor:text;background:rgba(127,127,127,.13);border-radius:var(--radius-sm)} /* FIX-R3-9: 仅隐藏鼠标聚焦环，键盘 Tab 聚焦保留 :focus-visible 外环 */
.cal-tg-ev.cal-tg-dragging{cursor:grabbing;opacity:.85;box-shadow:0 4px 10px var(--shadow)}
.cal-tg-ev::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize;border-radius:0 0 5px 5px;background:linear-gradient(transparent,rgba(0,0,0,.10))} /* FIX-P1-2: 把手固定 6px——原 min(9px,40%) 在短事件块上会占据正文高度、压住可编辑文字 */
.cal-tg-ev .evtx{font-weight:700} /* 事项加粗 */
/* ===== 设置时间浮窗：自定义时间选择下拉（缩小行距，24 小时选项完整显示） ===== */
.cal-sel{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 10px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--bg-panel2);color:var(--fg);font-size:.88em;cursor:pointer;user-select:none;min-height:28px;flex:1;min-width:0}
.cal-sel:hover{border-color:var(--accent)}
.cal-sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cal-sel.disabled{opacity:.5;pointer-events:none}

.cp-swatch.tp{background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 8px);position:relative}

.prio-badge.p3{background:#d4a017}.prio-badge.p4{background:#27ae60}
.prio-badge.p5{background:#95a5a6}
.tag-dot{display:inline-flex;align-items:center;gap:3px;font-size:.68em;padding:1px 8px;border-radius:var(--radius-lg);color:#fff;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;line-height:1.6;margin-left:4px;opacity:.95;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}

.sb-tag-dot{width:14px;height:14px;border-radius:50%;flex:none;cursor:pointer;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.2);transition:transform var(--t-fast)}

.tag-palette{position:fixed;z-index:var(--z-palette);background:var(--bg-menu);border:1px solid var(--line);border-radius:var(--radius-lg);padding:8px;display:flex;flex-wrap:wrap;gap:5px;width:150px;box-shadow:0 8px 24px var(--shadow)}

.tag-picker{position:fixed;z-index:var(--z-palette);background:var(--bg-menu);border:1px solid var(--line);border-radius:var(--radius-lg);padding:6px;min-width:176px;max-width:210px;max-height:300px;overflow:auto;box-shadow:0 8px 24px var(--shadow)}

.pop-close{position:absolute;top:3px;right:3px;width:22px;height:22px;border:none;background:transparent;color:var(--fg-dim);cursor:pointer;border-radius:var(--radius-sm);font-size:12px;line-height:22px;text-align:center;z-index:6;padding:0}
.pop-close:hover{background:var(--accent-soft);/* FIX-M-30: 关闭钮 hover 纯色回退 */background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--title)}
.cal-tag-filter.active{border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.recur-badge{display:inline-block;padding:0 5px;border-radius:var(--radius);font-size:.7em;background:var(--bg-soft);color:var(--fg-dim);margin-left:4px}
.pomo-timer{position:fixed;left:calc(var(--sidebar-left-w) + 20px);bottom:20px;bottom:calc(20px + env(safe-area-inset-bottom));/* FIX-mobile-3: 底部浮层安全区避让 */z-index:calc(var(--z-panel) - 20);background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 18px;box-shadow:0 10px 36px rgba(0,0,0,.2);min-width:180px}

.ft-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}

.ft-divider{height:1px;background:var(--line-soft);margin:10px 0}
.ft-music .music-item{padding:6px 8px}

.ft-controls input[type=range]{flex:1}
.pomo-timer .pomo-time{font-size:1.8em;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}

.pomo-timer .pomo-btns{display:flex;gap:6px;justify-content:center}

.history-item{padding:8px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:var(--t-fast)}

.history-item .h-time{font-size:.82em;font-weight:600;color:var(--accent-fg)}
.history-item .h-actions{font-size:.76em;color:var(--fg-dim);margin-top:2px}
.graph-canvas{width:100%;height:calc(100dvh - var(--topbar-h,48px));/* FIX-R3-8: 高度算式扣除顶栏实际高度；FIX-R8-3: graph-mode 已置 0 padding，直接撑满视口 */position:relative;overflow:auto;background:var(--bg);border-radius:var(--radius-lg)}
#content.graph-mode{padding-top:0;padding-bottom:0} /* FIX-R7-3: 图谱视图 #content padding 置 0，sticky 标题贴容器顶；FIX-R8-3: 底部一并置 0，不再留白 */
.graph-node{position:absolute;left:0;top:0;transform:translate3d(0,0,0) translate(-50%,-50%);padding:4px 10px;border-radius:var(--radius);background:var(--bg-panel);border:1.5px solid var(--line);font-size:.82em;cursor:grab;white-space:normal;word-break:break-word;line-height:1.3;text-align:center;max-width:180px;user-select:none;transition:border-color var(--t-fast)} /* FIX-DB-08: 节点文本允许换行，减少视觉重叠 */
.graph-node:hover{border-color:var(--accent);box-shadow:0 4px 14px var(--shadow);z-index:5}

.graph-svg{position:absolute;top:0;left:0;pointer-events:none}
.float-cal{position:fixed;width:280px;border-radius:var(--radius-lg);z-index:var(--z-float);background:var(--bg-panel);/* FIX-M-30: 浮窗 92% 面板色回退为纯色面板底 */background:color-mix(in srgb,var(--bg-panel) 92%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--line);box-shadow:0 12px 44px rgba(0,0,0,.22);overflow:hidden;user-select:none}

.fc-head{padding:9px 12px;cursor:grab;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line-soft);font-size:.82em;font-weight:700;background:var(--accent-soft);/* FIX-M-30: 日历浮窗头纯色回退 */background:color-mix(in srgb,var(--accent) 18%,transparent)}
.fc-head .close{margin-left:auto;color:var(--icon);font-size:1em;line-height:1;padding:2px 5px;border-radius:var(--radius-sm)}

.fc-body{padding:9px 11px 12px}
.fc-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.fc-week span{text-align:center;font-size:.72em;color:var(--fg-dim);font-weight:600}
.fc-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.fc-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:max(12px,.85em);border-radius:var(--radius-sm);cursor:pointer;position:relative;transition:var(--t-fast);color:var(--fg)}
.fc-day:hover{background:var(--accent-soft)}
.fc-day.out{opacity:.35;pointer-events:none}
.fc-day.today{background:var(--accent);color:#fff;font-weight:700}
.fc-day.has::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--icon)}
.fc-day.today.has::after{background:#fff}
.fc-list{margin-top:9px;border-top:1px solid var(--line-soft);padding-top:8px;max-height:150px;overflow-y:auto}
.fc-todo{display:flex;align-items:center;gap:6px;font-size:.76em;padding:3px 2px;border-radius:var(--radius-sm)}
.fc-todo input{appearance:none;width:12px;height:12px;flex:none;border:1.4px solid var(--fg-dim);border-radius:var(--radius-sm);cursor:pointer;position:relative}
.fc-todo input:checked{background:var(--accent);border-color:var(--accent)}
.fc-todo input:checked::after{content:'';position:absolute;left:3px;top:0;width:3px;height:6px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(43deg)}
.fc-todo span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-todo.done span{color:var(--fg-dim);text-decoration:line-through}
.fc-empty{font-size:.74em;color:var(--fg-dim);text-align:center;padding:8px 0;opacity:.7}
.panel{position:fixed;left:calc(var(--sidebar-left-w) + 20px);bottom:20px;bottom:calc(20px + env(safe-area-inset-bottom));/* FIX-mobile-3: 底部浮层安全区避让 */z-index:var(--z-panel);background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:0 12px 40px rgba(0,0,0,.18);width:320px;overflow:hidden;display:none;flex-direction:column} /* FIX-R2-7: 浮窗/面板用 --radius-xl(16px)，保持对话框层级 */
.panel.on{display:flex;animation:slideUp var(--t-base)}
/* 【UI修复5】今日待办浮窗由“固定左下角”改为跟随铃铛按钮定位（placePop 计算），可拖动 */
#remindPanel{bottom:auto}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.panel-head{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-soft);font-weight:700;font-size:.9em}
.panel-head .close{margin-left:auto;color:var(--icon);padding:2px 6px;border-radius:var(--radius-sm);cursor:pointer}
.panel-head .close:hover{background:var(--bg-soft);color:var(--danger)}
.settings-body{padding:8px 14px 14px;overflow-y:auto;max-height:60vh}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:.84em;gap:8px}
.settings-item:last-child{border-bottom:none}
.settings-item label{color:var(--fg-dim);flex:none}
.settings-item input[type=range]{width:120px}
.settings-item .size-val{color:var(--accent-fg);font-weight:600;font-variant-numeric:tabular-nums;min-width:44px;text-align:right;font-size:.95em}
.switch{position:relative;width:38px;height:20px;background:var(--line);border-radius:var(--radius-lg);cursor:pointer;transition:var(--t-base);flex:none}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:var(--t-base);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{left:20px}
.music-list{padding:6px;max-height:260px;overflow-y:auto}
.music-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);font-size:.83em;cursor:pointer;transition:var(--t-fast)}
.music-item:hover{background:var(--bg-soft)}
.music-item.playing{background:var(--accent-soft);color:var(--accent-fg);font-weight:600}
.music-item .play-ic{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72em;flex:none}
.music-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music-item .composer{font-size:.78em;color:var(--fg-dim)}
.music-controls{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line-soft);font-size:.8em}
.music-controls input[type=range]{flex:1}
.date-picker,.region-picker{position:fixed;z-index:var(--z-modal-pop);background:var(--bg-menu);border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px;box-shadow:0 12px 36px rgba(0,0,0,.22);font-size:.84em;min-width:260px}
.date-picker .dp-row{display:flex;gap:6px;margin-bottom:8px}

.date-picker .dp-actions,.region-picker .dp-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}

/* ===== 反链 / 出链 面板 ===== */
.ju-link{color:var(--accent);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;cursor:pointer}
.ju-link:hover{background:var(--accent-soft);border-radius:var(--radius-sm)}
.bl-row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--t-fast);font-size:.82em}
.bl-row:hover{background:var(--accent-soft)}
.bl-row .bl-ic{flex:none;width:14px;height:14px;color:var(--icon);display:flex;align-items:center;justify-content:center}
.bl-row .bl-ic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.remind-badge[hidden]{display:none}
.remind-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);font-size:.83em;cursor:pointer;transition:var(--t-fast)}

.remind-status.on .dot{background:var(--accent)}
.remind-status.on{color:var(--accent-fg)}
/* FIX-print-2: 明确打印纸张为 A4 纵向与页边距（此前全文无 @page，完全交给浏览器默认） */
@page{size:A4;margin:12mm}
@media print{
  /* FIX-print-1: 隐藏清单补 .outline-selbar（sticky 多选操作条）及同类浮层 .outline-ghost/.outline-drop-line（拖拽 ghost/占位线），避免打印页首多出操作条 */
  #topbar,#sidebarLeft,#sidebarRight,#ctxMenu,#toast,.panel,.float-cal,.main-toggle,.pomo-timer,.outline-selbar,.outline-ghost,.outline-drop-line{display:none!important}
  #app,#body,#main{display:block;height:auto;overflow:visible}
  #content{overflow:visible;padding:0;flex:none}
  body{background:#fff;color:#000;overflow:visible;height:auto;font-size:12pt}
  .print-preview{box-shadow:none;border:none;max-width:100%;padding:0;background:#fff;color:#000}
  .print-preview h1{color:#000;border-bottom-color:#000}
  .node-print{page-break-inside:avoid}
  a{color:#000;text-decoration:underline}
  /* FIX-print-3: 日历网格/数据库表格打印优化：收紧字号、避免跨页断裂（时间网格允许跨页，避免 978px 整块撑爆 A4） */
  html{--font-size:12pt;--tg-hour-h:40px} /* FIX-22: 打印时重置字号基准，组件内 em 相对值不再随屏幕缩放放大；FIX-P2-18: --tg-hour-h 同步重置——原只重置字号，时间网格行高仍按屏幕缩放值，跨页高度异常 */
  .cal-grid,.db-table{font-size:11pt;page-break-inside:avoid} /* FIX-R6-30: 与正文 12pt 拉近，避免同页字号层级混乱 */
  .cal-tg{font-size:10pt;page-break-inside:auto}
  .cal-tg-scroll{max-height:none;min-height:auto;height:auto;overflow:visible} /* FIX-21: 打印放开时间网格滚动区，自然跨页 */
  .cal-cell,.db-table tr,.db-board-card{page-break-inside:avoid}
  .cal-tg-ev{backdrop-filter:none;-webkit-backdrop-filter:none} /* FIX-R6-18: 打印去掉毛玻璃开销 */
  .db-table-wrap,.word-editor{max-height:none!important;min-height:0!important;overflow:visible!important} /* FIX-R6-3: 打印放开数据库/Word 的屏幕滚动与高度约束，全文可打印 */
}
/* ===== 响应式断点：≤1366px 顶栏导航横向滚动（FIX-P3-1: 断点 1280→1366 提前，消除 900–1366px 居中导航与两侧按钮挤压）；≤1100px 日历底部换行；≤768px 侧栏抽屉化；≤640px 隐藏时钟；≤480px 最窄屏 ===== */
@media (max-width:1366px){
  .tb-nav{position:static;transform:none;flex:1 1 auto;min-width:0;overflow-x:auto;justify-content:flex-start;margin:0 6px;scrollbar-width:none}
  .tb-nav::-webkit-scrollbar{display:none;width:0;height:0}
  .tb-right{flex:none;margin-left:0}
}
@media (max-width:1100px){
  html{--content-pad-t:16px} /* FIX-R7-2: 媒体查询内重定义变量，padding 随断点真正缩小 */
  #content{padding:var(--content-pad-t,16px) 12px}
  .word-editor{padding:24px 20px}
  /* FIX-2: 日历底部三栏在 700–1100px 中间段自动换行，避免「系统日志」栏被裁 */
  .cal-top-row{flex-wrap:wrap}
  .cal-top-row .cal-divider:not(.h){display:none} /* FIX-R6-6: 换行后隐藏列间竖线，避免双滚动条叠加 */
}
@media (max-width:768px){
  #sidebarLeft{position:fixed;z-index:var(--z-panel);top:var(--topbar-h,48px);bottom:0;left:0;margin-left:0!important;transform:translateX(-100%);transition:transform var(--t-base);box-shadow:2px 0 14px rgba(0,0,0,.28);width:var(--sidebar-left-w);max-width:86vw} /* FIX-R6-10: 抽屉宽度不超过视口，防保存的 480px 撑破 375px 屏 */
  #sidebarLeft:not(.collapsed){transform:translateX(0)}
  #sidebarLeft #sidebarResize{display:none}
  #sidebarRightResize{display:none} /* FIX-R4-2: 抽屉模式不显示拖拽 handle */
  #sidebarRight{position:fixed;z-index:var(--z-panel);top:var(--topbar-h,48px);bottom:0;right:0;margin-right:0!important;transform:translateX(100%);transition:transform var(--t-base);box-shadow:-2px 0 14px rgba(0,0,0,.28);width:var(--sidebar-right-w);max-width:86vw} /* FIX-R6-10 */
  #sidebarRight:not(.collapsed){transform:translateX(0)}
  .pomo-timer,.panel{left:12px!important;right:12px;width:auto;min-width:0}
}
@media (max-width:640px){
  .tb-clock{display:none} /* FIX-R6-21: 时钟隐藏断点 480→640，480–768px 不再与导航挤压 */
}
@media (max-width:480px){
  .tb-nav-btn{padding:7px 10px;font-size:.8em}
  .cal-tool,.cal-view-btn{padding:5px 9px}
}
.year-grid{grid-template-columns:repeat(4,1fr)} /* FIX-6: 年视图列数走 CSS，resize 自动响应 */
@media (max-width:720px){.year-grid{grid-template-columns:repeat(3,1fr)}}
/* FIX-a11y-2: 系统开启"减少动态效果"时，全局把过渡/动画时长压到近 0（覆盖应用内所有 .1-var(--t-base) transition 与 @keyframes slideUp 等动效），不影响布局 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="main-toggle left" id="btnToggleLeft" title="收起左侧栏"><svg viewBox="0 0 16 10" class="tg-icon"><rect class="tg-frame" x="0.5" y="0.5" width="15" height="9" rx="2.5" fill="none"/><rect class="tg-solid" x="1" y="2" width="5.1" height="6" rx="1.2"/></svg></button>
    <span class="tb-clock" id="tbClock">--</span>
    <nav class="tb-nav" id="tbNav">
      <button class="tb-nav-btn" data-view="document">资料库</button>
      <button class="tb-nav-btn active" data-view="outline">大纲</button>
      <button class="tb-nav-btn" data-view="mindmap">思维导图</button>
      <button class="tb-nav-btn" data-view="presentation">演示视图</button>
      <button class="tb-nav-btn" data-view="graph">图谱</button>
      <button class="tb-nav-btn" data-view="history">历史</button>
    </nav>
    <div class="tb-right">
      <button class="main-toggle right" id="btnToggleRight" title="收起右侧栏"><svg viewBox="0 0 16 10" class="tg-icon"><rect class="tg-frame" x="0.5" y="0.5" width="15" height="9" rx="2.5" fill="none"/><rect class="tg-solid" x="9.9" y="2" width="5.1" height="6" rx="1.2"/></svg></button>
      <button class="tb-wbtn" id="btnBell" title="今日待办与系统提醒"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="remind-badge" id="remindBadge" hidden>0</span></button>
      <button class="tb-wbtn" id="btnEncLock" title="已加密" style="display:none"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
      <button class="tb-wbtn" id="btnPin" title="置顶窗口"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.4H19l-4.2 3.2 1.6 5.4L12 13.8 7.6 17l1.6-5.4L5 8.4h5.2z"/><path d="M12 17v4"/></svg></button>
      <button class="tb-wbtn" id="btnSettings" title="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><path d="M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg></button>
      <button class="tb-wbtn" id="btnMin" title="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="tb-wbtn" id="btnMax" title="最大化"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
      <button class="tb-wbtn close" id="btnClose" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>
  <div id="body">
    <aside id="sidebarLeft">
      <div id="sidebarResize" title="拖动调整宽度"></div>
      <div class="sb-nav-block" id="navBlock">
        <div class="sb-nav-body">
          <div class="sb-icon-row">
            <button class="sort-btn" id="sortBtn" title="排序切换"><svg viewBox="0 0 24 24"><path d="M8 20V5"/><path d="M5 8l3-3 3 3"/><path d="M16 4v15"/><path d="M13 16l3 3 3-3"/></svg></button>
            <button class="sb-square" id="btnNewFolder" title="新建文件夹"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 11v6M9 14h6"/></svg></button>
            <button class="sb-square" id="btnNewDoc" title="新建文件"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M12 12v6M9 15h6"/></svg></button>
            <button class="sb-square" id="btnNewDb" title="新建多维表格"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.5h18"/><path d="M9.5 9.5V20"/><path d="M15.5 9.5V20"/><path d="M12 13v4M10 15h4"/></svg></button>
            <button class="sb-square" id="btnTemplates" title="模板"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 8.5h18"/><path d="M13.5 12h5M13.5 15.5h5"/></svg></button>
            <button class="sb-square" id="btnTrash" title="回收站"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M10 11v6M14 11v6"/></svg></button>
          </div>
          <div class="sb-search"><input type="text" placeholder="全局搜索…" id="searchInput"></div>
          <div class="sb-divider"></div>
          <button class="sb-nav-item" data-nav="calendar"><span class="chev none">▶</span><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>日历</button>
          <button class="sb-nav-item" data-nav="database"><span class="chev">▶</span><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.5h18M9.5 9.5V20M15.5 9.5V20"/></svg></span>数据库<span class="count" id="cntDb">0</span></button>
          <div class="sb-subtree" id="subDb"></div>
          <button class="sb-nav-item" data-nav="starred"><span class="chev">▶</span><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.3 1.3 6.1L12 17l-5.6 3 1.3-6.1L3 9.6l6.3-.7z"/></svg></span>星标文件<span class="count" id="cntStarred">0</span></button>
          <div class="sb-subtree" id="subStarred"></div>
          <button class="sb-nav-item" data-nav="files"><span class="chev">▶</span><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span>我的文档<span class="count" id="cntDocs">0</span></button>
          <div class="sb-subtree" id="subDocs"></div>
          <button class="sb-nav-item" data-nav="tags"><span class="chev">▶</span><span class="ic"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>标签<span class="count" id="cntTags">0</span></button>
          <div class="sb-subtree" id="subTags"></div>
        </div>
      </div>
      <div class="sb-intro" id="sbIntro"></div>
      <div class="sb-divider"></div>
      <div class="sb-tools">
        <button class="sb-tool" id="btnImport" title="导入"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg></button>
        <button class="sb-tool" id="btnTheme" title="切换主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16"/></svg></button>
        <button class="sb-tool" id="btnMusic" title="番茄钟与音乐"><svg viewBox="0 0 24 24"><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/><path d="M9.5 18V7l10-2v11"/></svg></button>
        <button class="sb-tool" id="btnFloatCal" title="悬浮日历"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></button>
      </div>
    </aside>
    <main id="main">
      <div id="content"></div>
    </main>
    <aside id="sidebarRight">
      <div id="sidebarRightResize" title="拖动调整宽度"></div>
      <div class="sr-section">
        <div class="sr-title" data-toggle><span class="chev">▼</span>安全与星级</div>
        <div class="sr-body">
          <div class="sr-star-row">
            <span class="sr-lock" id="srLock" title="标记为私密"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.2"/><path d="M12 16.2v2"/></svg></span>
            <div class="sr-stars" id="srStars">
              <span class="star" data-level="1">★</span><span class="star" data-level="2">★</span>
              <span class="star" data-level="3">★</span><span class="star" data-level="4">★</span>
              <span class="star" data-level="5">★</span>
            </div>
          </div>
        </div>
      </div>
      <div class="sr-section" data-section="edit">
        <div class="sr-title" data-toggle><span class="chev">▼</span>编辑</div>
        <div class="sr-body">
          <div class="sr-edit-row">
            <button class="sr-edit-btn" data-cmd="bold" title="加粗"><svg viewBox="0 0 24 24"><path d="M7 4h6a4 4 0 0 1 0 8H7z"/><path d="M7 12h7a4 4 0 0 1 0 8H7z"/></svg></button>
            <button class="sr-edit-btn" data-cmd="italic" title="斜体"><svg viewBox="0 0 24 24"><path d="M10 4h8M6 20h8M14 4l-4 16"/></svg></button>
            <button class="sr-edit-btn" data-cmd="underline" title="下划线"><svg viewBox="0 0 24 24"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><path d="M5 21h14"/></svg></button>
            <button class="sr-edit-btn" data-cmd="strike" title="删除线"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M7 8a4 4 0 0 1 4-3h2a4 4 0 0 1 3 6"/><path d="M17 16a4 4 0 0 1-4 3h-2a4 4 0 0 1-3-6"/></svg></button>
            <button class="sr-edit-btn" data-cmd="painter" title="格式刷（先选中带格式的文字，再选中目标文字）"><svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 9v2h6V9"/><path d="M12 11v6"/><path d="M9 17h6"/></svg></button>
          </div>
          <div class="sr-edit-row">
            <button class="sr-edit-btn" data-cmd="color" title="字体颜色"><svg viewBox="0 0 24 24"><path d="M5 16L11 4l6 12"/><path d="M7.5 12h7"/><path d="M4 20h16"/></svg></button>
            <button class="sr-edit-btn" data-cmd="bg" title="背景颜色（可选透明）"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 16l8-8 4 4-8 8H6z"/><path d="M14 8l3-3 3 3-3 3"/></svg></button>
            <button class="sr-edit-btn" data-cmd="size" title="字号"><svg viewBox="0 0 24 24"><path d="M4 18L9 6l5 12"/><path d="M6 14h6"/><path d="M18 6v12M15 9l3-3 3 3M15 15l3 3 3-3"/></svg></button>
            <button class="sr-edit-btn" data-cmd="cal" title="添加到日历"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 13v5M9.5 15.5h5"/></svg></button>
            <button class="sr-edit-btn" data-cmd="db" title="添加到数据库"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg></button>
          </div>
          <div class="sr-edit-row">
            <button class="sr-edit-btn" data-cmd="undo" title="撤销"><svg viewBox="0 0 24 24"><path d="M9 7H15a5 5 0 0 1 0 10h-4"/><path d="M9 7L5 11l4 4"/></svg></button>
            <button class="sr-edit-btn" data-cmd="redo" title="恢复"><svg viewBox="0 0 24 24"><path d="M15 7H9a5 5 0 0 0 0 10h4"/><path d="M15 7l4 4-4 4"/></svg></button>
            <button class="sr-edit-btn" data-cmd="copy" title="复制"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M5 16V5a1 1 0 0 1 1-1h11"/></svg></button>
            <button class="sr-edit-btn" data-cmd="cut" title="剪切"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 16L18 4M16 16L6 4"/></svg></button>
            <button class="sr-edit-btn" data-cmd="paste" title="粘贴"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4h6v2H9z"/><path d="M9 12h6M9 16h4"/></svg></button>
          </div>
        </div>
      </div>
      <div class="sr-section">
        <div class="sr-title" data-toggle><span class="chev">▼</span>展开 / 收起</div>
        <div class="sr-body">
          <button class="sr-btn" data-expand="all"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 9l8-5 8 5"/><path d="M4 15l8 5 8-5"/></svg></span>展开全部</button>
          <button class="sr-btn" data-expand="none"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 9h12M6 15h12"/></svg></span>收起全部</button>
          <button class="sr-btn" data-expand="l1"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10"/><path d="M4 17l6-5-6-5"/></svg></span>展开到一级</button>
          <button class="sr-btn" data-expand="l2"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h10M4 15h6"/><path d="M4 19l6-4-6-4"/></svg></span>展开到二级</button>
        </div>
      </div>
      <div class="sr-section" data-section="links">
        <div class="sr-title" data-toggle><span class="chev">▼</span>链接 / 反链</div>
        <div class="sr-body" id="srBacklinks"></div>
      </div>
      <div class="sr-section">
        <div class="sr-title" data-toggle><span class="chev">▼</span>保存 / 下载</div>
        <div class="sr-body">
          <button class="sr-btn" data-download="template"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 8.5h18"/><path d="M13.5 12h5M13.5 15.5h5"/></svg></span>保存为模板</button>
          <button class="sr-btn" id="btnExportICS"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 14l-3 3 3 3 3-3"/></svg></span>下载 ICS</button>
          <button class="sr-btn" data-download="png"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="8" cy="10" r="1.5"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg></span>下载 PNG</button>
          <button class="sr-btn" data-download="html"><span class="ic"><svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg></span>下载 HTML</button>
          <button class="sr-btn" data-download="opml"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg></span>下载 OPML</button>
          <button class="sr-btn" data-download="excel"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.5h18M9.5 9.5V20M15.5 9.5V20"/></svg></span>下载 Excel</button>
          <button class="sr-btn" data-download="md"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8v8M9 12l2 2 2-2M13 16V8"/></svg></span>下载 Markdown</button>
          <button class="sr-btn" id="btnBackupSide"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 19h14"/></svg></span>下载 JSON（完整备份）</button>
        </div>
      </div>
      <div class="sr-section collapsed">
        <div class="sr-title" data-toggle><span class="chev">▼</span>打印</div>
        <div class="sr-body">
          <!-- 【UI修复8】删除与折叠头重复的“打印”按钮，打印面板由折叠头展开 -->
          <div class="sr-print-panel" id="srPrintPanel">
            <label class="sr-print-opt"><input type="radio" name="printMode" value="all" checked>全部内容</label>
            <label class="sr-print-opt"><input type="radio" name="printMode" value="current">仅当前文档</label>
            <label class="sr-print-opt"><input type="radio" name="printMode" value="selection">选定内容</label>
            <label class="sr-print-opt"><input type="checkbox" id="printWithMeta">包含元信息</label>
            <button class="btn print-primary" style="width:100%;margin-top:6px;" id="btnPrintDo">确认打印</button>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>
<div class="panel" id="settingsPanel">
  <div class="panel-head">⚙ 设置<button class="close" id="settingsClose">✕</button></div>
  <div class="settings-body">
    <div class="settings-item"><label>全库加密</label><span class="switch" id="setEncrypt"></span></div>
    <div class="settings-item"><label>系统提醒通知</label><span class="switch" id="setReminder"></span></div>
    <div class="settings-item"><label>关闭应用时自动备份全部数据</label><span class="switch" id="setAutoBackupClose"></span></div>
    <div class="settings-item" id="rowExportDb" style="display:none"><label>导出 SQLite 数据库</label><button class="btn" id="btnExportDb">导出 .db</button></div>
    <div class="settings-item"><label>从备份恢复</label><button class="btn" id="btnRestoreBackup">导入备份（JSON / .db）</button></div>
    <div class="settings-item"><label>反馈与错误上报</label><button class="btn" id="btnFeedback">反馈</button></div>
    <!-- 【UI修复8】已删除“已知问题与限制”项 -->
    <div class="settings-item"><label>字号</label><input type="range" id="setFontSize" min="70" max="200" step="5" value="100"><span class="size-val" id="setFontSizeVal">100%</span></div>
    <div class="settings-item"><label>快捷键</label><button class="btn" id="setShortcuts">查看</button></div>
  </div>
</div>
<div class="panel" id="remindPanel">
  <div class="panel-head">🔔 今日待办</div>
  <div class="remind-list" id="remindList" style="max-height:320px;overflow-y:auto;padding:6px 8px"></div>
  <div class="remind-foot">
    <span class="remind-status" id="remindStatus"><span class="dot"></span><span>系统提醒未开启</span></span>
    <span style="flex:1"></span>
    <button class="btn" id="remindGoCal">查看日历</button>
  </div>
</div>
<div class="pomo-timer" id="pomoTimer" style="display:none">
  <div class="ft-head"><span class="ft-title">⏱ 番茄钟</span><button class="close" id="pomoClose">✕</button></div>
  <div class="pomo-time" id="pomoTime">25:00</div>
  <div class="pomo-btns"><button class="btn" id="pomoStart">开始</button><button class="btn" id="pomoReset">重置</button></div>

function undo(){

  historyFuture.push(_patch);  /* 不 invert，直接传递同一 patch 引用（与原 safeClone 行为一致） */
  state=applyPatch(state,_patch,'undo');

     - fromState=post 状态（_preState），toState=pre 状态（state）
     - 与正向 commit 共用 updateIncrementalIndexes

      if(_changedIds.size){
        const _res=updateIncrementalIndexes(_changedIds,_preState,state,{op:(_patch.op||'unknown')+':undo',direction:'undo'});
        if(!_res.ok){
          reportIndexFailure({op:(_patch.op||'unknown')+':undo',index:_res.errors[0]||'unknown',changedIds:_changedIds,error:_res.errors.join('; '),ts:_patch.t});
          _calIndexCache=null;_tagIndexCache=null;_searchInverted=null;_backlinkMap=null;
        }else{
          resetIndexFailureStreak();
        }
      }
    }catch(_e){l6InjectionFailure('undo',_patch&&_patch.op,_e,_patch&&_patch.t);}
  }

  /* L6 阶段 2：跳过 invalidateCalIndex 对 4 索引的清理（L6 已通过 updateIncrementalIndexes 维护）；
     仅清理非 L6 索引（_calRecurCache / _yearCountsCache / _calDayCache / _renderDayCache）*/
  _calRecurCache=null;_yearCountsCache=null;_calDayCache=null;_renderDayCache=null;

  const _patch=historyFuture.pop();

let _outlineSel={docId:null,anchorId:null,ids:new Set()};

function outlineVisibleSeq(doc){
  const seq=[];
  (function walk(n){
    if(!n)return;
    seq.push(n.id);
    if(!n.collapsed&&n.children)n.children.forEach(cid=>{const cn=N(cid);if(cn)walk(cn);});
  })(doc);

function toggleOutlineSel(id){

function outlineSelectRange(doc,anchorId,targetId,additive){
  const seq=outlineVisibleSeq(doc);

  if(ai<0||ti<0)return;
  const lo=Math.min(ai,ti),hi=Math.max(ai,ti);
  const range=new Set(seq.slice(lo,hi+1));
  if(additive){
    const ids=new Set(_outlineSel.ids);
    range.forEach(id=>ids.add(id));
    _outlineSel.ids=ids;
  }else{
    _outlineSel.ids=range;
  }

  forceRender();

  }

function outlineBatchMove(tops,toParentId,toIndex){
  if(!tops.length)return;

  const doc=getCurrentDoc();

    if(!to)return;
    /* 【F3/fixed19】记录被摘除 tops 中原本位于 toIndex 之前的数量：摘除后需把目标索引左移该数量，
       否则同父前移时插入点偏右（[A,B,C,D,E] 拖 A 到 B 后旧逻辑得 [B,C,A,D,E]，正确应为 [B,A,C,D,E]）。 */
    let removedBefore=0;

      const n=s.nodes[id];if(!n)continue;
      const p=s.nodes[n.parent];
      if(p===to){const i=p.children.indexOf(id);if(i>=0&&i<toIndex)removedBefore++;}
    }

      const n=s.nodes[id];if(!n)return;
      const p=s.nodes[n.parent];
      if(p){const i=p.children.indexOf(id);if(i>=0)p.children.splice(i,1);}

      to.children.splice(idx,0,id);

function outlineBatchIndent(){
  const doc=getCurrentDoc();if(!doc)return;
  const tops=topSelected(doc);
  if(!tops.length)return;
  commit(s=>{
    tops.forEach(id=>{
      const n=s.nodes[id];if(!n)return;
      const p=s.nodes[n.parent];if(!p)return;
      const idx=p.children.indexOf(id);
      if(idx<=0)return;
      const prev=p.children[idx-1];
      const pv=s.nodes[prev];if(!pv)return;
      const fi=p.children.indexOf(id);
      p.children.splice(fi,1);

function outlineBatchOutdent(){
  const doc=getCurrentDoc();if(!doc)return;

    tops.forEach(id=>{
      const n=s.nodes[id];if(!n)return;

  const n=N(id);if(!n)return null;

  const oc=document.querySelector('.outline').getBoundingClientRect();

    index=anc.children.indexOf(branch.id)+(after?1:0);

    const par=N(n.parent);

    parent=par.id;
    index=par.children.indexOf(id)+(after?1:0);
    lineTop=after?rc.bottom:rc.top;
    lineLeft=baseX+depth*22;

function outlineDragMove(e){
  if(!_dragState)return;
  const dx=e.clientX-_dragState.startX,dy=e.clientY-_dragState.startY;
  if(!_dragState.active){
    if(Math.abs(dx)<5&&Math.abs(dy)<5)return;
    _dragState.active=true;
    const ghost=document.createElement('div');ghost.className='outline-ghost';
    ghost.textContent='移动 '+_dragState.tops.length+' 个节点';
    document.body.appendChild(ghost);
    const line=document.createElement('div');line.className='outline-drop-line';
    document.body.appendChild(line);
    _dragState.ghost=ghost;_dragState.line=line;
    document.body.classList.add('drag-outline');
    _dragState.tops.forEach(id=>{
      const el=document.querySelector('.outline .node[data-id="'+CSS.escape(id)+'"] > .row');
      if(el)el.classList.add('dragging');
    });
  }
  if(_dragState.ghost){
    _dragState.ghost.style.left=(e.clientX+12)+'px';
    _dragState.ghost.style.top=(e.clientY+12)+'px';
  }
  const t=outlineDropTarget(e.clientX,e.clientY);
  _dragState.cur=t;
  if(t&&_dragState.line){
    _dragState.line.style.display='block';
    _dragState.line.style.left=(t.lineLeft)+'px';
    _dragState.line.style.top=(t.lineTop-1)+'px';
    _dragState.line.style.width=(t.lineWidth)+'px';
  }else if(_dragState.line){
    _dragState.line.style.display='none';
  }
  const sc=document.getElementById('content');
  if(sc){
    const r=sc.getBoundingClientRect();
    if(e.clientY<r.top+46)sc.scrollTop-=14;
    else if(e.clientY>r.bottom-46)sc.scrollTop+=14;
  }
}

  const ds=_dragState;
  if(!ds)return;
  _dragState=null;
  document.removeEventListener('mousemove',outlineDragMove);
  document.removeEventListener('mouseup',outlineDragEnd);
  if(ds.ghost)ds.ghost.remove();
  if(ds.line)ds.line.remove();
  document.body.classList.remove('drag-outline');
  ds.tops.forEach(id=>{
    const el=document.querySelector('.outline .node[data-id="'+CSS.escape(id)+'"] > .row');
    if(el)el.classList.remove('dragging');
  });

    const t=ds.cur;
    outlineBatchMove(ds.tops,t.parent,t.index);
  }
}

function previousVisible(id){

    let prev=p.children[i-1];

    const _vis=new Set();
    while(N(prev)&&N(prev).children.length&&!N(prev).collapsed&&!_vis.has(prev)){_vis.add(prev);const c=N(prev).children;prev=c[c.length-1];}

function nextVisible(id){

  let cur=id;
  const _vis=new Set(); /* FIX-P1-7: 上溯加 visited 兜底——父链成环（数据损坏）时原 while(cur) 死循环 */

    _vis.add(cur);
    const parentId=N(cur)?.parent;
    if(!parentId)return null;
    const p=N(parentId);
    if(!p)return null;
    const i=p.children.indexOf(cur);
    if(i<p.children.length-1)return p.children[i+1];

function ensureCalendarRoot(){

  for(const nid in state.nodes){if(state.nodes[nid]._isCalRoot){id=nid;break;}}
  if(id)return id;
  id=uid();
  commit(s=>{
    const root=s.nodes[s.rootId];
    if(!root)return;
    s.nodes[id]={id,text:'日历待办',parent:root.id,children:[],collapsed:false,
      done:false,date:null,tags:[],priority:0,recur:null,habit:null,time:null,
      note:null,color:null,showInCal:false,_isCalRoot:true,_isFolder:true,
      createdAt:Date.now(),updatedAt:Date.now()};
    root.children.push(id);

  dedupCalRoots();

function getCalendarRootId(){
  for(const nid in state.nodes){if(state.nodes[nid]._isCalRoot)return nid;}

/* FIX-P0-2: 日历根多根去重——参照 dedupNoteRoots；多标签并发首开各自 commit 一个 _isCalRoot，
   合并后 state.nodes 可能同时存在两个日历根，getCalendarRootId 只取首个 → 第二根的待办在日历页不可见。
   只保留 createdAt 最早的根，其余根 children 挂入保留根并从旧父摘除；commit 带 noHistory 防撤销复活。 */
function dedupCalRoots(){
  try{
    const all=Object.values(state.nodes).filter(n=>n&&n._isCalRoot&&!n._deleted);
    if(all.length<=1)return;
    all.sort((a,b)=>((a.createdAt||0)-(b.createdAt||0))||(a.id<b.id?-1:a.id>b.id?1:0));
    const keep=all[0];
    all.slice(1).forEach(d=>{
      commit(s=>{
        const k=s.nodes[keep.id],dd=s.nodes[d.id];
        if(!k||!dd)return;
        (dd.children||[]).forEach(c=>{
          if(s.nodes[c]){
            s.nodes[c].parent=keep.id;
            if(!k.children.includes(c))k.children.push(c);
          }

        const p=s.nodes[dd.parent];
        if(p&&Array.isArray(p.children)){const i=p.children.indexOf(d.id);if(i>=0)p.children.splice(i,1);}

    });

}
function expandRecurring(n,targetDs){
  if(!n.recur||!n.date)return false;
  if(n.recurEnd&&targetDs>n.recurEnd)return false; /* 重复结束日期：超出后不再展开 */
  const base=parseYmd(n.date);
  const target=parseYmd(targetDs);
  if(isNaN(base.getTime())||isNaN(target.getTime()))return false;
  if(target<base)return false;
  const{freq,interval=1,weekday}=n.recur;
  if(freq==='daily'){const diff=Math.round((target-base)/86400000);return diff%interval===0;}
  if(freq==='weekly'){
    if(weekday!=null){
      if(target.getDay()!==weekday)return false;
      const bs=new Date(base);bs.setDate(bs.getDate()-bs.getDay());
      const ts=new Date(target);ts.setDate(ts.getDate()-ts.getDay());
      const weeks=Math.round((ts-bs)/86400000/7);
      return weeks>=0&&weeks%interval===0;
    }
    const diff=Math.round((target-base)/86400000);
    return diff%(7*interval)===0;
  }
  if(freq==='monthly'){
    return target.getDate()===base.getDate()&&
      ((target.getFullYear()-base.getFullYear())*12+(target.getMonth()-base.getMonth()))%interval===0;
  }
  if(freq==='yearly'){
    return target.getMonth()===base.getMonth()&&target.getDate()===base.getDate()&&
      (target.getFullYear()-base.getFullYear())%interval===0;
  }
  if(freq==='workday'){
    /* 每法定工作日：周一~周五且非法定休假日（isRestDay 表）；从 base 起按工作日计数取 interval */
    const dow=target.getDay();
    if(dow===0||dow===6)return false;
    if(isRestDay(target.getFullYear(),target.getMonth()+1,target.getDate()))return false;
    let wc=0;const cur=new Date(base);
    while(cur<target){
      const d=cur.getDay();
      if(d!==0&&d!==6&&!isRestDay(cur.getFullYear(),cur.getMonth()+1,cur.getDate()))wc++;
      cur.setDate(cur.getDate()+1);
    }
    return wc%interval===0;
  }
  if(freq==='lunar'){
    /* 每年（农历日）重复：目标年农历同月同日的公历日期与目标日一致 */
    if(target.getFullYear()===base.getFullYear())return false; /* 同年仅 base 自身（索引直接显示） */
    if(target.getFullYear()-base.getFullYear()<0)return false;
    if((target.getFullYear()-base.getFullYear())%interval!==0)return false;
    const lu=solarToLunar(base.getFullYear(),base.getMonth()+1,base.getDate());
    if(!lu)return false;
    const hit=lunarToSolarDate(target.getFullYear(),lu.month,lu.day);
    if(!hit)return false;
    return ymd(target)===ymd(new Date(hit.y,hit.m-1,hit.d));
  }
  return false;
}
/* 找公历年份 y 中农历 (lM,lD) 对应的公历日期；某年缺该农历日（如部分年份无大年三十）时返回 null */
function lunarToSolarDate(y,lM,lD){
  for(let m=1;m<=12;m++){
    const dim=new Date(y,m,0).getDate();
    for(let d=1;d<=dim;d++){
      const lu=solarToLunar(y,m,d);
      if(lu&&lu.month===lM&&lu.day===lD)return{y,m,d};
    }
  }
  return null;
}
/* L7-W4：calIndex 的两个「可让出」构建步骤。
   - 同步 buildCalIndex 传 deadline=Infinity（逐节点 _l7Now()>=Infinity 恒 false，语义与改造前逐字一致）
   - 异步 l7BuildCalIndexAsync 传真实 deadline 并在块间 _l7Yield() → 主线程无 >50ms 长任务
   同步/异步共用同一对步骤 → 口径 1:1 由结构保证（非两套实现） */
function _calSubtreeStep(stack,visited,idx,deadline){
  while(stack.length){
    const pid=stack.pop();
    if(visited.has(pid))continue;
    visited.add(pid);
    const parent=N(pid);if(!parent)continue;
    (parent.children||[]).forEach(cid=>{
      const n=N(cid);
      if(!n||n._deleted)return;
      if(n.date){if(!idx.has(n.date))idx.set(n.date,new Set());idx.get(n.date).add(cid);}
      stack.push(cid);
    });

   用 visited 去重防双计；calRoot 子树待办语义不变，日历视图不出现重复条目。 */
function _calSweepStep(ids,i,deadline,visited,idx){
  while(i<ids.length){
    const id=ids[i];i++;

    if(n&&!n._deleted&&n.date&&!visited.has(id)){ /* 已在 calRoot 子树，跳过 */
      visited.add(id);
      if(!idx.has(n.date))idx.set(n.date,new Set());
      idx.get(n.date).add(id);
    }
    if(_l7Now()>=deadline)break;
  }
  return i;

function buildYearCounts(year){

  const counts=new Map();
  const calRootId=getCalendarRootId();
  const stack=[calRootId];const visited=new Set();
  while(stack.length){
    const pid=stack.pop();
    if(visited.has(pid))continue;
    visited.add(pid);

    (parent.children||[]).forEach(cid=>{
      const n=N(cid);

        if(n.date&&n.date.startsWith(year+'-'))counts.set(n.date,(counts.get(n.date)||0)+1);
        if(n.recur&&n.date){
          const base=parseYmd(n.date);
          if(!isNaN(base.getTime())){
            const{freq,interval=1,weekday}=n.recur;
            const yearStart=new Date(year,0,1);
            const yearEnd=new Date(year,11,31);

              while(first.getDay()!==wd)first.setDate(first.getDate()+1);
              const bs=new Date(base);bs.setDate(bs.getDate()-bs.getDay());

                  const weeks=Math.round((ts-bs)/86400000/7);
                  if(weeks>=0&&weeks%interval===0)step(d);

              for(let mm=0;mm<12;mm++){
                const d=new Date(year,mm,base.getDate());
                if(d.getMonth()!==mm)continue;
                if(d<base||d>yearEnd)continue;

function solarToLunar(y,m,d){
  if(y<LUNAR_MIN||y>LUNAR_MAX)return null;
  let offset=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  if(offset<0)return null;
  let i,temp=0;
  for(i=1900;i<=LUNAR_MAX&&offset>0;i++){temp=lYearDays(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  const year=i,leap=leapMonth(year);
  let isLeap=false,j;
  for(j=1;j<13&&offset>0;j++){
    if(leap>0&&j===leap+1&&!isLeap){--j;isLeap=true;temp=leapDays(year);}
    else temp=monthDays(year,j);
    if(isLeap&&j===leap+1)isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&j===leap+1){if(isLeap){isLeap=false;}else{isLeap=true;--j;}}
  if(offset<0){offset+=temp;--j;}
  const month=j,day=offset+1;
  if(month<1||month>12||day<1||day>30)return null;
  return{year,month,day,isLeap};
}

const SOLAR_FEST={'01-01':'元旦','02-14':'情人节','03-08':'妇女节','03-12':'植树节','04-01':'愚人节','05-01':'劳动节','05-04':'青年节','06-01':'儿童节','07-01':'建党节','08-01':'建军节','09-10':'教师节','10-01':'国庆节','12-24':'平安夜','12-25':'圣诞节'};
